entById('rerollGallery').onclick=()=>buildGallery(true);\n\nlet currentSVG='';\nfunction render(){\n  if(params.layered) snapshotActive();\n  currentSVG=GeomeBack.svg(params);\n  document.getElementById('stageMain').innerHTML=currentSVG;\n  const sw=document.getElementById('stageMain');\n  sw.style.maxWidth = params.format==='back' ? '440px' : (params.format==='poster' ? '560px' : '860px');\n  const swWrap=document.getElementById('stageWrap'); if(swWrap) swWrap.style.maxWidth=sw.style.maxWidth;\n  const pal=GeomeTiles.makePalette(params.palette,params.hue);\n  const symName=params.radialSym==='diagonal'?`D4 diagonal · 8 mirror axes (H+V+both diagonals)`\n    :params.radialSym==='cross'?`cross-axial · D2 (V+H mirror, differentiated quadrant)`\n    :`D${params.order} · ${params.order}-fold dihedral mandala`;\n  const sym=params.layout==='radial' ? symName\n    :(params.symmetry==='centro'?'centrosymmetric · 180° invariant (no up/down)':'pmm · bilateral mirror axes');\n  const extras=[]; if(params.layout==='radial'){\n    if(params.concentric)extras.push('concentric-only');\n    if(params.moire!=='none')extras.push('moiré');\n    if(params.linead!=='none')extras.push('linead');\n    if(params.coreRad!=='none')extras.push('core-radiance');\n  }\n  const core = (params.layout==='radial'&&params.solid!=='none')?` · ${GeomeTiles.SOLIDS[params.solid].label} core`:'';\n  const ex = extras.length?` · ${extras.join(' + ')}`:'';\n  const mc = params.multiCenter\n    ? (params.multiMode==='tiled'\n        ? `continuous ${params.lattice==='square'?'p4m · 4-fold':'p6m · 6-fold'} field · ${params.centersAcross} centers across · fills frame${params.interference?' · interference':''}`\n        : `${params.centersLayout} · ${params.globalSym}${params.centerCount} centers${params.planeB?' · two-plane':''}`)\n    : null;\n  document.getElementById('meta').innerHTML=`Geome · ${palLabel(params.palette)} · ${params.layout}${core}${ex} · seed ${params.seed}<br>${mc||sym}`;\n  if(fsOpen()){ document.getElementById('fsStage').innerHTML=currentSVG; document.getElementById('fsMeta').innerHTML=document.getElementById('meta').innerHTML; fitFS(); }\n  // NOTE: render() no longer rebuilds the 6-thumb gallery. That rebuild (6 full\n  // multi-center SVGs) firing on every slider tick was a ~7× paint multiplier and\n  // the main crash amplifier. The gallery is now rebuilt ONLY on structural\n  // changes (reroll / format / scheme / multi toggle) via buildGallery(); here we\n  // just move the active-thumb highlight.\n  document.querySelectorAll('#gallery .thumb').forEach(t=>t.classList.toggle('active',+t.dataset.seed===params.seed));\n  if(typeof activeTab!=='undefined' && activeTab==='editor') renderCellPreview();\n  if(typeof scheduleAutosave==='function') scheduleAutosave();\n}\n\n// ── fullscreen viewer ───────────────────────────────────────────────────\nconst fsEl=document.getElementById('fsOverlay'), fsStage=document.getElementById('fsStage');\nlet fsState={ fit:'contain', zoom:1, panX:0, panY:0, dragging:false, sx:0, sy:0 };\nfunction fsOpen(){ return fsEl.classList.contains('open'); }\nfunction fitFS(){\n  const d=GeomeBack.dims(params);\n  const barH=0, pad=fsState.fit==='100'?0:48;\n  const vw=window.innerWidth-pad, vh=window.innerHeight-pad;\n  let scale;\n  if(fsState.fit==='width') scale=vw/d.w;\n  else if(fsState.fit==='height') scale=vh/d.h;\n  else if(fsState.fit==='100') scale=1;\n  else scale=Math.min(vw/d.w, vh/d.h);            // contain\n  scale*=fsState.zoom;\n  const w=d.w*scale, h=d.h*scale;\n  fsStage.style.width=w+'px'; fsStage.style.height=h+'px';\n  fsStage.style.transform=`translate(${fsState.panX}px,${fsState.panY}px)`;\n}\nfunction openFS(){\n  fsState={ fit:'contain', zoom:1, panX:0, panY:0, dragging:false, sx:0, sy:0 };\n  document.querySelectorAll('#fsFit button').forEach(b=>b.classList.toggle('active',b.dataset.fit==='contain'));\n  fsStage.innerHTML=currentSVG;\n  document.getElementById('fsMeta').innerHTML=document.getElementById('meta').innerHTML;\n  fsEl.classList.add('open','show-bar');\n  fitFS();\n  setTimeout(()=>fsEl.classList.remove('show-bar'),1400);\n  // if animation is playing, re-bind its targets to the fullscreen copy\n  if(anim.playing){ anim.last=0; cancelAnimationFrame(anim.raf); anim.raf=requestAnimationFrame(animFrame); }\n}\nfunction closeFS(){\n  fsEl.classList.remove('open');\n  fsStage.innerHTML='';\n  if(anim.playing){ anim.last=0; cancelAnimationFrame(anim.raf); anim.raf=requestAnimationFrame(animFrame); }\n}\n\n// ── pop out → standalone HTML artifact (true OS fullscreen, all sizes) ───\n// The in-panel overlay can only fill THIS iframe (document.fullscreenEnabled is\n// false in the sandbox). A new top-level tab is NOT sandboxed, so the real\n// Fullscreen API works there. We embed the current design rendered at EVERY\n// format as inline SVG + a self-contained viewer (size switch · fit · zoom ·\n// pan · ⛶ fullscreen). No engine needed in the popout — it's a pure viewer.\nconst POP_FORMATS=[['back','Card back · 700×1200'],['poster','Poster · 1000×1000'],\n  ['posterWide','Poster wide · 1600×1000'],['exhibition','Exhibition 16:9 · 1920×1080'],\n  ['exhibitionUltra','Exhibition 21:9 · 2560×1080']];\nfunction buildStandaloneViewer(){\n  const DATA={};\n  POP_FORMATS.forEach(([fmt,label])=>{\n    const p=Object.assign({},params,{format:fmt});\n    const d=GeomeBack.dims(p);\n    DATA[fmt]={label,w:d.w,h:d.h,svg:GeomeBack.svg(p)};\n  });\n  const cur=POP_FORMATS.some(f=>f[0]===params.format)?params.format:'poster';\n  const metaTxt=(document.getElementById('meta').textContent||'Geome').replace(/\\s+/g,' ').trim();\n  const json=JSON.stringify(DATA).replace(/<\\//g,'<\\\\/');\n  const order=JSON.stringify(POP_FORMATS.map(f=>f[0]));\n  return `<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Geome viewer · ${metaTxt}<\u002Ftitle>\n<style>\n  *{margin:0;padding:0;box-sizing:border-box;}\n  html,body{height:100%;background:#0b0b0c;overflow:hidden;font-family:-apple-system,'Segoe UI',sans-serif;color:#e8e2d4;}\n  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:18px;flex-wrap:wrap;\n    padding:11px 18px;background:linear-gradient(180deg,rgba(11,11,12,.96),rgba(11,11,12,.55) 78%,transparent);\n    transition:opacity .25s;}\n  body.idle #bar{opacity:0;pointer-events:none;}\n  #ttl{font-family:'Courier New',monospace;font-size:12px;color:#b9ad90;white-space:nowrap;line-height:1.4;}\n  .grp{display:flex;gap:0;border:1px solid rgba(255,255,255,.16);border-radius:9px;overflow:hidden;}\n  .grp button{background:rgba(255,255,255,.04);color:#e8e2d4;border:none;border-left:1px solid rgba(255,255,255,.1);\n    padding:8px 13px;font-size:12px;font-family:inherit;cursor:pointer;transition:.12s;white-space:nowrap;}\n  .grp button:first-child{border-left:none;}\n  .grp button:hover{background:rgba(255,255,255,.12);}\n  .grp button.active{background:#d97a3c;color:#fff;}\n  .spacer{flex:1;}\n  .solo{background:rgba(255,255,255,.06);color:#e8e2d4;border:1px solid rgba(255,255,255,.16);border-radius:9px;\n    padding:8px 14px;font-size:12px;font-family:inherit;cursor:pointer;transition:.12s;white-space:nowrap;}\n  .solo:hover{background:rgba(255,255,255,.16);}\n  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;}\n  #wrap.grab{cursor:grabbing;}\n  #stage svg{display:block;width:100%;height:100%;box-shadow:0 50px 120px -30px rgba(0,0,0,.85);border-radius:5px;}\n  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-family:'Courier New',monospace;\n    font-size:11px;color:rgba(255,255,255,.38);transition:opacity .25s;}\n  body.idle #hint{opacity:0;}\n<\u002Fstyle><\u002Fhead><body>\n<div id=\"bar\">\n  <div id=\"ttl\"><\u002Fdiv>\n  <div class=\"grp\" id=\"sizes\"><\u002Fdiv>\n  <div class=\"grp\" id=\"fits\">\n    <button data-fit=\"contain\" class=\"active\">Fit<\u002Fbutton>\n    <button data-fit=\"width\">Fill W<\u002Fbutton>\n    <button data-fit=\"height\">Fill H<\u002Fbutton>\n    <button data-fit=\"100\">100%<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"spacer\"><\u002Fdiv>\n  <button class=\"solo\" id=\"reset\">Reset view<\u002Fbutton>\n  <button class=\"solo\" id=\"full\">⛶ Fullscreen · F<\u002Fbutton>\n<\u002Fdiv>\n<div id=\"wrap\"><div id=\"stage\"><\u002Fdiv><\u002Fdiv>\n<div id=\"hint\">scroll to zoom · drag to pan · F fullscreen · 1–5 switch size<\u002Fdiv>\n<script>\nvar DATA=${json}, ORDER=${order}, ACTIVE=\"${cur}\";\nvar wrap=document.getElementById('wrap'), stage=document.getElementById('stage'), ttl=document.getElementById('ttl');\nvar fit=\"contain\", zoom=1, panX=0, panY=0, drag=false, sx=0, sy=0;\nvar sizesEl=document.getElementById('sizes');\nORDER.forEach(function(fmt,i){\n  var b=document.createElement('button'); b.dataset.fmt=fmt;\n  b.textContent=(i+1)+' · '+DATA[fmt].label.split(' · ')[0];\n  b.title=DATA[fmt].label; b.onclick=function(){show(fmt);}; sizesEl.appendChild(b);\n});\nfunction layout(){\n  var d=DATA[ACTIVE], pad=(fit==='100')?0:70;\n  var vw=innerWidth-pad, vh=innerHeight-pad, s;\n  if(fit==='width')s=vw/d.w; else if(fit==='height')s=vh/d.h; else if(fit==='100')s=1;\n  else s=Math.min(vw/d.w, vh/d.h);\n  s*=zoom; stage.style.width=(d.w*s)+'px'; stage.style.height=(d.h*s)+'px';\n  stage.style.transform='translate('+panX+'px,'+panY+'px)';\n}\nfunction show(fmt){\n  ACTIVE=fmt; stage.innerHTML=DATA[fmt].svg; ttl.innerHTML=DATA[fmt].label;\n  Array.prototype.forEach.call(document.querySelectorAll('#sizes button'),function(b){b.classList.toggle('active',b.dataset.fmt===fmt);});\n  zoom=1; panX=0; panY=0; layout();\n}\nArray.prototype.forEach.call(document.querySelectorAll('#fits button'),function(b){\n  b.onclick=function(){ Array.prototype.forEach.call(document.querySelectorAll('#fits button'),function(x){x.classList.toggle('active',x===b);});\n d(card);\n  });\n  const rWrap=document.getElementById('cut-rings'); if(!rWrap) return;\n  rWrap.innerHTML='';\n  const n=(params.layout==='grid')?Math.max(1,params.unit):params.rings;\n  for(let r=0;r<n;r++){\n    const chip=document.createElement('button');\n    chip.className='ringchip'+(params.layerCutRings.includes(r)?' sel':'');\n    chip.textContent=r;\n    chip.onclick=()=>{toggleArr(params.layerCutRings,r);snapshotActive();buildCutSelectors();buildLayerStack();render();};\n    rWrap.appendChild(chip);\n  }\n  buildCutPieces();\n  buildCutColors();\n  buildCutFamilies();\n  buildCutHexChips();\n  syncFilterControls();\n  updateCutSelectorVisibility();\n}\n// swatch chips for every distinct colour in the active layer's (palMod-resolved)\n// palette; toggling one cuts windows through all geometry drawn in that colour.\nfunction buildCutColors(){\n  const wrap=document.getElementById('cut-colors'); if(!wrap) return;\n  const pal=GeomeTiles.applyPalMod(GeomeTiles.makePalette(params.palette,params.hue), params.palMod);\n  const roles=[['fA','Form A'],['fB','Form B'],['disc','Disc'],['accent','Accent'],['ink','Ink']];\n  params.layerCutColors=params.layerCutColors||[];\n  const seen={};\n  wrap.innerHTML='';\n  roles.forEach(([key,label])=>{\n    const col=pal[key];\n    if(!col || col==='none' || seen[col]) return;   // skip empty + duplicate colours\n    seen[col]=1;\n    const on=params.layerCutColors.includes(key);\n    const b=document.createElement('button');\n    b.className='colorcut-chip'+(on?' sel':'');\n    b.innerHTML='<i style=\"background:'+col+'\"><\u002Fi><span>'+label+'<\u002Fspan>';\n    b.title=label+' — '+col;\n    b.onclick=()=>{ toggleArr(params.layerCutColors,key); snapshotActive(); buildCutColors(); buildLayerStack(); render(); };\n    wrap.appendChild(b);\n  });\n}\n// ── COLOUR-DROP by family + eyedropper (P2/P3) ──────────────────────────────\nfunction specKey(s){ return s.family?('fam:'+s.family):('hex:'+s.hex); }\nfunction hasSpec(s){ querySelectorAll('#seg-layered button').forEach(x=>x.classList.toggle('active',x.dataset.v===(params.layered?'on':'off')));\n  setLayered(params.layered);\n  syncControlsFromParams(); syncLayout(); showMultiControls(); applyEditor();\n  buildSubunitStrip(); buildLayerList(); renderCellPreview();\n  if(params.layered){ buildLayerStack(); buildCutSelectors(); buildSingleSU(); updateKindControls(); }\n  render(); buildGallery(false);\n  return true;\n}\n// ── autosave (debounced) ──────────────────────────────────────────────\nvar _autosaveArmed=false, _autosaveTimer=null;\nfunction scheduleAutosave(){\n  if(!_autosaveArmed) return;\n  clearTimeout(_autosaveTimer);\n  _autosaveTimer=setTimeout(()=>{ try{ localStorage.setItem(AUTO_KEY, JSON.stringify(serializeSession('__auto'))); }catch(_){} }, 800);\n}\n// ── named slots ───────────────────────────────────────────────────────\nfunction loadSlots(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||'{}'); }catch(_){ return {}; } }\nfunction saveSlots(o){ try{ localStorage.setItem(SESS_KEY, JSON.stringify(o)); }catch(e){ alert('Storage full — export to a .geome file instead.'); } }\nfunction buildSessionList(){\n  const wrap=document.getElementById('sess-list'); if(!wrap) return;\n  const slots=loadSlots(); const ids=Object.keys(slots).sort((a,b)=>(slots[b].savedAt||0)-(slots[a].savedAt||0));\n  wrap.innerHTML='';\n  if(!ids.length){ wrap.innerHTML='<div class=\"sess-empty\">No saved sessions yet.<\u002Fdiv>'; return; }\n  ids.forEach(id=>{\n    const s=slots[id];\n    const card=document.createElement('div'); card.className='sess-card';\n    const when=new Date(s.savedAt||Date.now());\n    card.innerHTML=\n      `<div class=\"sess-th\">${s.thumb||''}<\u002Fdiv>`+\n      `<div class=\"sess-meta\"><div class=\"sess-name\" contenteditable=\"true\" spellcheck=\"false\">${(s.name||'Session').replace(/<\u002Fg,'&lt;')}<\u002Fdiv>`+\n      `<div class=\"sess-when\">${when.toLocaleDateString()} · ${when.toLocaleTimeString( document.body.appendChild(_jsonInput);\n_jsonInput.addEventListener('change',()=>{\n  const f=_jsonInput.files&&_jsonInput.files[0]; if(!f) return;\n  const r=new FileReader(); r.onload=()=>{ if(applySession(r.result)){ const o=loadSlots(); const id='s'+Date.now(); o[id]=serializeSession(f.name.replace(/\\.(geome\\.)?json$/i,'')); saveSlots(o); buildSessionList(); flashToast('Imported '+f.name, false); } else alert('Not a valid .geome session file.'); _jsonInput.value=''; };\n  r.readAsText(f);\n});\ndocument.getElementById('sessImport').onclick=()=>_jsonInput.click();\n// ── toast ─────────────────────────────────────────────────────────────\nconst _toast=document.getElementById('sessToast'), _toastMsg=document.getElementById('sessToastMsg');\nlet _toastTimer=null;\nfunction flashToast(msg, withActions){\n  _toastMsg.textContent=msg;\n  document.getElementById('sessToastYes').style.display=withActions?'':'none';\n  document.getElementById('sessToastNo').textContent=withActions?'Dismiss':'OK';\n  _toast.classList.add('show'); clearTimeout(_toastTimer);\n  if(!withActions) _toastTimer=setTimeout(()=>_toast.classList.remove('show'),1800);\n}\ndocument.getElementById('sessToastNo').onclick=()=>_toast.classList.remove('show');\n// ── resume-on-load ────────────────────────────────────────────────────\nconst _pendingAuto=(()=>{ try{ return localStorage.getItem(AUTO_KEY); }catch(_){ return null; } })();\nbuildSessionList();\nif(_pendingAuto){\n  flashToast('Resume your previous session?', true);\n  document.getElementById('sessToastYes').onclick=()=>{ applySession(_pendingAuto); _toast.classList.remove('show'); };\n}\n_autosaveArmed=true;   // arm only AFTER the init render, so default state never clobbers the saved auto\n<\u002Fscript>\n<script src=\"7fbfd88a-e888-40ec-ac8a-3f279a85df3a\"><\u002Fscript>\n<script src=\"683fbdbc-10ad-44db-bef9-c7924c6ca0ac\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
