=\"active\">Line · fringe<\u002Fbutton>\n              <button data-v=\"filled\">Filled · tamed<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Channel pair<\u002Flabel>\n            <select id=\"sel-polyPair\" class=\"sel-full\">\n              <option value=\"redCyan\">Red / Cyan<\u002Foption>\n              <option value=\"magentaGreen\">Magenta / Green<\u002Foption>\n              <option value=\"amberAzure\">Amber / Azure<\u002Foption>\n              <option value=\"violetLime\">Violet / Lime<\u002Foption>\n              <option value=\"goldMono\">Gold (single chroma)<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Plate intensity <span class=\"note-inline\">black dominance<\u002Fspan> <span class=\"value-display\" id=\"polyIntensity-v\">0.92<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"polyIntensity\" min=\"0.3\" max=\"1\" step=\"0.02\" value=\"0.92\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Blend<\u002Flabel>\n            <div class=\"segmented c3\" id=\"seg-polyBlend\">\n              <button data-v=\"screen\" class=\"active\">Screen<\u002Fbutton>\n              <button data-v=\"lighten\">Lighten<\u002Fbutton>\n              <button data-v=\"difference\">Diff<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv><!-- /poly-controls -->\n\n        <div id=\"tiled-controls\">\n          <div class=\"note\" style=\"margin-bottom:14px;\">One continuous geome with <b>many centers of rotation<\u002Fb> woven edge-to-edge — a wallpaper field. No negative space.<\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Symmetry lattice<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-lattice\">\n              <button data-v=\"hex\" class=\"active\">6-fold · p6m<\u002Fbutton>\n              <button data-v=\"square\">4-fold · p4m<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Centers across <span class=\"value-display\" id=\"centersAcross-v\">3<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"centersAcross\" min=\"1.5\" max=\"7\" step=\"0.5\" value=\"3\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Weave detail <span class=\"value-display\" id=\"latticeDetail-v\">2<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"latticeDetail\" min=\"1\" max=\"4\" step=\"1\" value=\"2\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Field rotation <span class=\"value-display\" id=\"fieldRot-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"fieldRot\" min=\"0\" max=\"90\" step=\"1\" value=\"0\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Mark centers<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-centerdot\">\n              <button data-v=\"on\" class=\"active\">Accent dot<\u002Fbutton>\n              <button data-v=\"off\">Plain<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Decomposition depth <span class=\"note-inline\">levels deep<\u002Fspan> <span class=\"value-display\" id=\"depthBoost-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"depthBoost\" min=\"0\" max=\"4\" step=\"1\" value=\"0\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Subdivision <span class=\"note-inline\">k\\u00d7k per level<\u002Fspan><\u002Flabel>\n            <div class=\"segmented c4\" id=\"seg-decK\">\n              <button data-v=\"0\" class=\"active\">Mixed<\u002Fbutton>\n              <button data-v=\"2\">2\\u00d72<\u002Fbutton>\n              <button data-v=\"3\">3\\u00d73<\u002Fbutton>\n              <button data-v=\"4\">4\\u00d74<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Decomposition rule<\u002Flabel>\n            <div class=\"segmented c4\" id=\"seg-decRule\">\n              <button data-v=\"mixed\" class=\"active\">Mixed<\u002Fbutton>\n              <button data-v=\"grids\">Grids<\u002Fbutton>\n              <button data-v=\"forms\">Forms<\u002Fbutton>\n              <button data-v=\"concentric\">Nested<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Cell jitter <span class=\"note-inline\">break sameness<\u002Fspan> <span class=\"value-display\" id=\"decJitter-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"decJitter\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Inward density <span class=\"note-inline\">denser toward centers<\u002Fspan> <span class=\"value-display\" id=\"decInward-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"decInward\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Double-layer interference<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-interfere\">\n              <button data-v=\"off\" class=\"active\">Single<\u002Fbutton>\n              <button data-v=\"on\">Interfere<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"interfere-controls\" style=\"display:none;\">\n            <div class=\"note\" style=\"margin-bottom:14px;\">Two chroma-separated planes of the <b>same field<\u002Fb>; Plane B is offset and composited over black. <b>Plate intensity<\u002Fb> keeps the dark ground dominant so the diffraction fringe reads as light <b>on black<\u002Fb> rather than a full-frame wash.<\u002Fdiv>\n            <div class=\"control-group\">\n              <label>Channel pair<\u002Flabel>\n              <select id=\"sel-interferePair\" class=\"sel-full\">\n                <option value=\"redCyan\">Red / Cyan<\u002Foption>\n                <option value=\"magentaGreen\">Magenta / Green<\u002Foption>\n                <option value=\"amberAzure\">Amber / Azure<\u002Foption>\n                <option value=\"violetLime\">Violet / Lime<\u002Foption>\n              <\u002Fselect>\n            <\u002Fdiv>\n            <div class=\"control-group\">\n              <label>Plane offset <span class=\"value-display\" id=\"interfereShift-v\">0.06<\u002Fspan><\u002Flabel>\n              <input type=\"range\" id=\"interfereShift\" min=\"0\" max=\"0.3\" step=\"0.01\" value=\"0.06\">\n            <\u002Fdiv>\n            <div class=\"control-group\">\n              <label>Plane rotation ±° <span class=\"value-display\" id=\"interfereRot-v\">4<\u002Fspan><\u002Flabel>\n              <input type=\"range\" id=\"interfereRot\" min=\"-20\" max=\"20\" step=\"1\" value=\"4\">\n            <\u002Fdiv>\n            <div class=\"control-group\">\n              <label>Scale moiré <span class=\"value-display\" id=\"interfereScale-v\">0<\u002Fspan><\u002Flabel>\n              <input type=\"range\" id=\"interfereScale\" min=\"-0.1\" max=\"0.1\" step=\"0.01\" value=\"0\">\n            <\u002Fdiv>\n            <div class=\"control-group\">\n              <label>Plate intensity <span class=\"value-display\" id=\"interfereIntensity-v\">0.72<\u002Fspan><\u002Flabel>\n              <input type=\"range\" id=\"interfereIntensity\" min=\"0.3\" max=\"1\" step=\"0.02\" value=\"0.72\">\n            <\u002Fdiv>\n            <div class=\"control-group\">\n              <label>Blend<\u002Flabel>\n              <div class=\"segmented c3\" id=\"seg-interfereblend\">\n                <button data-v=\"screen\" class=\"active\">Screen<\u002Fbutton>\n                <button data-v=\"lighten\">Lighten<\u002Fbutton>\n                <button data-v=\"difference\">Diff<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"orbit-controls\" style=\"display:none;\">\n        <div class=\"control-group\">\n          <label>Centers layout<\u002Flabel>\n          <select id=\"sel-centersLayout\" class=\"sel-full\">\n            <option value=\"orbit\">Orbit — one ring (cleanest D·M)<\u002Foption>\n            <option value=\"orbits\">Orbits — flower of mandalas<\u002Foption>\n            <option value=\"polygon\">Polygon — M-gon vertices<\u002Foption>\n            <option value=\"solid\">Solid — VE / Platonic vertices<\u002Foption>\n            <option value=\"recursive\">Recursive — mandala of mandalas<\u002Foption>\n            <option value=\"phyllotaxis\">Phyllotaxis — organic spiral<\u002Foption>\n            <option value=\"frieze\">Frieze — wide strip (pm)<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Global symmetry<\u002Flabel>\n          <div class=\"segmented c2\" id=\"seg-globalsym\">\n            <button data-v=\"D\" class=\"active\">Dihedral D·M<\u002Fbutton>\n            <button data-v=\"C\">Cyclic C·M<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Center count · M <span class=\"value-display\" id=\"centerCount-v\">6<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"centerCount\" min=\"3\" max=\"12\" step=\"1\" value=\"6\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Orbit radius <span class=\"value-display\" id=\"orbitRadius-v\">0.66<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"orbitRadius\" min=\"0.3\" max=\"1.6\" step=\"0.02\" value=\"0.66\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Satellite scale <span class=\"value-display\" id=\"satelliteScale-v\">0.5<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"satelliteScale\" min=\"0.2\" max=\"1\" step=\"0.02\" value=\"0.5\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Satellite order · n <span class=\"value-display\" id=\"satelliteOrder-v\">6<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"satelliteOrder\" min=\"3\" max=\"12\" step=\"1\" value=\"6\">\n        <\u002Fdiv>\n        <div id=\"recurse-group\" style=\"display:none;\">\n          <div class=\"control-group\">\n            <label>Recurse depth <span class=\"value-display\" id=\"recurseDepth-v\">2<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"recurseDepth\" min=\"1\" max=\"3\" step=\"1\" value=\"2\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Recurse ratio ρ <span class=\"value-display\" id=\"recurseRatio-v\">0.42<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"recurseRatio\" min=\"0.3\" max=\"0.6\" step=\"0.02\" value=\"0.42\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Core size <span class=\"value-display\" id=\"coreScale-v\">0.36<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"coreScale\" min=\"0.18\" max=\"0.6\" step=\"0.02\" value=\"0.36\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Satellite facing<\u002Flabel>\n          <div class=\"segmented c2\" id=\"seg-orient\">\n            <button data-v=\"faceCore\" class=\"active\">Face core<\u002Fbutton>\n            <button data-v=\"globalAxes\">Global axes<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Overlap<\u002Flabel>\n          <div class=\"segmented c2\" id=\"seg-satclip\">\n            <button data-v=\"interpenetrating\" class=\"active\">Interpenetrate<\u002Fbutton>\n            <button data-v=\"discrete\">Discrete disc<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Referential armature<\u002Flabel>\n          <select id=\"sel-armature\" class=\"sel-full\">\n            <option value=\"none\">None<\u002Foption>\n            <option value=\"rings\">Rings (orbit circles)<\u002Foption>\n            <option value=\"spokes\">Spokes (core → centers)<\u002Foption>\n            <option value=\"polygon\">Polygon (link centers)<\u002Foption>\n            <option value=\"all\" selected=\"\">All — rings + spokes + polygon<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <\u002Fdiv><!-- /orbit-controls -->\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <div class=\"control-section\">\n        <h3>Two planes of view<\u002Fh3>\n        <div class=\"control-group\">\n          <label>Plane B (overlay)<\u002Flabel>\n          <div class=\"segmented c2\" id=\"seg-planeb\">\n            <button data-v=\"off\" class=\"active\">Off<\u002Fbutton>\n            <button data-v=\"on\">On<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"planeb-controls\" style=\"display:none;\">\n          <div class=\"control-group\">\n            <label>Plane rotation ±° <span class=\"value-display\" id=\"planeRot-v\">18<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"planeRot\" min=\"0\" max=\"90\" step=\"1\" value=\"18\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Plane B opacity <span class=\"value-display\" id=\"planeBOpacity-v\">0.6<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"planeBOpacity\" min=\"0.15\" max=\"1\" step=\"0.05\" value=\"0.6\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Blend mode<\u002Flabel>\n            <div class=\"segmented c3\" id=\"seg-blend\">\n              <button data-v=\"normal\">Normal<\u002Fbutton>\n              <button data-v=\"screen\" class=\"active\">Screen<\u002Fbutton>\n              <button data-v=\"multiply\">Multiply<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Plane mix / swirl <span class=\"value-display\" id=\"planeMix-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"planeMix\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note\" style=\"margin-top:6px;\">Two overlapping <b>planes of view<\u002Fb>. Plane B counter-rotates against A; their geometries overlap into emergent moiré. Works on a single mandala too.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"control-section\">\n        <h3>Per-center rotation<\u002Fh3>\n        <div class=\"control-group\">\n          <label>Core rotation ±° <span class=\"value-display\" id=\"coreRot-v\">0<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"coreRot\" min=\"-180\" max=\"180\" step=\"1\" value=\"0\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Satellites rotation ±° <span class=\"value-display\" id=\"satRot-v\">0<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"satRot\" min=\"-180\" max=\"180\" step=\"1\" value=\"0\">\n        <\u002Fdiv>\n        <div class=\"note\">Signed degrees — negative = counter-rotation. Applied at the node-<i>class<\u002Fi> level so global symmetry is preserved exactly.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"control-section\">\n        <h3>Animation<\u002Fh3>\n        <div class=\"control-group\">\n          <label>Playback<\u002Flabel>\n          <div class=\"segmented c2\" id=\"seg-play\">\n            <button data-v=\"off\" class=\"active\">Freeze<\u002Fbutton>\n            <button data-v=\"on\">Play ▶<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Speed <span class=\"value-display\" id=\"animSpeed-v\">1<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"animSpeed\" min=\"0.1\" max=\"3\" step=\"0.1\" value=\"1\">\n        <\u002Fdiv>\n        <div class=\"note\">Transform-only: planes counter-rotate, orbits spin (like gears), the core breathes. Symmetry holds every frame; <b>Freeze<\u002Fb> gives a publishable still.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><!-- /panel-centers -->\n\n    <div id=\"panel-layers\" style=\"display:none;\">\n      <div class=\"control-section\">\n        <h3>Layer stack<\u002Fh3>\n        <div class=\"control-group\">\n          <label>Layered compositing<\u002Flabel>\n          <div class=\"segmented c2\" id=\"seg-layered\">\n            <button data-v=\"off\" class=\"active\">Single<\u002Fbutton>\n            <button data-v=\"on\">Layers<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"layers-body\" style=\"display:none;\">\n          <div id=\"layer-stack\"><\u002Fdiv>\n          <div class=\"button-row\" style=\"margin-top:8px;\">\n            <button class=\"button ghost\" id=\"addLayerDup\">+ Layer on top<\u002Fbutton>\n            <button class=\"button tertiary\" id=\"addLayerGrid\">+ Grid behind<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-row\">\n            <button class=\"button ghost\" id=\"addLayerImg\">⬆ + Image layer<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-row\" style=\"margin-top:6px;\">\n            <button class=\"button tertiary\" id=\"addGeomeBed\">🖼 + Geome render as bed<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"note\" style=\"margin-top:6px;\">Drawn <b>back → front<\u002Fb>. The <b>active<\u002Fb> layer (●) is what the <b>Generate / Subunits / Centers<\u002Fb> tabs edit — set its layout, subunits &amp; palette there. <b>🔒 Lock<\u002Fb> freezes a layer so you can build the next one on top of it.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"control-section\" id=\"active-cmp-section\" style=\"display:none;\">\n        <h3>Active layer · compositing<\u002Fh3>\n        <div class=\"control-group\">\n          <label>Layer form <span class=\"note-inline\">abstraction level<\u002Fspan><\u002Flabel>\n          <div class=\"segmented c4\" id=\"seg-layerkind\">\n            <button data-v=\"field\" class=\"active\">Mandala<\u002Fbutton>\n            <button data-v=\"single\">Motif<\u002Fbutton>\n            <button data-v=\"tile\">Tile<\u002Fbutton>\n            <button data-v=\"image\">Image<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"single-controls\" style=\"display:none;\">\n          <div class=\"control-group\" id=\"single-scale-group\">\n            <label>Motif size <span class=\"value-display\" id=\"singleScale-v\">0.5<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"singleScale\" min=\"0.1\" max=\"1.3\" step=\"0.02\" value=\"0.5\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Which subunit <span class=\"note-inline\">click to choose<\u002Fspan><\u002Flabel>\n            <div id=\"single-su\" class=\"subunit-strip\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"note\" id=\"single-note\">One subunit, centred — no replication. A quieter layer for the journey between dense mandalas.<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"tile-controls\" style=\"display:none;\">\n          <div class=\"control-group\">\n            <label>Tiles across <span class=\"value-display\" id=\"tileN-v\">6<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"tileN\" min=\"2\" max=\"24\" step=\"1\" value=\"6\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Motif scale <span class=\"note-inline\">gap ↔ overlap<\u002Fspan> <span class=\"value-display\" id=\"tileScale-v\">1<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"tileScale\" min=\"0.5\" max=\"1.6\" step=\"0.02\" value=\"1\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Alternate tiles<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-tileMirror\">\n              <button data-v=\"on\" class=\"active\">Mirror · pmm<\u002Fbutton>\n              <button data-v=\"off\">Translate only<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Rows<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-tileStagger\">\n              <button data-v=\"off\" class=\"active\">Aligned<\u002Fbutton>\n              <button data-v=\"on\">Brick · ½ stagger<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"note\"><b>One subunit tiled edge-to-edge<\u002Fb> — a flat textile of the motif you pick below. With <b>Stencil cut<\u002Fb>, cutting a portion opens that window in <b>every tile<\u002Fb> at once. Pure vector — sharp at any DPI.<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"image-controls\" style=\"display:none;\">\n          <div class=\"control-group\">\n            <label>Image zoom <span class=\"value-display\" id=\"imgScale-v\">1<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"imgScale\" min=\"0.2\" max=\"3\" step=\"0.02\" value=\"1\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Crop frame <span class=\"note-inline\">aspect ratio<\u002Fspan><\u002Flabel>\n            <select id=\"sel-imgAspect\" class=\"sel-full\">\n              <option value=\"full\">Full card (no crop)<\u002Foption>\n              <option value=\"1:1\">Square 1:1<\u002Foption>\n              <option value=\"4:3\">Landscape 4:3<\u002Foption>\n              <option value=\"3:4\">Portrait 3:4<\u002Foption>\n              <option value=\"16:9\">Wide 16:9<\u002Foption>\n              <option value=\"9:16\">Tall 9:16<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Fit<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-imgFit\">\n              <button data-v=\"meet\" class=\"active\">Contain<\u002Fbutton>\n              <button data-v=\"slice\">Cover<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Reposition ↔ <span class=\"value-display\" id=\"imgOffX-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"imgOffX\" min=\"-0.5\" max=\"0.5\" step=\"0.01\" value=\"0\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Reposition ↕ <span class=\"value-display\" id=\"imgOffY-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"imgOffY\" min=\"-0.5\" max=\"0.5\" step=\"0.01\" value=\"0\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Perspective tilt ↕ <span class=\"note-inline\">depth / keystone<\u002Fspan> <span class=\"value-display\" id=\"imgTiltV-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"imgTiltV\" min=\"-0.8\" max=\"0.8\" step=\"0.02\" value=\"0\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Perspective tilt ↔ <span class=\"value-display\" id=\"imgTiltH-v\">0<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"imgTiltH\" min=\"-0.8\" max=\"0.8\" step=\"0.02\" value=\"0\">\n          <\u002Fdiv>\n          <div class=\"button-row\"><button class=\"button ghost\" id=\"uploadLayerImg\">⬆ Upload / replace image…<\u002Fbutton><\u002Fdiv>\n          <div class=\"button-row\" style=\"margin-top:6px;\"><button class=\"button tertiary\" id=\"layerToBack\">⤓ Send to back (bed)<\u002Fbutton><\u002Fdiv>\n          <div class=\"note\">A photo or render as a layer. Crop it, place it in <b>perspective<\u002Fb>, then cut or <b>blend<\u002Fb> the layers above into it.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Reveal mode <span class=\"note-inline\">how this layer sits on the one behind<\u002Fspan><\u002Flabel>\n          <div class=\"segmented c2\" id=\"seg-layermode\">\n            <button data-v=\"normal\" class=\"active\">Transparency<\u002Fbutton>\n            <button data-v=\"knockout\">Stencil cut<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Layer opacity <span class=\"value-display\" id=\"layerOpacity-v\">1<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"layerOpacity\" min=\"0.1\" max=\"1\" step=\"0.05\" value=\"1\">\n        <\u002Fdiv>\n        <div class=\"control-group\" id=\"palcycle-group\">\n          <label>Palette cycle <span class=\"note-inline\">recolor — geometry unchanged<\u002Fspan><\u002Flabel>\n          <div class=\"palcycle-sw\" id=\"palcycle-sw\"><\u002Fdiv>\n          <div class=\"palcycle-ops\">\n            <button id=\"pcRollL\" title=\"Cycle colors back ( , )\">◀<\u002Fbutton>\n            <button id=\"pcRollR\" title=\"Cycle colors forward ( . )\">▶<\u002Fbutton>\n            <button id=\"pcSwap\" title=\"Swap the two motif colors\">⇄<\u002Fbutton>\n            <button id=\"pcInvert\" title=\"Invert polarity ( i )\">◐<\u002Fbutton>\n            <button id=\"pcReset\" title=\"Reset to palette\">↺<\u002Fbutton>\n          <\u002Fdiv>\n          <label style=\"margin-top:9px;\">Hue shift ±° <span class=\"value-display\" id=\"palHue-v\">0<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"palHue\" min=\"-180\" max=\"180\" step=\"5\" value=\"0\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Layer rotation ±° <span class=\"value-display\" id=\"layerRot-v\">0<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"layerRot\" min=\"-180\" max=\"180\" step=\"1\" value=\"0\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Layer scale <span class=\"value-display\" id=\"layerScale-v\">1<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"layerScale\" min=\"0.2\" max=\"2\" step=\"0.05\" value=\"1\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Offset ↔ <span class=\"value-display\" id=\"layerOffX-v\">0<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"layerOffX\" min=\"-0.5\" max=\"0.5\" step=\"0.01\" value=\"0\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Offset ↕ <span class=\"note-inline\">− up · + down<\u002Fspan> <span class=\"value-display\" id=\"layerOffY-v\">0<\u002Fspan><\u002Flabel>\n          <input type=\"range\" id=\"layerOffY\" min=\"-0.5\" max=\"0.5\" step=\"0.01\" value=\"0\">\n        <\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Blend <span class=\"note-inline\">how this layer mixes with the one behind<\u002Fspan><\u002Flabel>\n          <select id=\"sel-layerblend\" class=\"sel-full\">\n            <option value=\"normal\">Normal<\u002Foption>\n            <optgroup label=\"Palette-true · Adi Da overlap (opaque, snaps to palette)\">\n              <option value=\"pb:multiply\">Overlap · multiply → palette<\u002Foption>\n              <option value=\"pb:screen\">Overlap · screen → palette<\u002Foption>\n              <option value=\"pb:average\">Overlap · average → palette<\u002Foption>\n              <option value=\"pb:difference\">Overlap · difference → palette<\u002Foption>\n              <option value=\"pb:exclusion\">Overlap · exclusion → palette<\u002Foption>\n              <option value=\"pb:rotate\">Overlap · cycle palette<\u002Foption>\n            <\u002Foptgroup>\n            <optgroup label=\"Darken\">\n              <option value=\"darken\">Darken<\u002Foption>\n              <option value=\"multiply\">Multiply<\u002Foption>\n              <option value=\"color-burn\">Color burn<\u002Foption>\n            <\u002Foptgroup>\n            <optgroup label=\"Lighten\">\n              <option value=\"lighten\">Lighten<\u002Foption>\n              <option value=\"screen\">Screen<\u002Foption>\n              <option value=\"color-dodge\">Color dodge<\u002Foption>\n            <\u002Foptgroup>\n            <optgroup label=\"Contrast\">\n              <option value=\"overlay\">Overlay<\u002Foption>\n              <option value=\"soft-light\">Soft light<\u002Foption>\n              <option value=\"hard-light\">Hard light<\u002Foption>\n            <\u002Foptgroup>\n            <optgroup label=\"Comparative\">\n              <option value=\"difference\">Difference<\u002Foption>\n              <option value=\"exclusion\">Exclusion<\u002Foption>\n            <\u002Foptgroup>\n            <optgroup label=\"Component\">\n              <option value=\"hue\">Hue<\u002Foption>\n              <option value=\"saturation\">Saturation<\u002Foption>\n              <option value=\"color\">Color<\u002Foption>\n              <option value=\"luminosity\">Luminosity<\u002Foption>\n            <\u002Foptgroup>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div id=\"pb-controls\" style=\"display:none;\">\n          <div class=\"note\" style=\"margin-bottom:12px;\">Where this layer crosses geometry behind it, the intersection is <b>re-cut as a new flat colour from the palette<\u002Fb> — opaque plate logic, no transparency. The blend math only picks the mix; the result always snaps to a real palette colour, so the composition stays in its core colours.<\u002Fdiv>\n          <div class=\"control-group\" id=\"pbrot-group\" style=\"display:none;\">\n            <label>Cycle step <span class=\"note-inline\">how far the overlap walks the palette<\u002Fspan> <span class=\"value-display\" id=\"pbRot-v\">1<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"pbRot\" min=\"1\" max=\"7\" step=\"1\" value=\"1\">\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Overlap must differ <span class=\"note-inline\">never lets an intersection vanish into either colour<\u002Fspan><\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-pbdistinct\">\n              <button data-v=\"on\" class=\"active\">On<\u002Fbutton>\n              <button data-v=\"off\">Off<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Blend with background <span class=\"note-inline\">also recolour where only the plate ground is behind<\u002Fspan><\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-pbbg\">\n              <button data-v=\"off\" class=\"active\">Off<\u002Fbutton>\n              <button data-v=\"on\">On<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Colours read behind <span class=\"value-display\" id=\"pbMax-v\">4<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"pbMax\" min=\"2\" max=\"6\" step=\"1\" value=\"4\">\n            <div class=\"note-inline\">Each colour costs a full-plate mask on every render, and the whole stack is capped at 12. Past 4 you pay a lot of memory for overlaps that are mostly slivers.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Overlap map <span class=\"note-inline\">behind × this layer → intersection colour<\u002Fspan><\u002Flabel>\n            <div id=\"pb-matrix\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"knockout-controls\" style=\"display:none;\">\n          <div class=\"note\" id=\"cut-note-field\" style=\"margin-bottom:14px;\">Pick sub-units and/or rings to <b>cut out<\u002Fb> of this layer. Because each sub-unit is instanced across the mandala, selecting one knocks out <b>every instance<\u002Fb> at once — opening a symmetric set of windows onto the layer(s) behind. Or <b>cut by colour<\u002Fb> to open windows through every shape painted in a chosen palette colour. <b>Keep selected<\u002Fb> inverts either.<\u002Fdiv>\n          <div class=\"note\" id=\"cut-note-single\" style=\"display:none;margin-bottom:14px;\">This motif is a <b>stack of portions<\u002Fb> — ground, form, focal, emblem. Click any portion below to <b>cut it away<\u002Fb>, opening a window onto the layer(s) behind through exactly that shape.<\u002Fdiv>\n          <div class=\"control-group\" id=\"winshape-group\">\n            <label>Window shape<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-winshape\">\n              <button data-v=\"cell\" class=\"active\">Clean opening<\u002Fbutton>\n              <button data-v=\"silhouette\">Silhouette<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Selection<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-cutinvert\">\n              <button data-v=\"off\" class=\"active\">Cut selected<\u002Fbutton>\n              <button data-v=\"on\">Keep selected<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\" id=\"cut-pieces-group\" style=\"display:none;\">\n            <label>Cut portions <span class=\"note-inline\">click a portion to remove it<\u002Fspan><\u002Flabel>\n            <div id=\"cut-pieces\" class=\"subunit-strip\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\" id=\"cut-su-group\">\n            <label>Cut sub-units <span class=\"note-inline\">click to toggle<\u002Fspan><\u002Flabel>\n            <div id=\"cut-su\" class=\"subunit-strip\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\" id=\"cut-rings-group\">\n            <label>Cut rings <span class=\"note-inline\">by index, 0 = centre<\u002Fspan><\u002Flabel>\n            <div id=\"cut-rings\" class=\"chip-row\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\" id=\"cut-color-group\">\n            <label>Cut by colour <span class=\"note-inline\">windows through these palette colours<\u002Fspan><\u002Flabel>\n            <div id=\"cut-colors\" class=\"chip-row\"><\u002Fdiv>\n            <div id=\"cut-families\" class=\"chip-row\" style=\"margin-top:8px;\"><\u002Fdiv>\n            <div class=\"button-row\" style=\"margin-top:8px;\">\n              <button class=\"button tertiary\" id=\"cutEyedrop\">◎ Pick colour from render…<\u002Fbutton>\n            <\u002Fdiv>\n            <div id=\"cut-hex-chips\" class=\"chip-row\" style=\"margin-top:8px;\"><\u002Fdiv>\n            <div class=\"control-group\" id=\"cut-tol-group\" style=\"margin-top:8px;display:none;\">\n              <label>Colour match tolerance <span class=\"value-display\" id=\"cutTol-v\">18%<\u002Fspan><\u002Flabel>\n              <input type=\"range\" id=\"cutTol\" min=\"4\" max=\"60\" step=\"1\" value=\"18\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"control-group\" id=\"layer-filter-group\">\n          <label>Colour filter <span class=\"note-inline\">image-processing on this layer · exports<\u002Fspan><\u002Flabel>\n          <select id=\"sel-layerFilter\" class=\"sel-full\">\n            <option value=\"\">None<\u002Foption>\n            <optgroup label=\"Tone\">\n              <option value=\"gray\">Desaturate → grayscale<\u002Foption>\n              <option value=\"sat2\">Saturate ×2<\u002Foption>\n              <option value=\"invert\">Invert<\u002Foption>\n            <\u002Foptgroup>\n            <optgroup label=\"Adi-Da flatten\">\n              <option value=\"post3\">Posterize · 3 levels<\u002Foption>\n              <option value=\"post4\">Posterize · 4 levels<\u002Foption>\n              <option value=\"post6\">Posterize · 6 levels<\u002Foption>\n              <option value=\"threshold\">Threshold · 2-tone<\u002Foption>\n            <\u002Foptgroup>\n            <optgroup label=\"Adi-Da colour assignment\">\n              <option value=\"complement\">Complementary overprint (hue 180°)<\u002Foption>\n              <option value=\"swaprgb\">Channel-swap · R→G→B<\u002Foption>\n              <option value=\"swaprc\">Channel-swap · R/G<\u002Foption>\n              <option value=\"duotone\">Duotone → Form A / Form B<\u002Foption>\n              <option value=\"plateR\">Light plate · Red<\u002Foption>\n              <option value=\"plateG\">Light plate · Green<\u002Foption>\n              <option value=\"plateB\">Light plate · Blue<\u002Foption>\n            <\u002Foptgroup>\n          <\u002Fselect>\n          <div class=\"control-group\" id=\"filter-post-group\" style=\"margin-top:8px;display:none;\">\n            <label>Levels <span class=\"value-display\" id=\"filterPost-v\">3<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"filterPost\" min=\"2\" max=\"8\" step=\"1\" value=\"3\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"image-extract-group\" style=\"display:none;\">\n          <div class=\"control-group\">\n            <label>Isolate colours from image <span class=\"note-inline\">primary light + dominant palette<\u002Fspan><\u002Flabel>\n            <div class=\"button-row\"><button class=\"button ghost\" id=\"extractColors\">◲ Extract palette + R/G/B<\u002Fbutton><\u002Fdiv>\n            <div id=\"extract-swatches\" class=\"chip-row\" style=\"margin-top:8px;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\" id=\"imgkey-group\" style=\"display:none;\">\n            <label>Colour-key this image <span class=\"note-inline\">drop or isolate the picked colour<\u002Fspan><\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-imgkey\">\n              <button data-v=\"drop\" class=\"active\">Drop colour<\u002Fbutton>\n              <button data-v=\"isolate\">Isolate colour<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"button-row\" style=\"margin-top:6px;\"><button class=\"button tertiary\" id=\"imgKeyReset\">↺ Reset image<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-group\" id=\"composite-filter-group\">\n        <label>Composite — whole render <span class=\"note-inline\">Adi-Da flatten across all layers<\u002Fspan><\u002Flabel>\n        <select id=\"sel-compositeFilter\" class=\"sel-full\">\n          <option value=\"\">None<\u002Foption>\n          <option value=\"post2\">Posterize · 2 levels<\u002Foption>\n          <option value=\"post3\">Posterize · 3 levels<\u002Foption>\n          <option value=\"post4\">Posterize · 4 levels (palette-quantize)<\u002Foption>\n          <option value=\"post6\">Posterize · 6 levels<\u002Foption>\n          <option value=\"threshold\">Threshold · 2-tone<\u002Foption>\n          <option value=\"gray\">Grayscale<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n          <\u002Fdiv><!-- /panel-layers -->\n    <div id=\"panel-slice\" style=\"display:none;\">\n      <div class=\"control-section\" id=\"slice-section\">\n        <h3 data-hk=\"Z\">Slice shift · active layer<\u002Fh3>\n        <div class=\"note\" style=\"margin-bottom:10px;\">Cut this layer where you want it, band by band. <b>Click the plate<\u002Fb> to drop a cut, <b>drag a cut<\u002Fb> to move it, <b>Alt-click<\u002Fb> to remove it. Switch to <b>Shift<\u002Fb> and drag inside a band to slide it — rows slide ↔, columns slide ↕. Pure vector, so it stays sharp at 450 DPI.<\u002Fdiv>\n        <div class=\"note\" id=\"slice-needlayers\" style=\"margin-bottom:10px;color:var(--orange);\">Turn on <b>Layered compositing<\u002Fb> in the ⧉ Layers panel (<b>4<\u002Fb>) first — slicing works per layer.<\u002Fdiv>\n        <div class=\"control-group\">\n          <label>Slice this layer<\u002Flabel>\n          <div class=\"segmented c2\" id=\"seg-sliceOn\">\n            <button data-v=\"off\" class=\"active\">Off<\u002Fbutton>\n            <button data-v=\"on\">On<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"slice-controls\" style=\"display:none;\">\n          <div class=\"control-group\">\n            <label>Cut axis <span class=\"note-inline\">which set you're editing<\u002Fspan><\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-sliceAxis\">\n              <button data-v=\"h\" class=\"active\">Rows ↔<\u002Fbutton>\n              <button data-v=\"v\">Columns ↕<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Pointer<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-sliceTool\">\n              <button data-v=\"cut\" class=\"active\">Cut<\u002Fbutton>\n              <button data-v=\"shift\">Shift<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>On-plate editor<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-sliceEdit\">\n              <button data-v=\"on\" class=\"active\">Show<\u002Fbutton>\n              <button data-v=\"off\">Hide<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Snap grid <span class=\"value-display\" id=\"sliceSnap-v\">off<\u002Fspan><\u002Flabel>\n            <input type=\"range\" id=\"sliceSnap\" min=\"0\" max=\"32\" step=\"1\" value=\"0\">\n            <div class=\"note-inline\">Cuts land on the grid; hold <b>Shift<\u002Fb> while dragging a band to snap the offset too.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"control-group\">\n            <label>Edges<\u002Flabel>\n            <div class=\"segmented c2\" id=\"seg-sliceWrap\">\n              <button data-v=\"on\" class=\"active\">Wrap around<\u002Fbutton>\n              <button data-v=\"off\">Leave gap<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"button-row\">\n            <button class=\"button ghost\" id=\"sliceEven\">Even cuts…<\u002Fbutton>\n            <button class=\"button ghost\" id=\"sliceStagger\">Stagger<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-row\" style=\"margin-top:6px;\">\n            <button class=\"button ghost\" id=\"sliceZero\">Zero shifts<\u002Fbutton>\n            <button class=\"button ghost\" id=\"sliceClear\">Clear cuts<\u002Fbutton>\n          <\u002Fdiv>\n          <div id=\"slice-bands\" style=\"margin-top:10px;\"><\u002Fdiv>\n          <div class=\"note\" style=\"margin-top:8px;\">Arrow keys nudge the last band you touched (⇧ for a coarse step). Rows and columns hold separate cut sets — both apply, rows first.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv><!-- /panel-slice -->\n    <div id=\"panel-surface\" style=\"display:none;\">\n    <div class=\"control-section\">\n      <h3>Surface &amp; layout<\u002Fh3>\n      <div class=\"control-group\">\n        <label>Format<\u002Flabel>\n        <select id=\"sel-format\" class=\"sel-full\">\n          <option value=\"back\">Card back — 700×1200<\u002Foption>\n          <option value=\"poster\">Poster — 1000×1000<\u002Foption>\n          <option value=\"posterWide\">Poster wide — 1600×1000<\u002Foption>\n          <option value=\"exhibition\">Exhibition 16:9 — 1920×1080<\u002Foption>\n          <option value=\"exhibitionUltra\">Exhibition 21:9 — 2560×1080<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"control-group\">\n        <label>Layout<\u002Flabel>\n        <div class=\"segmented c2\" id=\"seg-layout\">\n          <button data-v=\"radial\" class=\"active\">Radial · mandala<\u002Fbutton>\n          <button data-v=\"grid\">Grid · textile<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-group radial-only\">\n        <label>Symmetry<\u002Flabel>\n        <div class=\"segmented c3\" id=\"seg-radialsym\">\n          <button data-v=\"dihedral\" class=\"active\">Dihedral·Dn<\u002Fbutton>\n          <button data-v=\"cross\">Cross·D2<\u002Fbutton>\n          <button data-v=\"diagonal\">Diag·D4<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-group radial-only\">\n        <label>Symmetry order <span class=\"value-display\" id=\"order-v\">8<\u002Fspan><\u002Flabel>\n        <input type=\"range\" id=\"order\" min=\"3\" max=\"16\" step=\"1\" value=\"8\">\n      <\u002Fdiv>\n      <div class=\"control-group radial-only\">\n        <label>Rings <span class=\"value-display\" id=\"rings-v\">9<\u002Fspan><\u002Flabel>\n        <input type=\"range\" id=\"rings\" min=\"3\" max=\"14\" step=\"1\" value=\"9\">\n      <\u002Fdiv>\n      <div class=\"control-group grid-only\" style=\"display:none;\">\n        <label>Reflection<\u002Flabel>\n        <div class=\"segmented c2\" id=\"seg-sym\">\n          <button data-v=\"mirror\" class=\"active\">Mirror · pmm<\u002Fbutton>\n          <button data-v=\"centro\">Centro · C2<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"control-section radial-only\">\n      <h3>Complexity &amp; field<\u002Fh3>\n      <div class=\"control-group\">\n        <label>Subunit vocabulary<\u002Flabel>\n        <div class=\"segmented c2\" id=\"seg-concentric\">\n          <button data-v=\"mixed\" class=\"active\">Full geome<\u002Fbutton>\n          <button data-v=\"concentric\">Concentric only<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-group\">\n        <label>Moiré interference<\u002Flabel>\n        <div class=\"segmented c3\" id=\"seg-moire\">\n          <button data-v=\"none\" class=\"active\">None<\u002Fbutton>\n          <button data-v=\"subtle\">Subtle<\u002Fbutton>\n          <button data-v=\"strong\">Strong<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-group\">\n        <label>Linead web<\u002Flabel>\n        <div class=\"segmented c3\" id=\"seg-linead\">\n          <button data-v=\"none\" class=\"active\">None<\u002Fbutton>\n          <button data-v=\"on\">Web<\u002Fbutton>\n          <button data-v=\"dense\">Dense<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-group\">\n        <label>Core radiance <span class=\"note-inline\">singular center<\u002Fspan><\u002Flabel>\n        <div class=\"segmented c3\" id=\"seg-corerad\">\n          <button data-v=\"none\" class=\"active\">None<\u002Fbutton>\n          <button data-v=\"subtle\">Subtle<\u002Fbutton>\n          <button data-v=\"strong\">Strong<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"control-section radial-only\">\n      <h3>Core solid<\u002Fh3>\n      <div class=\"control-group\">\n        <label>Platonic / VE core<\u002Flabel>\n        <div class=\"segmented c3\" id=\"seg-solid\">\n          <button data-v=\"none\" class=\"active\">None<\u002Fbutton>\n          <button data-v=\"ve\">Cuboct·VE<\u002Fbutton>\n          <button data-v=\"octa\">Octa<\u002Fbutton>\n          <button data-v=\"icosa\">Icosa<\u002Fbutton>\n          <button data-v=\"cube\">Cube<\u002Fbutton>\n          <button data-v=\"tetra\">Tetra<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"control-group\" id=\"axis-group\" style=\"display:none;\">\n        <label>Projection axis<\u002Flabel>\n        <div class=\"segmented c2\" id=\"seg-axis\">\n          <button data-v=\"2\">2-fold<\u002Fbutton>\n          <button data-v=\"3\">3-fold<\u002Fbutton>\n          <button data-v=\"4\" class=\"active\">4-fold<\u002Fbutton>\n          <button data-v=\"5\">5-fold<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"control-section\">\n      <h3>Detail &amp; density<\u002Fh3>\n      <div class=\"control-group grid-only\" style=\"display:none;\">\n        <label>Grid (columns) <span class=\"value-display\" id=\"cols-v\">7<\u002Fspan><\u002Flabel>\n        <input type=\"range\" id=\"cols\" min=\"3\" max=\"16\" step=\"1\" value=\"7\">\n      <\u002Fdiv>\n      <div class=\"control-group grid-only\" style=\"display:none;\">\n        <label>Motif period (unit) <span class=\"value-display\" id=\"unit-v\">2<\u002Fspan><\u002Flabel>\n        <input type=\"range\" id=\"unit\" min=\"1\" max=\"4\" step=\"1\" value=\"2\">\n      <\u002Fdiv>\n      <div class=\"control-group\">\n        <label>Features / detail <span class=\"value-display\" id=\"features-v\">3<\u002Fspan><\u002Flabel>\n        <input type=\"range\" id=\"features\" min=\"1\" max=\"6\" step=\"1\" value=\"3\">\n      <\u002Fdiv>\n      <div class=\"control-group\">\n        <label>Line weight <span class=\"value-display\" id=\"lineWeight-v\">1.3<\u002Fspan><\u002Flabel>\n        <input type=\"range\" id=\"lineWeight\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"1.3\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <\u002Fdiv><!-- /panel-surface -->\n    <div id=\"panel-color\" style=\"display:none;\">\n    <div class=\"control-section\">\n      <h3>Palette<\u002Fh3>\n      <div class=\"palette-grid\" id=\"pal-grid\"><\u002Fdiv>\n      <div class=\"control-group\" id=\"hue-group\" style=\"margin-top:14px;\">\n        <label>Hue <span class=\"value-display\" id=\"hue-v\">8<\u002Fspan><\u002Flabel>\n        <input type=\"range\" id=\"hue\" min=\"0\" max=\"360\" step=\"2\" value=\"8\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"control-section collapsed\">\n      <h3>Wada combinations<\u002Fh3>\n      <div class=\"note\" style=\"margin-bottom:10px;\">Sanzo Wada's <b>348<\u002Fb> historic combinations from <i>A Dictionary of Color Combinations<\u002Fi>, mapped into the geome roles. Filter by colour name or number.<\u002Fdiv>\n      <div class=\"wada-tools\">\n        <input type=\"text\" id=\"wadaSearch\" class=\"wada-search\" placeholder=\"Search — e.g. rose, cobalt, 42…\" autocomplete=\"off\">\n        <div class=\"segmented c4\" id=\"seg-wadaSize\" style=\"margin-top:8px;\">\n          <button data-v=\"all\" class=\"active\">All<\u002Fbutton>\n          <button data-v=\"2\">2<\u002Fbutton>\n          <button data-v=\"3\">3<\u002Fbutton>\n          <button data-v=\"4\">4<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"wada-grid\" id=\"wada-grid\"><\u002Fdiv>\n      <div class=\"wada-count\" id=\"wada-count\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <\u002Fdiv><!-- /panel-color -->\n    <div id=\"panel-export\" style=\"display:none;\">\n    <div class=\"control-section\">\n      <h3>The method<\u002Fh3>\n      <div class=\"note\">\npiece → <b>subunit<\u002Fb> (3–4 pieces) → unit<br>\n→ reflected across axes (triangle-wave fold)<br>\nmirror = pmm · centro = 180° invariant<br>\n\"aperspectival, anegoic, aniconic\"<br>\nprismatic repetition · no point of view\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"control-section\">\n      <h3>Actions<\u002Fh3>\n      <div class=\"button-row\"><button class=\"button ghost\" id=\"rerollGallery\">↻ Reroll gallery<\u002Fbutton><\u002Fdiv>\n      <div class=\"button-row\">\n        <button class=\"button tertiary\" id=\"dlSVG\">Download SVG<\u002Fbutton>\n        <button class=\"button secondary\" id=\"dlPNG\">Download PNG<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"control-section\">\n      <h3>Print &amp; screen · to 900 DPI<\u002Fh3>\n      <div class=\"control-group\">\n        <label>Long edge <span class=\"note-inline\">inches on paper / canvas<\u002Fspan><\u002Flabel>\n        <div class=\"button-row\" style=\"gap:5px;\">\n          <button class=\"button ghost prn-p\" data-in=\"8.27\">A4<\u002Fbutton>\n          <button class=\"button ghost prn-p\" data-in=\"11.7\">A3<\u002Fbutton>\n          <button class=\"button ghost prn-p\" data-in=\"16.5\">A2<\u002Fbutton>\n          <button class=\"button ghost prn-p\" data-in=\"24\">24″<\u002Fbutton>\n          <button class=\"button ghost prn-p\" data-in=\"36\">36″<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"button-row\" style=\"gap:5px;margin-top:5px;\">\n          <button class=\"button ghost prn-px\" data-px=\"3840\">4K UHD · 3840 px<\u002Fbutton>\n          <button class=\"button ghost prn-px\" data-px=\"7680\">8K · 7680 px<\u002Fbutton>\n        <\u002Fdiv>\n        <input type=\"range\" id=\"prnIn\" min=\"4\" max=\"48\" step=\"0.25\" value=\"16.5\">\n        <label style=\"margin-top:8px;\">Resolution<\u002Flabel>\n        <select id=\"prnDpi\" class=\"sel-full\">\n          <option value=\"300\">300 DPI — offset / poster house<\u002Foption>\n          <option value=\"450\" selected=\"\">450 DPI — fine art, canvas<\u002Foption>\n          <option value=\"600\">600 DPI — giclée, line-heavy plates<\u002Foption>\n          <option value=\"900\">900 DPI — 2× archival · gallery large-format<\u002Foption>\n        <\u002Fselect>\n        <div class=\"note-inline\" id=\"prnInfo\" style=\"line-height:1.7;\">—<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"button-row\">\n        <button class=\"button secondary\" id=\"dlPrint\">⬇ Export print PNG<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"note-inline\" style=\"line-height:1.6;\">Rendered in tiles straight off the vector, each tile rasterised 1:1 at print resolution with the plate's user space scaled to match — so SVG filters, patterns and image crops resolve at full DPI instead of the browser's small default buffers. The pHYs chunk is rewritten (any 72-DPI one removed), so a pre-flight checker reads the true physical size. For canvas, <b>Download SVG<\u002Fb> is still the sharpest route unless a layer carries an uploaded photo. <b>4K / 8K screen masters<\u002Fb> render the long edge at exactly that pixel count — 1:1 device pixels, zero resampling, no pixelation on a UHD display.<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv><!-- /panel-export -->\n    <\u002Fdiv><!-- /dock -->\n  <\u002Fdiv>\n\n  <div class=\"stage\">\n    <div id=\"stageWrap\"><div class=\"card-shell\" id=\"stageMain\"><\u002Fdiv><svg id=\"sliceOverlay\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"none\"><\u002Fsvg><\u002Fdiv>\n    <div class=\"stage-meta\" id=\"meta\"><\u002Fdiv>\n    <div class=\"stage-tools\">\n      <button class=\"fs-launch\" id=\"fsOpen\" title=\"View fullscreen (F)\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3\"><\u002Fpath><\u002Fsvg>\n        View fullscreen\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"gallery\">\n      <h4>Six variations · click to load<\u002Fh4>\n      <div class=\"gallery-grid\" id=\"gallery\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><!-- /container -->\n<footer class=\"statusbar\" id=\"statusbar\"><div class=\"st-left\" id=\"stInfo\">—<\u002Fdiv><div class=\"st-right\"><span class=\"st-k\"><kbd>Alt<\u002Fkbd> keys in place<\u002Fspan><span class=\"st-k\"><kbd>?<\u002Fkbd> map<\u002Fspan><span class=\"st-k\"><kbd>⌘K<\u002Fkbd> commands<\u002Fspan><\u002Fdiv><\u002Ffooter>\n<\u002Fdiv><!-- /app -->\n\n<div id=\"fsOverlay\">\n  <div class=\"fs-bar\">\n    <div class=\"fs-meta\" id=\"fsMeta\"><\u002Fdiv>\n    <div class=\"fs-actions\">\n      <div class=\"fit-seg\" id=\"fsFit\">\n        <button data-fit=\"contain\" class=\"active\">Fit<\u002Fbutton>\n        <button data-fit=\"width\">Fill width<\u002Fbutton>\n        <button data-fit=\"height\">Fill height<\u002Fbutton>\n        <button data-fit=\"100\">100%<\u002Fbutton>\n      <\u002Fdiv>\n      <button id=\"fsClose\">✕ Close · Esc<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"fsStage\"><\u002Fdiv>\n  <div class=\"fs-hint\">scroll to zoom · drag to pan · Esc to exit<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"kbd-hint\" id=\"kbdHint\">⌨ Shortcuts · ?<\u002Fdiv>\n<div class=\"sess-toast\" id=\"sessToast\">\n  <span id=\"sessToastMsg\">Resume your previous session?<\u002Fspan>\n  <button class=\"t-yes\" id=\"sessToastYes\">Resume<\u002Fbutton>\n  <button class=\"t-no\" id=\"sessToastNo\">Dismiss<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"kbd-overlay\" id=\"kbdOverlay\">\n  <div class=\"kbd-card\">\n    <h4>Keyboard map<\u002Fh4>\n    <div class=\"kbd-sub\">hold <b>Alt<\u002Fb> anywhere — every bound key surfaces on the control it drives · <b>⌘K<\u002Fb> searches every command &amp; control<\u002Fdiv>\n    <div class=\"kbd-groups\">\n      <div class=\"kbd-g\"><h5>Panels<\u002Fh5>\n        <div class=\"kbd-row\"><span>⚄ Generate · ✎ Subunits · ◉ Centers<\u002Fspan><span class=\"keys\"><kbd>1<\u002Fkbd><kbd>2<\u002Fkbd><kbd>3<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>⧉ Layers · ⌗ Slice · ▦ Surface<\u002Fspan><span class=\"keys\"><kbd>4<\u002Fkbd><kbd>5<\u002Fkbd><kbd>6<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>◐ Color · ⇩ Export · ⎆ Sessions<\u002Fspan><span class=\"keys\"><kbd>7<\u002Fkbd><kbd>8<\u002Fkbd><kbd>9<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Command search<\u002Fspan><span class=\"keys\"><kbd>⌘K<\u002Fkbd><kbd>/<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Collapse / expand sections<\u002Fspan><span class=\"keys\"><kbd>C<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Controls drawer (mobile)<\u002Fspan><span class=\"keys\"><kbd>M<\u002Fkbd><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kbd-g\"><h5>Seed &amp; motion<\u002Fh5>\n        <div class=\"kbd-row\"><span>Previous / next seed<\u002Fspan><span class=\"keys\"><kbd>[<\u002Fkbd><kbd>]<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Random seed<\u002Fspan><span class=\"keys\"><kbd>R<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Reroll gallery<\u002Fspan><span class=\"keys\"><kbd>G<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Play / freeze animation<\u002Fspan><span class=\"keys\"><kbd>Space<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Fullscreen plate<\u002Fspan><span class=\"keys\"><kbd>F<\u002Fkbd><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kbd-g\"><h5>Plate<\u002Fh5>\n        <div class=\"kbd-row\"><span>▣ Borders / deck chrome<\u002Fspan><span class=\"keys\"><kbd>B<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>◼ Background — off = transparent export<\u002Fspan><span class=\"keys\"><kbd>K<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Jump to size / format<\u002Fspan><span class=\"keys\"><kbd>D<\u002Fkbd><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kbd-g\"><h5>Layers<\u002Fh5>\n        <div class=\"kbd-row\"><span>Jump to layer stack<\u002Fspan><span class=\"keys\"><kbd>L<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>✂ Stencil cut on active layer<\u002Fspan><span class=\"keys\"><kbd>X<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Palette roll ◀ ▶ · invert ◐<\u002Fspan><span class=\"keys\"><kbd>,<\u002Fkbd><kbd>.<\u002Fkbd><kbd>I<\u002Fkbd><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kbd-g\"><h5>Slice bands<\u002Fh5>\n        <div class=\"kbd-row\"><span>Jump to slice shift<\u002Fspan><span class=\"keys\"><kbd>Z<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Nudge last band · ⇧ coarse<\u002Fspan><span class=\"keys\"><kbd>←→↑↓<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>Remove a cut<\u002Fspan><span class=\"keys\"><kbd>Alt·click<\u002Fkbd><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kbd-g\"><h5>Export<\u002Fh5>\n        <div class=\"kbd-row\"><span>SVG — infinite resolution<\u002Fspan><span class=\"keys\"><kbd>S<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>PNG — sharp 4×<\u002Fspan><span class=\"keys\"><kbd>P<\u002Fkbd><\u002Fspan><\u002Fdiv>\n        <div class=\"kbd-row\"><span>This map<\u002Fspan><span class=\"keys\"><kbd>?<\u002Fkbd><kbd>Esc<\u002Fkbd><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"04af2675-dbf4-40cb-a6e0-75ac447cfb3f\"><\u002Fscript>\n<script src=\"5aa8e7b4-84ae-4ac0-a72c-10e2ba658bf8\"><\u002Fscript>\n<script src=\"47cddcd5-a76c-4b49-baaf-718c570614cd\"><\u002Fscript>\n<script src=\"8c091dfa-db15-4add-9fd9-af5f473ab1c3\"><\u002Fscript>\n<script src=\"54418ef6-f026-4ea3-8ea3-1b47f9b24dbc\"><\u002Fscript>\n<script src=\"d5705757-5b3d-4eae-a336-421f4bc2846c\"><\u002Fscript>\n<script src=\"f3730bff-bdab-46c8-8db5-79abac609cff\"><\u002Fscript>\n<script src=\"b72d1980-9840-4255-828b-b83b384ed4a7\"><\u002Fscript>\n<script src=\"1ece4621-a042-49c1-b032-8a50c70ac00e\"><\u002Fscript>\n<script>\n// ── diagnostic: surface any uncaught error visibly instead of a blank/crashed tab ──\nwindow.addEventListener('error', function(e){\n  try{\n    var b=document.getElementById('__errbar')||(function(){\n      var d=document.createElement('div'); d.id='__errbar';\n      d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7a1f1f;color:#fff;'+\n        'font:12px/1.5 monospace;padding:10px 14px;white-space:pre-wrap;max-height:38vh;overflow:auto;'+\n        'box-shadow:0 -4px 18px rgba(0,0,0,.4)';\n      document.body.appendChild(d); return d;})();\n    var msg=(e.error&&e.error.stack)||e.message||String(e);\n    b.textContent='⚠ Geome runtime error (tell Claude this):\\n'+msg+'\\n@ '+(e.filename||'')+':'+(e.lineno||'');\n  }catch(_){}\n});\nconst params={ seed:1927, format:'back', layout:'radial', radialSym:'dihedral', symmetry:'mirror', features:3, cols:7, unit:2,\n  order:8, rings:9, solid:'none', axis:'4', concentric:false, moire:'none', linead:'none', coreRad:'none',\n  lineWeight:1.3, palette:'spectra', hue:8, customLayers:null, customTrees:null,\n  // v7 — multi-center coherent mandala\n  multiCenter:false, multiMode:'poly', centersLayout:'orbit', centerCount:6, orbitRadius:0.66, satelliteScale:0.5,\n  satelliteOrder:6, satelliteOrient:'faceCore', satelliteClip:'interpenetrating', globalSym:'D',\n  armature:'all', recurseDepth:2, recurseRatio:0.42, coreScale:0.36,\n  // v8 — continuous wallpaper field (fills frame, many rotation centers)\n  lattice:'hex', centersAcross:3, latticeDetail:2, centerDot:true, fieldRot:0,\n  // v9 — double-layer interference (anaglyph) + recursion depth\n  interference:false, interferePair:'redCyan', interfereBlend:'screen',\n  interfereShift:0.06, interfereRot:4, interfereScale:0, interfereIntensity:0.72, depthBoost:0,\n  // v12 — sub-space fractal decomposition controls\n  decK:0, decRule:'mixed', decJitter:0, decInward:0,\n  // v7 — two planes of view + per-center rotation\n  planeB:false, planeRot:18, planeBOpacity:0.6, planeBBlend:'screen', planeMix:0, coreRot:0, satRot:0,\n  // v10 — POLYHEDRON FIELD (projected-solid vertices host sub-geometries; rotated overlay → diffraction on black)\n  polySolid:'ve', polyAxis:'3', polySpacing:0.72, polyVertexRot:0, polyCore:false, polyArmature:'off', polyCoverage:1.85,\n  polyInterfere:'twin', polyOverlayAngle:12, polyGrow:1.4, polySolidB:'tetra', polyAxisB:'4',\n  polyFringe:'line', polyPair:'redCyan', polyBlend:'screen', polyIntensity:0.92,\n  // v11 — LAYER STACK + STENCIL KNOCKOUT\n  layered:false, layers:[], activeLayer:0, singlePieceCut:[],\n  layerOpacity:1, layerBlend:'normal', layerRot:0, layerMode:'normal', layerScale:1, layerOffX:0, layerOffY:0,\n  pbRot:1, pbBG:false, pbDistinct:true, pbMax:4, _pbFast:false,\n  palMod:{invert:false,roll:0,swap:false,hue:0},\n  layerCut:[], layerCutRings:[], layerCutColors:[], layerCutSpecs:[], layerFilter:null, compositeFilter:null, _compositeKey:'', cutTol:18, imgKeyMode:'drop', imgKeyHex:null, layerWinShape:'cell', layerInvert:false,\n  layerKind:'field', layerImg:null, singleScale:0.5, imgScale:1, singleSU:0,\n  tileN:6, tileScale:1, tileMirror:true, tileStagger:false,\n  imgAspect:'full', imgFit:'meet', imgOffX:0, imgOffY:0, imgTiltV:0, imgTiltH:0,\n  // v15 — plate chrome / ground toggles + per-layer slice shift\n  noChrome:false, noBG:false,\n  sliceOn:false, sliceEdit:true, sliceAxis:'h', sliceSnap:0, sliceWrap:true,\n  sliceCutsH:[], sliceOffH:[0], sliceCutsV:[], sliceOffV:[0] };\nlet anim={ playing:false, speed:1, t:0, raf:0, last:0 };\nlet gallerySeeds=[];\n\nfunction syncLayout(){\n  const radial=params.layout==='radial';\n  document.querySelectorAll('.radial-only').forEach(e=>e.style.display=radial?'':'none');\n  document.querySelectorAll('.grid-only').forEach(e=>e.style.display=radial?'none':'');\n}\n\nconst PAL_LABELS={spectra:'Spectra',spectraLight:'Spectra · paper',orpheum:'Orpheum',orpheumNoir:'Orpheum · noir',orpheumRed:'Orpheum · red field',orpheumCyan:'Orpheum · cyan',grayscale:'Grayscale',\n  grayLight:'Gray · paper',mono:'Monotone',monoInk:'Monotone · line',sumi:'Sumi · seal',\n  hermetic:'Hermetic',wadaJewel:'Wada · Jewel',noir:'Noir · line'};\nconst palGrid=document.getElementById('pal-grid');\nGeomeTiles.PALETTE_MODES.forEach(mode=>{\n  const pal=GeomeTiles.makePalette(mode,params.hue);\n  const chip=document.createElement('div');\n  chip.className='pal-chip'+(mode===params.palette?' active':'');\n  chip.dataset.v=mode;\n  const sw=[pal.bg,pal.disc==='none'?pal.ink:pal.disc,pal.fA,pal.fB,pal.accent];\n  chip.innerHTML=`<div class=\"sw\">${sw.map(c=>`<i style=\"background:${c}\"><\u002Fi>`).join('')}<\u002Fdiv><div class=\"nm\">${PAL_LABELS[mode]||pal.label}<\u002Fdiv>`;\n  chip.onclick=()=>{params.palette=mode;document.querySelectorAll('.pal-chip').forEach(c=>c.classList.toggle('active',c===chip));\n    document.getElementById('hue-group').style.display=(mode==='mono'||mode==='monoInk')?'block':'none';render();buildGallery(false);if(typeof buildCutColors==='function'&&params.layered)buildCutColors();};\n  palGrid.appendChild(chip);\n});\n\n// ── WADA COMBINATIONS picker (348 historic palettes) ──────────────────\nfunction palLabel(mode){\n  if(PAL_LABELS[mode]) return PAL_LABELS[mode];\n  const w=window.GEOME_WADA; if(w&&w[mode]) return 'Wada '+mode.split(':')[1]+' · '+w[mode].label;\n  return mode;\n}\nconst wadaGrid=document.getElementById('wada-grid');\nconst wadaCount=document.getElementById('wada-count');\nconst wadaSearch=document.getElementById('wadaSearch');\nlet wadaFilterSize='all';\nfunction wadaMatch(p,q){\n  if(wadaFilterSize!=='all' && p.size!==+wadaFilterSize) return false;\n  if(!q) return true;\n  q=q.toLowerCase();\n  if(p.id.split(':')[1]===q) return true;\n  if(p.label.toLowerCase().includes(q)) return true;\n  return (p.names||[]).some(n=>n.toLowerCase().includes(q));\n}\nfunction buildWada(){\n  const list=window.GEOME_WADA_LIST||[];\n  const q=(wadaSearch.value||'').trim();\n  const shown=list.filter(p=>wadaMatch(p,q));\n  wadaGrid.innerHTML='';\n  const frag=document.createDocumentFragment();\n  shown.slice(0,240).forEach(p=>{\n    const chip=document.createElement('div');\n    chip.className='wada-chip'+(p.id===params.palette?' active':'');\n    chip.dataset.v=p.id;\n    const sw=[p.bg,p.disc,p.fA,p.fB,p.accent];\n    const num=p.id.split(':')[1];\n    chip.innerHTML=`<div class=\"sw\">${sw.map(c=>`<i style=\"background:${c}\"><\u002Fi>`).join('')}<\u002Fdiv>`+\n      `<div class=\"nm\"><span class=\"id\">${num}<\u002Fspan> ${p.label}<\u002Fdiv>`;\n    chip.onclick=()=>{params.palette=p.id;\n      document.querySelectorAll('.pal-chip,.wada-chip').forEach(c=>c.classList.toggle('active',c===chip));\n      document.getElementById('hue-group').style.display='none';\n      render();buildGallery(false);if(typeof buildCutColors==='function'&&params.layered)buildCutColors();};\n    frag.appendChild(chip);\n  });\n  wadaGrid.appendChild(frag);\n  wadaCount.textContent=shown.length+' of '+list.length+' combinations'+(shown.length>240?' · showing first 240':'');\n}\nwadaSearch.addEventListener('input',buildWada);\ndocument.querySelectorAll('#seg-wadaSize button').forEach(b=>b.addEventListener('click',()=>{\n  wadaFilterSize=b.dataset.v;\n  document.querySelectorAll('#seg-wadaSize button').forEach(x=>x.classList.toggle('active',x===b));\n  buildWada();}));\nbuildWada();\n\nfunction segWire(id,key){document.querySelectorAll(`#${id} button`).forEach(b=>{b.onclick=()=>{params[key]=b.dataset.v;\n  document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('active',x===b));render();};});}\nsegWire('seg-sym','symmetry');\nsegWire('seg-radialsym','radialSym');\nsegWire('seg-moire','moire'); segWire('seg-linead','linead'); segWire('seg-corerad','coreRad');\n// format dropdown (5 surfaces incl. wide / exhibition)\ndocument.getElementById('sel-format').addEventListener('change',e=>{params.format=e.target.value;gallerySeeds=[];render();buildGallery(false);});\n\n// ── v7 · multi-center wiring ───────────────────────────────────────────\nfunction showPolyInterfControls(){\n  const s=params.polyInterfere||'twin';\n  document.getElementById('poly-twin-group').style.display=(s==='twin')?'':'none';\n  document.getElementById('poly-grow-group').style.display=(s==='grow')?'':'none';\n  document.getElementById('poly-dual-group').style.display=(s==='dual')?'':'none';\n}\nfunction showMultiControls(){ document.getElementById('multi-controls').style.display=params.multiCenter?'':'none';\n  const mc=params.multiCenter, mode=params.multiMode;\n  document.getElementById('poly-controls').style.display=(mc&&mode==='poly')?'':'none';\n  document.getElementById('tiled-controls').style.display=(mc&&mode==='tiled')?'':'none';\n  document.getElementById('orbit-controls').style.display=(mc&&mode==='orbiting')?'':'none';\n  document.getElementById('recurse-group').style.display=(mc&&mode==='orbiting'&&params.centersLayout==='recursive')?'':'none';\n  if(mc&&mode==='poly') showPolyInterfControls(); }\ndocument.querySelectorAll('#seg-multi button').forEach(b=>b.addEventListener('click',()=>{\n  params.multiCenter=(b.dataset.v==='on');\n  document.querySelectorAll('#seg-multi button').forEach(x=>x.classList.toggle('active',x===b));\n  showMultiControls();gallerySeeds=[];render();buildGallery(false);}));\ndocument.querySelectorAll('#seg-multimode button').forEach(b=>b.addEventListener('click',()=>{\n  params.multiMode=b.dataset.v;\n  document.querySelectorAll('#seg-multimode button').forEach(x=>x.classList.toggle('active',x===b));\n  showMultiControls();gallerySeeds=[];render();buildGallery(false);}));\ndocument.querySelectorAll('#seg-centerdot button').forEach(b=>b.addEventListener('click',()=>{\n  params.centerDot=(b.dataset.v==='on');\n  document.querySelectorAll('#seg-centerdot button').forEach(x=>x.classList.toggle('active',x===b));render();}));\nsegWire('seg-lattice','lattice');\n// v12 · sub-space decomposition wiring (structural → rebuild gallery)\ndocument.querySelectorAll('#seg-decK button').forEach(b=>b.addEventListener('click',()=>{\n  params.decK=parseInt(b.dataset.v)||0;\n  document.querySelectorAll('#seg-decK button').forEach(x=>x.classList.toggle('active',x===b));\n  render();buildGallery(false);}));\nsegWire('seg-decRule','decRule');\ndocument.querySelectorAll('#seg-decRule button').forEach(b=>b.addEventListener('click',()=>{render();buildGallery(false);}));\n// ── v9 · double-layer interference wiring ──────────────────────────────\ndocument.querySelectorAll('#seg-interfere button').forEach(b=>b.addEventListener('click',()=>{\n  params.interference=(b.dataset.v==='on');\n  document.querySelectorAll('#seg-interfere button').forEach(x=>x.classList.toggle('active',x===b));\n  document.getElementById('interfere-controls').style.display=params.interference?'':'none';\n  // first time on: give it visible fractal depth (the reference is dense)\n  if(params.interference && params.depthBoost<1){ params.depthBoost=1;\n    document.getElementById('depthBoost').value=1; document.getElementById('depthBoost-v').textContent='1'; }\n  gallerySeeds=[];render();buildGallery(false);}));\ndocument.getElementById('sel-interferePair').addEventListener('change',e=>{\n  params.interferePair=e.target.value;render();buildGallery(false);});\nsegWire('seg-interfereblend','interfereBlend');\n// ── v10 · polyhedron field wiring ──────────────────────────────────────\nsegWire('seg-polyAxis','polyAxis'); segWire('seg-polyAxisB','polyAxisB');\nsegWire('seg-polyArmature','polyArmature'); segWire('seg-polyBlend','polyBlend');\n['polySpacing','polyCoverage','polyVertexRot','polyOverlayAngle','polyGrow','polyIntensity'].forEach(k=>sliderWire(k,k));\n['sel-polySolid:polySolid','sel-polySolidB:polySolidB','sel-polyPair:polyPair'].forEach(pair=>{\n  const [id,key]=pair.split(':');\n  document.getElementById(id).addEventListener('change',e=>{params[key]=e.target.value;gallerySeeds=[];render();buildGallery(false);});\n});\ndocument.getElementById('sel-polyInterfere').addEventListener('change',e=>{\n  params.polyInterfere=e.target.value; showPolyInterfControls(); gallerySeeds=[];render();buildGallery(false);});\ndocument.querySelectorAll('#seg-polyCore button').forEach(b=>b.addEventListener('click',()=>{\n  params.polyCore=(b.dataset.v==='on');\n  document.querySelectorAll('#seg-polyCore button').forEach(x=>x.classList.toggle('active',x===b));render();}));\ndocument.querySelectorAll('#seg-polyFringe button').forEach(b=>b.addEventListener('click',()=>{\n  params.polyFringe=b.dataset.v;\n  document.querySelectorAll('#seg-polyFringe button').forEach(x=>x.classList.toggle('active',x===b));\n  // sensible default plate intensity per look (line fringe can run bright; filled must sit back)\n  const inten = b.dataset.v==='line'?0.92:0.58;\n  params.polyIntensity=inten;\n  const sl=document.getElementById('polyIntensity'); if(sl){sl.value=inten;document.getElementById('polyIntensity-v').textContent=inten;}\n  gallerySeeds=[];render();buildGallery(false);}));\ndocument.getElementById('sel-centersLayout').addEventListener('change',e=>{\n  params.centersLayout=e.target.value;\n  if(params.centersLayout==='solid'&&params.solid==='none'){params.solid='ve';document.querySelectorAll('#seg-solid button').forEach(x=>x.classList.toggle('active',x.dataset.v==='ve'));document.getElementById('axis-group').style.display='';}\n  showMultiControls();gallerySeeds=[];render();buildGallery(false);});\ndocument.getElementById('sel-armature').addEventListener('change',e=>{params.armature=e.target.value;render();});\nsegWire('seg-globalsym','globalSym'); segWire('seg-orient','satelliteOrient'); segWire('seg-satclip','satelliteClip');\nsegWire('seg-blend','planeBBlend');\ndocument.querySelectorAll('#seg-planeb button').forEach(b=>b.addEventListener('click',()=>{\n  params.planeB=(b.dataset.v==='on');\n  document.querySelectorAll('#seg-planeb button').forEach(x=>x.classList.toggle('active',x===b));\n  document.getElementById('planeb-controls').style.display=params.planeB?'':'none';gallerySeeds=[];render();buildGallery(false);}));\ndocument.querySelectorAll('#seg-play button').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('#seg-play button').forEach(x=>x.classList.toggle('active',x===b));\n  setPlaying(b.dataset.v==='on');}));\ndocument.querySelectorAll('#seg-concentric button').forEach(b=>b.addEventListener('click',()=>{\n  params.concentric=(b.dataset.v==='concentric');\n  document.querySelectorAll('#seg-concentric button').forEach(x=>x.classList.toggle('active',x===b));render();}));\nsegWire('seg-axis','axis');\nsegWire('seg-solid','solid');\ndocument.querySelectorAll('#seg-solid button').forEach(b=>b.addEventListener('click',()=>{\n  document.getElementById('axis-group').style.display=(params.solid!=='none')?'':'none';\n}));\nsegWire('seg-layout','layout'); \ndocument.querySelectorAll('#seg-layout button').forEach(b=>b.addEventListener('click',syncLayout));\n// rAF-debounced render so a slider DRAG coalesces to at most one render per\n// frame instead of one heavy render per input event.\nlet _renderQueued=false, _pbSettle=0;\n// palette-true overlap layers are the expensive path (a full-plate mask + key\n// filter per colour behind, rebuilt every render). During a live drag we render\n// the base stack only and let a trailing render restore the overlaps.\nfunction pbActive(){ return !!params.layered && (params.layers||[]).some(\n  L=>L && L.visible!==false && L.layerBlend && L.layerBlend.indexOf('pb:')===0); }\nfunction scheduleRender(live){\n  if(live && pbActive()){\n    params._pbFast=true; clearTimeout(_pbSettle);\n    _pbSettle=setTimeout(()=>{ params._pbFast=false; render(); },200);\n  }\n  if(_renderQueued)return; _renderQueued=true;\n  requestAnimationFrame(()=>{ _renderQueued=false; render(); }); }\nfunction sliderWire(id,key){const el=document.getElementById(id),out=document.getElementById(id+'-v');\n  el.oninput=()=>{params[key]=parseFloat(el.value);out.textContent=el.value;scheduleRender(true);};}\n['features','cols','unit','order','rings','lineWeight','hue',\n 'centerCount','orbitRadius','satelliteScale','satelliteOrder','recurseDepth','recurseRatio','coreScale',\n 'centersAcross','latticeDetail','fieldRot','depthBoost','decJitter','decInward','interfereShift','interfereRot','interfereScale','interfereIntensity',\n 'planeRot','planeBOpacity','planeMix','coreRot','satRot'].forEach(k=>sliderWire(k,k));\n// animation speed updates the clock, not the SVG params (no re-render)\n(function(){const el=document.getElementById('animSpeed'),out=document.getElementById('animSpeed-v');\n  el.oninput=()=>{anim.speed=parseFloat(el.value);out.textContent=el.value;};})();\n\n// ── v7 · transform-only animation (no per-frame re-render) ─────────────\nfunction animTargets(){\n  const stage=fsOpen()?document.getElementById('fsStage'):document.getElementById('stageMain');\n  return { spins:[...stage.querySelectorAll('.geome-plane-spin')],\n           levels:[...stage.querySelectorAll('.geome-level')] };\n}\nfunction animFrame(ts){\n  if(!anim.playing) return;\n  if(!anim.last) anim.last=ts;\n  anim.t += (ts-anim.last)/1000*anim.speed; anim.last=ts;\n  const {spins,levels}=animTargets();\n  spins.forEach(g=>{ const dir=+g.dataset.dir||1; g.style.transform=`rotate(${(anim.t*8*dir).toFixed(2)}deg)`; g.style.transformOrigin='ce
