  renderOperadInspector(act, pal) {
    const node = this.getInspectedNode();
    if (!node) return `<div class="lbl">Select a node in the Operadic Tree.</div>`;
    const m = pal.ramp.length;
    const t = node.t || { x: 0, y: 0, s: 1, r: 0 };

    if (node.kind === 'atom') {
      const aMode = node.mode || 'solid';
      return `
        <div class="row">
          <span class="lbl">Atom Shape</span>
          <span style="color:var(--gold);font-weight:700;text-transform:uppercase;">${node.shape}</span>
          <div style="display:flex;gap:3px;">
            <button data-atom-flip="x" class="btn ${t.fx ? 'btn-gold' : ''}" style="padding:2px 6px;font-size:9px;" title="Flip Horizontal">⇆ X</button>
            <button data-atom-flip="y" class="btn ${t.fy ? 'btn-gold' : ''}" style="padding:2px 6px;font-size:9px;" title="Flip Vertical">⇅ Y</button>
          </div>
        </div>
        <div class="row">
          <span class="lbl">Palette Tone Rank</span>
          <div style="display:flex;gap:4px;">
            ${pal.ramp.map((hx, idx) => `
              <button data-nd-rank="${idx}" style="width:20px;height:20px;border-radius:50%;background:${hx};border:${((node.rank || 0) % m + m) % m === idx ? '2.5px solid #fff' : '1px solid rgba(255,255,255,0.2)'};"></button>
            `).join('')}
          </div>
        </div>
        <div class="row">
          <span class="lbl">Size (Radius)</span>
          <input data-atom-size="1" type="range" min="15" max="460" value="${Math.round(node.size || 120)}" style="flex:1;"/>
          <span class="val">${Math.round(node.size || 120)}</span>
        </div>
        <div class="row">
          <span class="lbl">Scale Multiplier</span>
          <input data-atom-scale="1" type="range" min="0.15" max="3.0" step="0.05" value="${+(t.s == null ? 1 : t.s).toFixed(2)}" style="flex:1;"/>
          <span class="val">${+(t.s == null ? 1 : t.s).toFixed(2)}×</span>
        </div>
        <div class="row">
          <span class="lbl">Position X</span>
          <input data-atom-tx="x" type="range" min="0" max="${this.doc.W}" value="${Math.round(t.x)}" style="flex:1;"/>
          <span class="val">${Math.round(t.x)}</span>
        </div>
        <div class="row">
          <span class="lbl">Position Y</span>
          <input data-atom-tx="y" type="range" min="0" max="${this.doc.H}" value="${Math.round(t.y)}" style="flex:1;"/>
          <span class="val">${Math.round(t.y)}</span>
        </div>
        <div class="row">
          <span class="lbl">Rotation °</span>
          <input data-atom-rot="1" type="range" min="-180" max="180" value="${Math.round((t.r || 0) * 180 / Math.PI)}" style="flex:1;"/>
          <span class="val">${Math.round((t.r || 0) * 180 / Math.PI)}°</span>
        </div>
        <div class="row" style="border-top:1px solid var(--border-subtle);padding-top:6px;margin-top:2px;">
          <span class="lbl">Paint Mode</span>
          <select id="atom-mode-sel" style="flex:1;">
            <option value="solid" ${aMode === 'solid' ? 'selected' : ''}>Solid (Glued & Recut)</option>
            <option value="veil" ${aMode === 'veil' ? 'selected' : ''}>Veil (Translucent Tint)</option>
          </select>
        </div>
        ${aMode === 'veil' ? `
          <div class="row">
            <span class="lbl">Veil Opacity α</span>
            <input id="atom-veil-alpha" type="range" min="0.05" max="1" step="0.05" value="${node.alpha != null ? node.alpha : 0.55}" style="flex:1;"/>
            <span class="val">${(node.alpha != null ? node.alpha : 0.55).toFixed(2)}</span>
          </div>
          <div class="row">
            <span class="lbl">Veil Blend</span>
            <select id="atom-veil-blend" style="flex:1;">
              ${['multiply', 'normal', 'screen'].map(b => `<option value="${b}" ${(node.blend || 'multiply') === b ? 'selected' : ''}>${b}</option>`).join('')}
            </select>
          </div>
        ` : ''}
      `;
    }

    // Operator node: render schema-driven controls + Associahedron K_n widget + Unit Transform & Rank Shift
    const def = SE.OPS[node.op];
    if (!def) return `<div class="lbl">Container Group</div>`;
    const P = node.p || {};
    const schemaHTML = (def.schema || []).map(sc => {
      const val = P[sc.k] != null ? P[sc.k] : def.defaults[sc.k];
      if (sc.opts) {
        return `
          <div class="row">
            <span class="lbl">${sc.label}</span>
            <select data-op-opt="${sc.k}" style="flex:1;">
              ${sc.opts.map(o => `<option value="${o}" ${String(val) === String(o) ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
          </div>
        `;
      }
      return `
        <div class="row">
          <span class="lbl">${sc.label}</span>
          <input data-op-num="${sc.k}" type="range" min="${sc.min}" max="${sc.max}" step="${sc.step}" value="${val}" style="flex:1;"/>
          <span class="val">${val}</span>
        </div>
      `;
    }).join('');

    const ingestHTML = node.op === 'ingest' ? `
      <div style="background:#0d0d10;border:1px solid var(--border-subtle);border-radius:6px;padding:7px;margin-bottom:6px;display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:var(--text-muted);">
          <span>Source: <strong style="color:var(--gold);">${node.label || 'Ingested Image'}</strong></span>
          <span>${node._src ? `${node._src.w}×${node._src.h}px` : 'Traced polygons'}</span>
        </div>
        <div style="display:flex;gap:5px;">
          <button id="btn-op-retrace" class="btn-gold" style="flex:1;padding:4px 6px;" title="Re-trace source luma with current parameters">↻ Re-trace now</button>
          <button id="btn-op-ingest-pal" class="btn" style="flex:1;padding:4px 6px;" title="Extract palette from this Ingest unit's source">🎨 Palette from source</button>
        </div>
      </div>
    ` : '';

    return `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:10px;color:var(--gold);font-weight:700;">${def.glyph} · ${def.name.toUpperCase()}</div>
        <div style="display:flex;gap:3px;">
          <button data-op-flip="x" class="btn ${t.fx ? 'btn-gold' : ''}" style="padding:2px 6px;font-size:9px;" title="Flip Unit Horizontal">⇆ X</button>
          <button data-op-flip="y" class="btn ${t.fy ? 'btn-gold' : ''}" style="padding:2px 6px;font-size:9px;" title="Flip Unit Vertical">⇅ Y</button>
        </div>
      </div>
      <div style="font-size:9.5px;color:var(--text-muted);font-style:italic;margin-bottom:4px;">${def.orphic}</div>
      ${ingestHTML}
      ${node.op === 'assoc' ? this.renderAssociahedronWidget(node, P) : ''}
      ${schemaHTML}
      <div style="border-top:1px solid var(--border-subtle);padding-top:6px;margin-top:4px;display:flex;flex-direction:column;gap:5px;">
        <div style="font-size:9px;color:var(--gold);font-weight:700;letter-spacing:0.04em;">UNIT TRANSFORM & RANK SHIFT</div>
        <div class="row">
          <span class="lbl">Unit Offset X</span>
          <input data-op-tx="x" type="range" min="${-Math.round(this.doc.W / 2)}" max="${Math.round(this.doc.W / 2)}" step="2" value="${Math.round(t.x || 0)}" style="flex:1;"/>
          <span class="val">${Math.round(t.x || 0)}</span>
        </div>
        <div class="row">
          <span class="lbl">Unit Offset Y</span>
          <input data-op-tx="y" type="range" min="${-Math.round(this.doc.H / 2)}" max="${Math.round(this.doc.H / 2)}" step="2" value="${Math.round(t.y || 0)}" style="flex:1;"/>
          <span class="val">${Math.round(t.y || 0)}</span>
        </div>
        <div class="row">
          <span class="lbl">Unit Scale</span>
          <input data-op-scale="1" type="range" min="0.2" max="2.5" step="0.02" value="${+(t.s == null ? 1 : t.s).toFixed(2)}" style="flex:1;"/>
          <span class="val">${+(t.s == null ? 1 : t.s).toFixed(2)}×</span>
        </div>
        <div class="row">
          <span class="lbl">Unit Rotate °</span>
          <input data-op-rot="1" type="range" min="-180" max="180" step="1" value="${Math.round((t.r || 0) * 180 / Math.PI)}" style="flex:1;"/>
          <span class="val">${Math.round((t.r || 0) * 180 / Math.PI)}°</span>
        </div>
        <div class="row">
          <span class="lbl">Rank Shift (+k)</span>
          <input data-op-rank="1" type="range" min="0" max="${Math.max(1, m - 1)}" step="1" value="${node.rank || 0}" style="flex:1;"/>
          <span class="val">+${node.rank || 0}</span>
        </div>
      </div>
    `;
  }

  renderAssociahedronWidget(node, P) {
    const arity = Math.max(2, Math.min(5, (node.children || []).length || 4));
    const K = SE.associahedron(arity);
    const vA = Math.max(0, Math.min(K.verts.length - 1, P.vertex | 0));
    const V = K.verts[vA];
    const vB = (P.toward >= 0 && V.nb.includes(P.toward)) ? P.toward : (V.nb[0] || 0);
    // Normalize coordinates for SVG display
    const maxR = Math.max(1, ...K.verts.map(v => Math.hypot(v.x || 0, v.y || 0)));
    const sx = v => ((v.x || 0) / maxR) * 82;
    const sy = v => ((v.y || 0) / maxR) * 82;
    return `
      <div style="background:#0d0d10;border:1px solid var(--border-subtle);border-radius:6px;padding:8px;margin-bottom:4px;">
        <div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--gold);margin-bottom:4px;">
          <span>Stasheff Polytope K_${arity} (${K.verts.length} vertices)</span>
          <span>${V.label} → ${K.verts[vB] ? K.verts[vB].label : ''}</span>
        </div>
        <svg viewBox="-115 -105 230 210" style="width:100%;height:145px;display:block;">
          ${K.edges.map(([i, j]) => {
            const vi = K.verts[i], vj = K.verts[j];
            const isActEdge = (i === vA && j === vB) || (i === vB && j === vA);
            return `<line x1="${sx(vi)}" y1="${sy(vi)}" x2="${sx(vj)}" y2="${sy(vj)}" stroke="${isActEdge ? '#e87258' : 'rgba(255,255,255,0.22)'}" stroke-width="${isActEdge ? '2.2' : '1.5'}"/>`;
          }).join('')}
          ${K.verts.map((v, i) => `
            <g data-assoc-v="${i}" style="cursor:pointer;">
              <circle cx="${sx(v)}" cy="${sy(v)}" r="${i === vA ? 8 : 5.5}" fill="${i === vA ? '#d4a84b' : (i === vB ? '#e87258' : '#2a2a32')}" stroke="#0a0a0b" stroke-width="1.5"/>
              <text x="${sx(v)}" y="${sy(v) - 10}" fill="#edeae3" font-size="7.5" text-anchor="middle">${v.label}</text>
            </g>
          `).join('')}
        </svg>
        <div class="row" style="margin-top:4px;">
          <span class="lbl">Straight-Line Edge Homotopy</span>
          <input data-op-num="walk" type="range" min="0" max="1" step="0.02" value="${P.walk || 0}" style="flex:1;"/>
          <span class="val">${(P.walk || 0).toFixed(2)}</span>
        </div>
        ${(V.nb || []).length ? `
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center;">
            <span class="lbl" style="font-size:8.5px;">Step edge →</span>
            ${V.nb.map(nbIdx => `
              <button data-assoc-nb="${nbIdx}" class="btn ${nbIdx === vB ? 'btn-gold' : ''}" style="padding:2px 6px;font-size:8.5px;" title="Click to target edge · Double-click to step vertex">${K.verts[nbIdx].label}</button>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  renderLayerInspector(act, pal) {
    if (!act) return '';
    const isGeome = act.kind === 'geome';
    return `
      ${isGeome ? `
        <div class="row">
          <span class="lbl">Archetype Recipe</span>
          <select id="ly-symbol" style="flex:1;">
            <option value="custom" ${act.symbol === 'custom' ? 'selected' : ''}>Custom Ring Recipe</option>
            ${SE.SYMBOLS.map(s => `<option value="${s.key}" ${act.symbol === s.key ? 'selected' : ''}>${s.group}: ${s.name}</option>`).join('')}
          </select>
        </div>
        <div class="row">
          <span class="lbl">Construction Seed</span>
          <input id="ly-seed" type="number" value="${act.seed || 1927}" style="width:80px;"/>
          <button id="ly-seed-prev" class="btn">−1</button>
          <button id="ly-seed-next" class="btn">+1</button>
          <button id="ly-seed-rand" class="btn-gold">🎲 Random</button>
        </div>
        <div class="row"><span class="lbl">Symmetry Order Dₙ</span><input data-ly-num="order" type="range" min="3" max="24" step="1" value="${act.order || 8}" style="flex:1;"/><span class="val">D${act.order || 8}</span></div>
        <div class="row"><span class="lbl">Concentric Rings</span><input data-ly-num="rings" type="range" min="1" max="9" step="1" value="${act.rings || 5}" style="flex:1;"/><span class="val">${act.rings || 5}R</span></div>
      ` : `
        <div class="row"><span class="lbl">Equal-Mass Adapt</span><input data-ly-num="adapt" type="range" min="0" max="1" step="0.05" value="${act.adapt || 0}" style="flex:1;"/><span class="val">${act.adapt || 0}</span></div>
        <div class="row"><span class="lbl">Min Contour Area</span><input data-ly-num="minArea" type="range" min="10" max="600" step="10" value="${act.minArea || 80}" style="flex:1;"/><span class="val">${act.minArea || 80}</span></div>
        <div class="row"><span class="lbl">Simplify ε</span><input data-ly-num="eps" type="range" min="0" max="4" step="0.1" value="${act.eps == null ? 1.0 : act.eps}" style="flex:1;"/><span class="val">${act.eps == null ? 1.0 : act.eps}</span></div>
        <div class="row">
          <span class="lbl">Invert Luminance</span><input id="ly-invert" type="checkbox" ${act.invert ? 'checked' : ''}/>
          <span class="lbl" style="margin-left:10px;" title="Sub-pixel linear root interpolation + Taubin fairing">Sub-Pixel Iso</span>
          <input id="ly-subpixel" type="checkbox" ${(act.subpixel != null ? act.subpixel : this.doc.subpixelTrace !== false) ? 'checked' : ''}/>
        </div>
      `}

      <div class="row"><span class="lbl">Tone Plates</span><input data-ly-num="levels" type="range" min="2" max="8" step="1" value="${act.levels || 4}" style="flex:1;"/><span class="val">${act.levels || 4}L</span></div>
      <div class="row"><span class="lbl">Fourier Harmonics</span><input data-ly-num="harm" type="range" min="0" max="64" step="1" value="${act.harm || 0}" style="flex:1;"/><span class="val">${act.harm === 0 ? 'Exact' : 'H' + act.harm}</span></div>
      <div class="row">
        <span class="lbl">Harmonic Basis</span>
        <select id="ly-basis" style="flex:1;">
          <option value="all" ${(act.basis || 'all') === 'all' ? 'selected' : ''}>Full Spectrum</option>
          <option value="fib" ${act.basis === 'fib' ? 'selected' : ''}>Fibonacci Sequence</option>
          <option value="phi" ${act.basis === 'phi' ? 'selected' : ''}>Golden φ-Powers</option>
        </select>
      </div>
      <div class="row">
        <span class="lbl">Placement Armature</span>
        <select id="ly-armature" style="flex:1;">
          ${(isGeome
            ? [['radial', 'Radial Mandala'], ['mirror', 'Bilateral Mirror'], ['field', 'R2 Constellation Field'], ['strata', 'Horizontal Strata'], ['grid', 'Seeded Lattice Grid'], ['cascade', 'Diagonal Cascade']]
            : [['trace', 'Traced In-Place'], ['radial', 'Scatter: Radial'], ['mirror', 'Scatter: Mirror'], ['field', 'Scatter: Field'], ['strata', 'Scatter: Strata'], ['grid', 'Scatter: Grid'], ['cascade', 'Scatter: Cascade']]
          ).map(([k, lbl]) => `<option value="${k}" ${(isGeome ? act.comp : act.place) === k ? 'selected' : ''}>${lbl}</option>`).join('')}
        </select>
      </div>
      <div class="row"><span class="lbl">φ Contour Echoes</span><input data-ly-num="echo" type="range" min="0" max="12" step="1" value="${act.echo || 0}" style="flex:1;"/><span class="val">${act.echo || 0}</span></div>
      <div class="row">
        <span class="lbl">Overlap Re-Cut</span>
        <select id="ly-pb" style="flex:1;">
          <option value="off" ${act.pb === 'off' ? 'selected' : ''}>Off (Opaque Stack)</option>
          <option value="cycle1" ${act.pb === 'cycle1' ? 'selected' : ''}>Cycle +1 Tone Plate</option>
          <option value="cycle2" ${act.pb === 'cycle2' ? 'selected' : ''}>Cycle +2 Tone Plates</option>
          <option value="complement" ${act.pb === 'complement' ? 'selected' : ''}>Complement Tone Plate</option>
        </select>
      </div>
      <div class="row"><span class="lbl">Scale</span><input data-ly-num="scale" type="range" min="0.25" max="2.2" step="0.02" value="${act.scale == null ? 1 : act.scale}" style="flex:1;"/><span class="val">${act.scale == null ? 1 : act.scale}</span></div>
      <div class="row"><span class="lbl">Rotate °</span><input data-ly-num="rot" type="range" min="-180" max="180" step="1" value="${act.rot || 0}" style="flex:1;"/><span class="val">${act.rot || 0}°</span></div>
    `;
  }

  bindEvents() {
    const q = (sel) => this.rootEl.querySelector(sel);
    const qa = (sel) => Array.from(this.rootEl.querySelectorAll(sel));

    // Close open dropdown menu when clicking anywhere outside the menu bar
    this.rootEl.onclick = (e) => {
      if (this.ui.openMenu && !e.target.closest('.menubar-item')) {
        this.ui.openMenu = null;
        this.render();
      }
    };

    // Desktop Menu Bar toggles & hover switch
    qa('[data-menu-toggle]').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const k = el.dataset.menuToggle;
        this.ui.openMenu = (this.ui.openMenu === k) ? null : k;
        this.render();
      };
      el.onmouseenter = () => {
        if (this.ui.openMenu && this.ui.openMenu !== el.dataset.menuToggle) {
          this.ui.openMenu = el.dataset.menuToggle;
          this.render();
        }
      };
    });
    qa('[data-menu-action]').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        this.runMenuAction(el.dataset.menuAction);
      };
    });

    // Left Canvas Tool Rail bindings
    qa('[data-tool-rail]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const act = btn.dataset.toolRail;
        if (act === 'select') { this.ui.toolMode = 'select'; this.ui.sessionNotice = 'Tool: Unit Select & Gizmo (V)'; this.render(); }
        else if (act === 'direct') { this.ui.toolMode = 'direct'; this.ui.sessionNotice = 'Tool: Direct Leaf Atom Select (A)'; this.render(); }
        else if (act === 'add-circle') this.addPrimitiveAtom('circle');
        else if (act === 'add-square') this.addPrimitiveAtom('square');
        else if (act === 'add-triangle') this.addPrimitiveAtom('triangle');
        else if (act === 'ingest') { this._uploadMode = 'operad-ingest'; this._imgInput.click(); }
        else if (act === 'group') this.groupSelection();
        else if (act === 'flatten') this.flattenSelection();
        else if (act === 'release') this.clearSelection();
      };
    });

    // Floating Quick-Transform Context Bar bindings
    qa('[data-qact]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const k = btn.dataset.qact;
        if (k === 'rot-ccw') this.rotateSelectionBy(e.shiftKey ? -45 : -15);
        else if (k === 'rot-cw') this.rotateSelectionBy(e.shiftKey ? 45 : 15);
        else if (k === 'rot-phi') this.rotateSelectionBy(137.508);
        else if (k === 'scl-dn') this.scaleSelectionBy(e.shiftKey ? 0.75 : 0.90);
        else if (k === 'scl-up') this.scaleSelectionBy(e.shiftKey ? 1.25 : 1.10);
        else if (k === 'flip-x') this.flipSelection('x');
        else if (k === 'flip-y') this.flipSelection('y');
        else if (k === 'center') this.centerSelection();
        else if (k === 'reset') this.resetSelectionTransform();
        else if (k === 'dup') this.duplicateSelectedNodes();
        else if (k === 'del') this.deleteSelectedNodes();
        else if (k === 'release') this.clearSelection();
      };
    });

    qa('[data-ws]').forEach(btn => btn.onclick = () => {
      this.ui.workspace = btn.dataset.ws;
      this.ui.mobileSheet = null;
      this.fitZoomToViewport();
      this.render();
    });

    // Dedicated Mobile Studio Mode bindings
    if (q('#btn-toggle-mobile-mode')) q('#btn-toggle-mobile-mode').onclick = () => {
      this.ui.mobileMode = !this.ui.mobileMode;
      this.ui.mobileSheet = null;
      this.fitZoomToViewport();
      this.render();
    };
    if (q('#btn-mob-switch-pro')) q('#btn-mob-switch-pro').onclick = () => {
      this.ui.mobileMode = false;
      this.ui.mobileSheet = null;
      this.fitZoomToViewport();
      this.render();
    };
    if (q('#btn-mob-guide')) q('#btn-mob-guide').onclick = () => {
      this.ui.mobGuideOpen = true;
      this.render();
    };
    if (q('#btn-close-mob-guide')) q('#btn-close-mob-guide').onclick = () => {
      this.ui.mobGuideOpen = false;
      this.render();
    };
    if (q('#mob-guide-backdrop')) q('#mob-guide-backdrop').onclick = () => {
      this.ui.mobGuideOpen = false;
      this.render();
    };
    if (q('#btn-guide-got-it')) q('#btn-guide-got-it').onclick = () => {
      this.ui.mobGuideOpen = false;
      this.render();
    };
    if (q('#btn-guide-try-create')) q('#btn-guide-try-create').onclick = () => {
      this.ui.mobGuideOpen = false;
      this.ui.mobTab = 'create';
      this.ui.mobCreateSub = 'shapes';
      this.fitZoomToViewport();
      this.render();
    };
    if (q('#btn-mob-sel-first')) q('#btn-mob-sel-first').onclick = () => {
      const root = this.getActiveOperadRoot();
      if (root && root.children && root.children[0]) {
        this.ui.selIds = [root.children[0].id];
        this.ui.inspectedId = root.children[0].id;
        this.ui.sessionNotice = `Selected ${root.children[0].label || root.children[0].op || root.children[0].shape}`;
        this.render();
      }
    };
    qa('[data-mob-tab]').forEach(btn => btn.onclick = () => {
      const t = btn.dataset.mobTab;
      if (this.ui.workspace !== 'compose') this.ui.workspace = 'compose';
      if (t === 'canvas') {
        this.ui.mobTab = 'canvas';
      } else {
        this.ui.mobTab = (this.ui.mobTab === t) ? 'canvas' : t;
      }
      this.fitZoomToViewport();
      this.render();
    });
    qa('[data-mob-create-sub]').forEach(btn => btn.onclick = () => {
      this.ui.mobCreateSub = btn.dataset.mobCreateSub;
      this.render();
    });
    qa('[data-mob-color-sub]').forEach(btn => btn.onclick = () => {
      this.ui.mobColorSub = btn.dataset.mobColorSub;
      this.render();
    });
    qa('[data-mob-hier]').forEach(btn => btn.onclick = () => {
      if (btn.dataset.mobHier === 'parent') this.selectParentNode();
      else this.selectChildNodes();
    });
    qa('[data-mob-nudge]').forEach(btn => btn.onclick = () => {
      const [dx, dy] = btn.dataset.mobNudge.split(',').map(Number);
      this.nudgeSelection(dx || 0, dy || 0);
    });

    qa('[data-mob-nav]').forEach(btn => btn.onclick = () => {
      const m = btn.dataset.mobNav;
      if (m === 'canvas') {
        this.ui.mobileSheet = null;
        this.render();
      } else if (m === 'left') {
        this.ui.mobileSheet = this.ui.mobileSheet === 'left' ? null : 'left';
        this.render();
      } else if (m === 'right') {
        this.ui.mobileSheet = this.ui.mobileSheet === 'right' ? null : 'right';
        this.render();
      } else if (m === 'cmd') {
        this.ui.mobileSheet = null;
        this.ui.cmdOpen = !this.ui.cmdOpen;
        this.ui.cmdQuery = '';
        this.ui.cmdIdx = 0;
        this.render();
      } else if (m === 'export') {
        this.ui.mobileSheet = null;
        this.exportSVG();
      }
    });
    qa('[data-close-mob-sheet]').forEach(btn => btn.onclick = () => {
      this.ui.mobileSheet = null;
      this.render();
    });
    if (q('#mobile-sheet-backdrop')) q('#mobile-sheet-backdrop').onclick = () => {
      this.ui.mobileSheet = null;
      this.render();
    };

    if (q('#hdr-format')) q('#hdr-format').onchange = (e) => {
      const oldW = this.doc.W, oldH = this.doc.H;
      this.doc.format = e.target.value;
      this.updateDimensions();
      this.fitZoomToViewport();
      this.doc.layers.forEach(ly => {
        if (ly.kind === 'operad' && ly.root) {
          SE.refitTree(ly.root, { W: oldW, H: oldH }, { W: this.doc.W, H: this.doc.H });
          SE.invalidate(ly.root);
        }
      });
      this.recompute();
    };
    if (q('#btn-cmd-palette')) q('#btn-cmd-palette').onclick = () => {
      this.ui.cmdOpen = !this.ui.cmdOpen;
      this.ui.cmdQuery = '';
      this.ui.cmdIdx = 0;
      this.render();
    };
    if (q('#btn-toggle-bezier')) q('#btn-toggle-bezier').onclick = () => this.toggleBezierCurves();
    if (q('#btn-zen')) q('#btn-zen').onclick = () => { this.ui.zenMode = !this.ui.zenMode; this.render(); };
    if (q('#btn-key-help')) q('#btn-key-help').onclick = () => { this.ui.helpOpen = !this.ui.helpOpen; this.render(); };
    if (q('#cmd-backdrop')) q('#cmd-backdrop').onclick = () => { this.ui.cmdOpen = false; this.render(); };
    if (q('#cmd-palette-input')) q('#cmd-palette-input').oninput = (e) => {
      this.ui.cmdQuery = e.target.value;
      this.ui.cmdIdx = 0;
      this.render();
    };
    qa('[data-cmd-idx]').forEach(el => {
      el.onmouseenter = () => { this.ui.cmdIdx = +el.dataset.cmdIdx; };
      el.onclick = () => {
        const list = this.getFilteredCommands();
        const item = list[+el.dataset.cmdIdx];
        this.ui.cmdOpen = false;
        if (item) item.run();
      };
    });
    if (q('#help-backdrop')) q('#help-backdrop').onclick = () => { this.ui.helpOpen = false; this.render(); };
    if (q('#btn-close-help')) q('#btn-close-help').onclick = () => { this.ui.helpOpen = false; this.render(); };

    if (q('#zoom-out')) q('#zoom-out').onclick = () => { this.ui.zoom = Math.max(0.18, +(this.ui.zoom - 0.08).toFixed(2)); this.render(); };
    if (q('#zoom-in')) q('#zoom-in').onclick = () => { this.ui.zoom = Math.min(2.5, +(this.ui.zoom + 0.08).toFixed(2)); this.render(); };
    if (q('#zoom-fit')) q('#zoom-fit').onclick = () => { this.fitZoomToViewport(); this.render(); };

    if (q('#btn-undo')) q('#btn-undo').onclick = () => this.undo();
    if (q('#btn-redo')) q('#btn-redo').onclick = () => this.redo();
    if (q('#btn-open-session')) q('#btn-open-session').onclick = () => this._sessionInput.click();
    if (q('#btn-save-json')) q('#btn-save-json').onclick = () => this.saveSessionJSON();
    if (q('#btn-save-gz')) q('#btn-save-gz').onclick = () => this.saveSessionGZ();
    if (q('#btn-exp-svg')) q('#btn-exp-svg').onclick = () => this.exportSVG();
    if (q('#btn-exp-png')) q('#btn-exp-png').onclick = () => this.exportHighDPI();

    qa('[data-toggle-left]').forEach(h => h.onclick = () => {
      const k = h.dataset.toggleLeft;
      this.ui.leftSec[k] = !this.ui.leftSec[k];
      this.render();
    });
    qa('[data-toggle-right]').forEach(h => h.onclick = () => {
      const k = h.dataset.toggleRight;
      this.ui.rightSec[k] = !this.ui.rightSec[k];
      this.render();
    });

    if (q('#add-ly-operad')) q('#add-ly-operad').onclick = () => this.addOperadLayer();
    if (q('#add-ly-image')) q('#add-ly-image').onclick = () => this.addDemoImageLayer();
    if (q('#add-ly-geome')) q('#add-ly-geome').onclick = () => this.addGeomeLayer();
    if (q('#btn-convert-operad')) q('#btn-convert-operad').onclick = () => this.convertActiveLayerToOperad();

    qa('[data-sel-layer]').forEach(el => el.onclick = () => {
      this.doc.activeLayer = +el.dataset.selLayer;
      const act = this.activeLayer();
      if (act && act.kind === 'operad' && act.root && act.root.children[0]) {
        this.ui.selIds = [act.root.children[0].id];
        this.ui.inspectedId = act.root.children[0].id;
      }
      this.render();
    });
    qa('[data-vis-layer]').forEach(btn => btn.onclick = (e) => {
      e.stopPropagation();
      const idx = +btn.dataset.visLayer;
      this.doc.layers[idx].visible = this.doc.layers[idx].visible === false ? true : false;
      this.recompute();
    });
    qa('[data-up-layer]').forEach(btn => btn.onclick = (e) => { e.stopPropagation(); this.moveLayer(+btn.dataset.upLayer, 1); });
    qa('[data-dn-layer]').forEach(btn => btn.onclick = (e) => { e.stopPropagation(); this.moveLayer(+btn.dataset.dnLayer, -1); });
    qa('[data-dup-layer]').forEach(btn => btn.onclick = (e) => { e.stopPropagation(); this.duplicateLayer(+btn.dataset.dupLayer); });
    qa('[data-del-layer]').forEach(btn => btn.onclick = (e) => { e.stopPropagation(); this.deleteLayer(+btn.dataset.delLayer); });

    qa('[data-add-atom]').forEach(btn => btn.onclick = () => this.addOperadAtom(btn.dataset.addAtom));
    if (q('#btn-atom-ingest')) q('#btn-atom-ingest').onclick = () => { this._uploadMode = 'operad-ingest'; this._imgInput.click(); };
    qa('[data-wrap-op]').forEach(btn => btn.onclick = () => this.wrapInOperator(btn.dataset.wrapOp));
    qa('[data-tree-fold]').forEach(btn => btn.onclick = (e) => {
      e.stopPropagation();
      this.toggleNodeCollapsed(btn.dataset.treeFold, e.altKey);
    });
    if (q('#tree-fold-all')) q('#tree-fold-all').onclick = () => {
      const root = this.getActiveOperadRoot();
      if (!root) return;
      this.ui.collapsedIds = this.ui.collapsedIds || {};
      SE.walk(root, n => { if (n.kind === 'op' && n.id !== 'root') this.ui.collapsedIds[n.id] = true; });
      this.render();
    };
    if (q('#tree-expand-all')) q('#tree-expand-all').onclick = () => {
      const root = this.getActiveOperadRoot();
      if (!root) return;
      this.ui.collapsedIds = this.ui.collapsedIds || {};
      SE.walk(root, n => { if (n.kind === 'op' && n.id !== 'root') this.ui.collapsedIds[n.id] = false; });
      this.render();
    };
    qa('[data-tree-node]').forEach(el => el.onclick = (e) => {
      const id = el.dataset.treeNode;
      if (e.altKey) {
        this.toggleNodeCollapsed(id, e.shiftKey);
        return;
      }
      if (e.shiftKey) {
        this.ui.selIds = this.ui.selIds.includes(id) ? this.ui.selIds.filter(x => x !== id) : this.ui.selIds.concat([id]);
      } else {
        this.ui.selIds = [id];
      }
      this.ui.inspectedId = id;
      this.render();
    });
    if (q('#op-flatten')) q('#op-flatten').onclick = () => this.flattenOperadNode();
    if (q('#op-ungroup')) q('#op-ungroup').onclick = () => this.ungroupOperadNode();
    if (q('#op-dup')) q('#op-dup').onclick = () => this.duplicateOperadNode();
    if (q('#op-del')) q('#op-del').onclick = () => this.deleteOperadNode();

    qa('[data-preset]').forEach(btn => btn.onclick = () => {
      this.pushUndo();
      const k = btn.dataset.preset;
      const newRoot = SE.presetTree(k);
      let act = this.activeLayer();
      if (!act || act.kind !== 'operad') {
        const ly = SE.mkOperadLayer('Operad · ' + k, newRoot);
        this.doc.layers.push(ly);
        this.doc.activeLayer = this.doc.layers.length - 1;
        act = ly;
      } else {
        act.root = newRoot;
      }
      if (act.root.children[0]) {
        this.ui.selIds = [act.root.children[0].id];
        this.ui.inspectedId = act.root.children[0].id;
      }
      this.recompute();
    });
    if (q('#btn-upload-img')) q('#btn-upload-img').onclick = () => { this._uploadMode = 'layer'; this._imgInput.click(); };
    if (q('#btn-ingest-operad')) q('#btn-ingest-operad').onclick = () => { this._uploadMode = 'operad-ingest'; this._imgInput.click(); };

    // Pre-Load Downsample & Pixel-Space Fidelity bindings
    if (q('#btn-native-res')) q('#btn-native-res').onclick = () => this.toggleNativeFidelity();
    if (q('#fid-src-max')) q('#fid-src-max').oninput = (e) => {
      this.doc.sourceMaxSide = parseInt(e.target.value, 10);
      this.render();
    };
    if (q('#fid-luma-res')) q('#fid-luma-res').oninput = (e) => {
      this.doc.lumaRes = parseInt(e.target.value, 10);
      this.render();
    };
    if (q('#fid-ingest-grid')) q('#fid-ingest-grid').oninput = (e) => {
      this.doc.ingestGrid = parseInt(e.target.value, 10);
      this.render();
    };
    if (q('#fid-subpixel')) q('#fid-subpixel').onchange = (e) => {
      this.doc.subpixelTrace = e.target.checked;
      this.doc.layers.forEach(ly => {
        if (ly.kind === 'image') ly.subpixel = e.target.checked;
        if (ly.kind === 'operad' && ly.root) {
          SE.walk(ly.root, n => {
            if (n.kind === 'op' && n.op === 'ingest') {
              n.p = Object.assign({}, SE.OPS.ingest.defaults, n.p || {}, { subpixel: e.target.checked ? 1 : 0 });
              SE.retrace(n);
            }
          });
          SE.invalidate(ly.root);
        }
      });
      this._ckv++;
      this._bandCache = {};
      this.recompute();
    };
    if (q('#fid-trim')) q('#fid-trim').onchange = (e) => {
      this.doc.trimMargin = e.target.checked;
      this.resampleActiveSources();
    };
    if (q('#fid-bezier')) q('#fid-bezier').onchange = () => this.toggleBezierCurves();
    if (q('#fid-autolod')) q('#fid-autolod').onchange = (e) => {
      this.doc.autoLOD = e.target.checked;
      this.render();
    };
    if (q('#fid-lossless')) q('#fid-lossless').onchange = (e) => {
      this.doc.losslessSources = e.target.checked;
      this.render();
    };
    if (q('#btn-resample-sources')) q('#btn-resample-sources').onclick = () => {
      this.resampleActiveSources();
    };

    qa('[data-band-chip]').forEach(btn => btn.onclick = (e) => {
      const act = this.activeLayer();
      if (!act) return;
      const r = +btn.dataset.bandChip;
      if (e.altKey) {
        const pal = this.resolvePalette(act.lyPal);
        const m = Math.max(1, pal.ramp.length);
        act.bandColors = act.bandColors || {};
        act.bandColors[r] = ((act.bandColors[r] == null ? r : act.bandColors[r]) + 1) % m;
      } else if (e.shiftKey) {
        act.bandsCut = act.bandsCut || {};
        if (act.bandsCut[r]) delete act.bandsCut[r]; else act.bandsCut[r] = 1;
      } else {
        act.bandsOff = act.bandsOff || {};
        if (act.bandsOff[r]) delete act.bandsOff[r]; else act.bandsOff[r] = 1;
      }
      this.recompute();
    });

    qa('[data-ring-card]').forEach(card => card.onclick = (e) => {
      const act = this.activeLayer();
      if (!act || act.kind !== 'geome') return;
      const i = +card.dataset.ringCard;
      if (e.shiftKey) {
        // Per ORPHIC-META-SPEC.md P5 & σ3: Shift+Click pins per-ring tone rank
        const pal = this.resolvePalette(act.lyPal);
        const m = Math.max(1, pal.ramp.length);
        act.ringRanks = act.ringRanks || act.ringTones || {};
        act.ringTones = act.ringRanks;
        if (act.ringRanks[i] == null) act.ringRanks[i] = i % m;
        else if (act.ringRanks[i] + 1 >= m) delete act.ringRanks[i];
        else act.ringRanks[i] = (act.ringRanks[i] + 1) % m;
      } else if (e.altKey) {
        act.ringOver = act.ringOver || {};
        if (act.ringOver[i] === 'merge') delete act.ringOver[i]; else act.ringOver[i] = 'merge';
      } else {
        const all = SE.allKinds();
        const rec = Array.from({ length: act.rings || 5 }, (_, j) => (act.recipe && act.recipe.length) ? act.recipe[j % act.recipe.length] : 'annulus');
        const curIx = all.findIndex(k => k.key === rec[i]);
        rec[i] = all[(curIx + 1) % all.length].key;
        act.recipe = rec;
        act.symbol = 'custom';
      }
      this.recompute();
    });

    // Operad Node Inspector bindings
    const node = this.getInspectedNode();
    const root = this.getActiveOperadRoot();
    if (node && root) {
      qa('[data-nd-rank]').forEach(btn => btn.onclick = () => {
        node.rank = +btn.dataset.ndRank;
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-atom-size]').forEach(inp => inp.oninput = (e) => {
        node.size = parseFloat(e.target.value);
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-atom-scale]').forEach(inp => inp.oninput = (e) => {
        node.t.s = parseFloat(e.target.value);
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-atom-flip]').forEach(btn => btn.onclick = () => {
        const k = btn.dataset.atomFlip === 'x' ? 'fx' : 'fy';
        node.t[k] = !node.t[k];
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-atom-tx]').forEach(inp => inp.oninput = (e) => {
        node.t[inp.dataset.atomTx] = parseFloat(e.target.value);
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-atom-rot]').forEach(inp => inp.oninput = (e) => {
        node.t.r = parseFloat(e.target.value) * Math.PI / 180;
        SE.invalidate(root);
        this.recompute();
      });
      if (q('#atom-mode-sel')) q('#atom-mode-sel').onchange = (e) => {
        node.mode = e.target.value;
        if (node.mode === 'veil' && node.alpha == null) node.alpha = 0.55;
        if (node.mode === 'veil' && !node.blend) node.blend = 'multiply';
        SE.invalidate(root);
        this.recompute();
      };
      if (q('#atom-veil-alpha')) q('#atom-veil-alpha').oninput = (e) => {
        node.alpha = parseFloat(e.target.value);
        SE.invalidate(root);
        this.recompute();
      };
      if (q('#atom-veil-blend')) q('#atom-veil-blend').onchange = (e) => {
        node.blend = e.target.value;
        SE.invalidate(root);
        this.recompute();
      };
      qa('[data-op-num]').forEach(inp => inp.oninput = (e) => {
        node.p = node.p || {};
        node.p[inp.dataset.opNum] = parseFloat(e.target.value);
        if (node.op === 'ingest') SE.retrace(node);
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-op-opt]').forEach(sel => sel.onchange = (e) => {
        node.p = node.p || {};
        const v = e.target.value;
        node.p[sel.dataset.opOpt] = isNaN(Number(v)) ? v : Number(v);
        if (node.op === 'ingest') SE.retrace(node);
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-op-tx]').forEach(inp => inp.oninput = (e) => {
        node.t[inp.dataset.opTx] = parseFloat(e.target.value);
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-op-scale]').forEach(inp => inp.oninput = (e) => {
        node.t.s = parseFloat(e.target.value);
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-op-rot]').forEach(inp => inp.oninput = (e) => {
        node.t.r = parseFloat(e.target.value) * Math.PI / 180;
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-op-rank]').forEach(inp => inp.oninput = (e) => {
        node.rank = parseInt(e.target.value, 10) || 0;
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-op-flip]').forEach(btn => btn.onclick = () => {
        const k = btn.dataset.opFlip === 'x' ? 'fx' : 'fy';
        node.t[k] = !node.t[k];
        SE.invalidate(root);
        this.recompute();
      });
      if (q('#btn-op-retrace')) q('#btn-op-retrace').onclick = () => {
        if (SE.retrace(node)) {
          SE.invalidate(root);
          this.ui.sessionNotice = `Re-traced Ingest source (${node.children.length} band groups)`;
          this.recompute();
        }
      };
      if (q('#btn-op-ingest-pal')) q('#btn-op-ingest-pal').onclick = () => {
        const src = node._src || (this.doc.lumas || [])[0];
        if (!src) return;
        const cp = SE.paletteFromSource(src, 6, node.label || 'Ingest');
        if (cp) {
          const deduped = SE.deduplicatePalettes((this.doc.imgPals || []).concat([cp]), 'img:' + (this.doc.imgPals || []).length);
          this.doc.imgPals = deduped.imgPals;
          this.doc.palKey = deduped.palKey;
          this.ui.sessionNotice = `Extracted palette from ${node.label || 'Ingest source'}`;
          this.recompute();
        }
      };
      qa('[data-assoc-v]').forEach(g => g.onclick = (e) => {
        const idx = +g.dataset.assocV;
        node.p = node.p || {};
        if (e.shiftKey) node.p.toward = idx;
        else { node.p.vertex = idx; node.p.walk = 0; }
        SE.invalidate(root);
        this.recompute();
      });
      qa('[data-assoc-nb]').forEach(btn => {
        btn.onclick = () => {
          const nbIdx = +btn.dataset.assocNb;
          node.p = node.p || {};
          if (node.p.toward === nbIdx && node.p.walk >= 0.98) {
            node.p.vertex = nbIdx;
            node.p.walk = 0;
          } else {
            node.p.toward = nbIdx;
            node.p.walk = 1;
          }
          SE.invalidate(root);
          this.recompute();
        };
      });
    }

    // Image / Geome Layer Inspector bindings
    const act = this.activeLayer();
    if (act && act.kind !== 'operad') {
      qa('[data-ly-num]').forEach(inp => inp.oninput = (e) => {
        act[inp.dataset.lyNum] = parseFloat(e.target.value);
        this.recompute();
      });
      if (q('#ly-invert')) q('#ly-invert').onchange = (e) => { act.invert = e.target.checked; this.recompute(); };
      if (q('#ly-subpixel')) q('#ly-subpixel').onchange = (e) => { act.subpixel = e.target.checked; this.recompute(); };
      if (q('#ly-basis')) q('#ly-basis').onchange = (e) => { act.basis = e.target.value; this.recompute(); };
      if (q('#ly-armature')) q('#ly-armature').onchange = (e) => {
        if (act.kind === 'geome') act.comp = e.target.value; else act.place = e.target.value;
        this.recompute();
      };
      if (q('#ly-pb')) q('#ly-pb').onchange = (e) => { act.pb = e.target.value; this.recompute(); };
      if (q('#ly-symbol')) q('#ly-symbol').onchange = (e) => {
        const v = e.target.value;
        act.symbol = v;
        const sym = SE.SYMBOLS.find(s => s.key === v);
        if (sym) { act.recipe = sym.recipe.slice(); act.order = sym.order; }
        this.recompute();
      };
      if (q('#ly-seed')) q('#ly-seed').onchange = (e) => { act.seed = Math.max(1, parseInt(e.target.value) || 1); this.recompute(); };
      if (q('#ly-seed-prev')) q('#ly-seed-prev').onclick = () => { act.seed = Math.max(1, (act.seed || 1) - 1); this.recompute(); };
      if (q('#ly-seed-next')) q('#ly-seed-next').onclick = () => { act.seed = (act.seed || 1) + 1; this.recompute(); };
      if (q('#ly-seed-rand')) q('#ly-seed-rand').onclick = () => { act.seed = Math.floor(Math.random() * 99999) + 1; this.recompute(); };
    }

    // Global Sheaf & Glue bindings
    if (q('#gl-mode')) q('#gl-mode').onchange = (e) => { this.doc.glueMode = e.target.value; this.recompute(); };
    if (q('#gl-triple')) q('#gl-triple').onchange = (e) => { this.doc.tripleGlue = e.target.checked; this.recompute(); };
    if (q('#gl-ground')) q('#gl-ground').onchange = (e) => { this.doc.ground = e.target.checked; this.recompute(); };
    if (q('#gl-relief')) q('#gl-relief').oninput = (e) => { this.doc.relief = parseFloat(e.target.value); this.recompute(); };
    if (q('#gl-stroke')) q('#gl-stroke').oninput = (e) => { this.doc.stroke = parseFloat(e.target.value); this.recompute(); };
    if (q('#gl-linead')) q('#gl-linead').onchange = (e) => { this.doc.linead = e.target.value; this.recompute(); };
    if (q('#gl-linead-w')) q('#gl-linead-w').oninput = (e) => { this.doc.lineadW = parseFloat(e.target.value); this.recompute(); };

    // Palette & Wada 348 bindings
    if (q('#pal-select')) q('#pal-select').onchange = (e) => { this.doc.palKey = e.target.value; this.recompute(); };
    if (q('#btn-swap-ground')) q('#btn-swap-ground').onclick = () => {
      const cur = this.resolvePalette();
      const inv = SE.invertGround(cur);
      const deduped = SE.deduplicatePalettes((this.doc.imgPals || []).concat([inv]), 'img:' + (this.doc.imgPals || []).length);
      this.doc.imgPals = deduped.imgPals;
      this.doc.palKey = deduped.palKey;
      this.recompute();
    };
    if (q('#btn-pal-from-src')) q('#btn-pal-from-src').onclick = () => {
      const firstLuma = (this.doc.lumas || [])[0];
      if (!firstLuma) return;
      const cp = SE.paletteFromSource(firstLuma);
      if (cp) {
        this.doc.customPal = cp;
        this.doc.palKey = 'custom';
        this.recompute();
      }
    };
    if (q('#wada-q')) q('#wada-q').oninput = (e) => {
      this.ui.wadaQ = e.target.value;
      this.render();
      const inp = this.rootEl.querySelector('#wada-q');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    };
    qa('[data-wada-sz]').forEach(btn => btn.onclick = () => { this.ui.wadaSize = btn.dataset.wadaSz; this.render(); });
    qa('[data-wada-pick]').forEach(card => card.onclick = (e) => {
      const id = card.dataset.wadaPick;
      const act = this.activeLayer();
      if (e.altKey && act && act.kind !== 'operad') {
        act.lyPal = id;
      } else {
        this.doc.palKey = id;
      }
      this.recompute();
    });

    // Print bindings
    if (q('#prn-inches')) q('#prn-inches').oninput = (e) => { this.doc.inches = parseFloat(e.target.value); this.render(); };
    qa('[data-inch-preset]').forEach(btn => btn.onclick = () => { this.doc.inches = parseFloat(btn.dataset.inchPreset); this.render(); });
    if (q('#prn-dpi')) q('#prn-dpi').onchange = (e) => { this.doc.dpi = parseInt(e.target.value, 10); this.render(); };

    // Direct Canvas Selection, Gizmo Handles (Translate / Scale / Rotate), Alt+Drag Duplicate, Marquee & Touch/Pinch
    const plateEl = q('#plate-container');
    const vpEl = q('#compose-viewport');
    if (vpEl) {
      vpEl.onpointerdown = (e) => {
        if (e.target === vpEl) {
          this.clearSelection();
        }
      };
      // Two-finger pinch-to-zoom on touch screens
      vpEl.ontouchstart = (e) => {
        if (e.touches && e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          this._pinchDist0 = Math.max(12, Math.hypot(dx, dy));
          this._pinchZoom0 = this.ui.zoom || 0.62;
        }
      };
      vpEl.ontouchmove = (e) => {
        if (e.touches && e.touches.length === 2 && this._pinchDist0) {
          e.preventDefault();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.max(12, Math.hypot(dx, dy));
          const nextZoom = Math.max(0.18, Math.min(2.5, +(this._pinchZoom0 * (dist / this._pinchDist0)).toFixed(2)));
          if (nextZoom !== this.ui.zoom) {
            this.ui.zoom = nextZoom;
            if (plateEl) {
              plateEl.style.width = `${Math.round(this.doc.W * this.ui.zoom)}px`;
              plateEl.style.height = `${Math.round(this.doc.H * this.ui.zoom)}px`;
            }
          }
        }
      };
      vpEl.ontouchend = (e) => {
        if (this._pinchDist0 && (!e.touches || e.touches.length < 2)) {
          this._pinchDist0 = 0;
          this.render();
        }
      };
    }
    if (plateEl) {
      plateEl.ondblclick = (e) => {
        const hit = e.target.closest('[data-leaf]');
        if (hit && hit.dataset.leaf) {
          e.stopPropagation();
          const leafId = hit.dataset.leaf;
          this.ui.selIds = [leafId];
          this.ui.inspectedId = leafId;
          this.ui.sessionNotice = `Direct-selected leaf atom`;
          this.render();
        }
      };

      plateEl.onpointerdown = (e) => {
        if ((e.pointerType === 'mouse' && e.button !== 0) || this._modal || this._pinchDist0) return;
        const now = Date.now();
        const leafHit = e.target.closest('[data-leaf]');
        if (e.pointerType === 'touch' && leafHit && leafHit.dataset.leaf) {
          if (this._lastTapLeaf === leafHit.dataset.leaf && (now - (this._lastTapTime || 0)) < 320) {
            e.preventDefault();
            e.stopPropagation();
            const leafId = leafHit.dataset.leaf;
            this.ui.selIds = [leafId];
            this.ui.inspectedId = leafId;
            this.ui.sessionNotice = `Direct-selected leaf atom`;
            this._lastTapTime = 0;
            this.render();
            return;
          }
          this._lastTapLeaf = leafHit.dataset.leaf;
          this._lastTapTime = now;
        }
        const getRect = () => plateEl.getBoundingClientRect();
        const toPlate = (ev) => {
          const r = getRect();
          return {
            x: (ev.clientX - r.left) * (this.doc.W / Math.max(1, r.width)),
            y: (ev.clientY - r.top) * (this.doc.H / Math.max(1, r.height))
          };
        };
        const startPt = toPlate(e);

        // 1. Check if user grabbed a Gizmo Handle (Rotate stem or 4 Scale corners)
        const gizmoEl = e.target.closest('[data-gizmo]');
        if (gizmoEl) {
          e.preventDefault();
          e.stopPropagation();
          const gMode = gizmoEl.dataset.gizmo;
          const bounds = this.getSelectionBounds();
          if (!bounds) return;
          this.pushUndo();
          const act = this.activeLayer();
          const cx = bounds.cx, cy = bounds.cy;
          const startAng = Math.atan2(startPt.y - cy, startPt.x - cx);
          const startDist = Math.max(8, Math.hypot(startPt.x - cx, startPt.y - cy));
          const nodes = (act && act.kind === 'operad') ? this.getTopSelectedNodes() : [];
          const snapNodes = nodes.map(n => ({
            node: n,
            r0: n.t.r || 0,
            s0: n.t.s == null ? 1 : n.t.s,
            size0: n.size || 120,
            x0: n.t.x || 0,
            y0: n.t.y || 0
          }));
          const lySnap = act ? { rot0: act.rot || 0, scale0: act.scale == null ? 1 : act.scale } : null;
          SE.live.drag = true;

          const onGizmoMove = (ev) => {
            if (this._pinchDist0) return;
            const pt = toPlate(ev);
            if (gMode === 'rot') {
              let dAng = Math.atan2(pt.y - cy, pt.x - cx) - startAng;
              if (ev.shiftKey) {
                const snapRad = 15 * Math.PI / 180;
                dAng = Math.round(dAng / snapRad) * snapRad;
              }
              if (act && act.kind === 'operad') {
                snapNodes.forEach(sn => { sn.node.t.r = sn.r0 + dAng; });
                SE.invalidate(act.root);
              } else if (act) {
                act.rot = Math.round((lySnap.rot0 + dAng * 180 / Math.PI) * 10) / 10;
              }
              this.ui.modalHud = `Rotate: ${Math.round(dAng * 180 / Math.PI)}° (Shift snaps 15°)`;
            } else if (gMode.startsWith('scale-')) {
              const curDist = Math.max(4, Math.hypot(pt.x - cx, pt.y - cy));
              const ratio = Math.max(0.15, Math.min(6.0, curDist / startDist));
              if (act && act.kind === 'operad') {
                snapNodes.forEach(sn => {
                  if (sn.node.kind === 'atom' && sn.s0 === 1) {
                    sn.node.size = Math.max(8, Math.min(900, +(sn.size0 * ratio).toFixed(2)));
                  } else {
                    sn.node.t.s = Math.max(0.08, Math.min(8, +(sn.s0 * ratio).toFixed(4)));
                  }
                });
                SE.invalidate(act.root);
              } else if (act) {
                act.scale = Math.max(0.15, Math.min(4.0, +(lySnap.scale0 * ratio).toFixed(3)));
              }
              this.ui.modalHud = `Scale: ×${ratio.toFixed(2)}`;
            }
            this.recompute({ skipRender: true });
          };
          const onGizmoUp = () => {
            SE.live.drag = false;
            this.ui.modalHud = '';
            window.removeEventListener('pointermove', onGizmoMove);
            window.removeEventListener('pointerup', onGizmoUp);
            window.removeEventListener('pointercancel', onGizmoUp);
            if (act && act.kind === 'operad' && act.root) SE.invalidate(act.root);
            this.recompute();
          };
          window.addEventListener('pointermove', onGizmoMove);
          window.addEventListener('pointerup', onGizmoUp);
          window.addEventListener('pointercancel', onGizmoUp);
          return;
        }

        // 2. Check if user clicked/touched a Shape Path ([data-unit], [data-leaf], [data-band])
        const shapeEl = e.target.closest('[data-unit], [data-leaf], [data-band]');
        if (shapeEl) {
          e.preventDefault();
          e.stopPropagation();
          const hitLayerIdx = shapeEl.dataset.layer != null ? +shapeEl.dataset.layer : this.doc.activeLayer;
          if (hitLayerIdx !== this.doc.activeLayer && this.doc.layers[hitLayerIdx]) {
            this.doc.activeLayer = hitLayerIdx;
          }
          const act = this.activeLayer();

          if (act && act.kind === 'operad' && act.root) {
            const pickId = (this.ui.toolMode === 'direct' || e.altKey)
              ? (shapeEl.dataset.leaf || shapeEl.dataset.unit)
              : (shapeEl.dataset.unit || shapeEl.dataset.leaf);

            if (pickId) {
              if (e.shiftKey) {
                this.ui.selIds = this.ui.selIds.includes(pickId)
                  ? this.ui.selIds.filter(x => x !== pickId)
                  : this.ui.selIds.concat([pickId]);
                this.ui.inspectedId = pickId;
                this.render();
                return;
              }
              if (!this.ui.selIds.includes(pickId)) {
                this.ui.selIds = [pickId];
                this.ui.inspectedId = pickId;
                this.updateCanvasFast();
              } else {
                this.ui.inspectedId = pickId;
              }
            }

            let dragNodes = this.getTopSelectedNodes();
            if (!dragNodes.length) return;
            let duplicatedOnAlt = false;
            let origPos = dragNodes.map(n => ({ node: n, x0: n.t.x || 0, y0: n.t.y || 0 }));
            let moved = false;

            const onShapeMove = (ev) => {
              if (this._pinchDist0) return;
              const pt = toPlate(ev);
              const dx = pt.x - startPt.x;
              const dy = pt.y - startPt.y;
              if (!moved && Math.hypot(dx, dy) < 2.5) return;
              if (!moved) {
                moved = true;
                this.pushUndo();
                SE.live.drag = true;
                // Alt+Drag duplicates selected units and drags the copy
                if (ev.altKey && !duplicatedOnAlt && this.ui.toolMode !== 'direct') {
                  duplicatedOnAlt = true;
                  const newSel = [];
                  const newNodes = [];
                  for (const n of dragNodes) {
                    const parent = SE.findParent(act.root, n.id);
                    if (!parent) continue;
                    const copy = cloneTreeWithNewIds(n);
                    const ix = parent.children.findIndex(c => c.id === n.id);
                    parent.children.splice(ix + 1, 0, copy);
                    newSel.push(copy.id);
                    newNodes.push(copy);
                  }
                  if (newNodes.length) {
                    this.ui.selIds = newSel;
                    this.ui.inspectedId = newSel[0];
                    dragNodes = newNodes;
                    origPos = dragNodes.map(n => ({ node: n, x0: n.t.x || 0, y0: n.t.y || 0 }));
                  }
                }
              }
              origPos.forEach(it => {
                const loc = this.plateDeltaToLocal(act.root, it.node.id, dx, dy);
                it.node.t.x = Math.round((it.x0 + loc.dx) * 10) / 10;
                it.node.t.y = Math.round((it.y0 + loc.dy) * 10) / 10;
              });
              SE.invalidate(act.root);
              this.recompute({ skipRender: true });
            };
            const onShapeUp = () => {
              SE.live.drag = false;
              window.removeEventListener('pointermove', onShapeMove);
              window.removeEventListener('pointerup', onShapeUp);
              window.removeEventListener('pointercancel', onShapeUp);
              if (moved) {
                SE.invalidate(act.root);
                this.recompute();
              } else {
                this.render();
              }
            };
            window.addEventListener('pointermove', onShapeMove);
            window.addEventListener('pointerup', onShapeUp);
            window.addEventListener('pointercancel', onShapeUp);
            return;
          } else if (act) {
            // Image / Geome Layer selection & drag translation
            this.ui.selIds = ['layer:' + (act.id || this.doc.activeLayer)];
            this.updateCanvasFast();
            this.pushUndo();
            const origDx = act.dx || 0, origDy = act.dy || 0;
            let moved = false;
            const onLyMove = (ev) => {
              if (this._pinchDist0) return;
              const pt = toPlate(ev);
              const dx = pt.x - startPt.x, dy = pt.y - startPt.y;
              if (!moved && Math.hypot(dx, dy) < 2.5) return;
              moved = true;
              act.dx = +(origDx + dx / this.doc.W).toFixed(4);
              act.dy = +(origDy + dy / this.doc.H).toFixed(4);
              this.recompute({ skipRender: true });
            };
            const onLyUp = () => {
              window.removeEventListener('pointermove', onLyMove);
              window.removeEventListener('pointerup', onLyUp);
              window.removeEventListener('pointercancel', onLyUp);
              if (moved) this.recompute();
              else this.render();
            };
            window.addEventListener('pointermove', onLyMove);
            window.addEventListener('pointerup', onLyUp);
            window.addEventListener('pointercancel', onLyUp);
            return;
          }
        }

        // 3. Clicked on Empty Plate Background -> Deselect OR Drag Marquee Box
        e.preventDefault();
        if (!e.shiftKey) {
          this.ui.selIds = [];
          this.ui.inspectedId = null;
        }
        this.ui.marquee = { x0: startPt.x, y0: startPt.y, x1: startPt.x, y1: startPt.y };
        this.updateCanvasFast();

        const onMarqueeMove = (ev) => {
          if (this._pinchDist0) return;
          const pt = toPlate(ev);
          this.ui.marquee.x1 = pt.x;
          this.ui.marquee.y1 = pt.y;
          this.updateCanvasFast();
        };
        const onMarqueeUp = () => {
          window.removeEventListener('pointermove', onMarqueeMove);
          window.removeEventListener('pointerup', onMarqueeUp);
          window.removeEventListener('pointercancel', onMarqueeUp);
          const m = this.ui.marquee;
          this.ui.marquee = null;
          if (m && Math.hypot(m.x1 - m.x0, m.y1 - m.y0) > 6) {
            const rx0 = Math.min(m.x0, m.x1), ry0 = Math.min(m.y0, m.y1);
            const rx1 = Math.max(m.x0, m.x1), ry1 = Math.max(m.y0, m.y1);
            const root = this.getActiveOperadRoot();
            if (root && root.children) {
              SE.setPlate(this.doc.W || 1000, this.doc.H || 1000);
              const hits = [];
              for (const unit of root.children) {
                const bb = SE.bboxOf(SE.evaluate(unit));
                if (bb && bb.x1 >= rx0 && bb.x0 <= rx1 && bb.y1 >= ry0 && bb.y0 <= ry1) {
                  hits.push(unit.id);
                }
              }
              this.ui.selIds = e.shiftKey ? Array.from(new Set(this.ui.selIds.concat(hits))) : hits;
              this.ui.inspectedId = this.ui.selIds[0] || null;
              this.ui.sessionNotice = hits.length ? `Selected ${hits.length} unit(s)` : 'Selection released';
            }
          } else {
            this.ui.sessionNotice = 'Selection released';
          }
          this.render();
        };
        window.addEventListener('pointermove', onMarqueeMove);
        window.addEventListener('pointerup', onMarqueeUp);
        window.addEventListener('pointercancel', onMarqueeUp);
      };
    }

    // K-Space Lab bindings
    if (q('#btn-k-measure-plate')) q('#btn-k-measure-plate').onclick = () => {
      const svgBlob = new Blob([this.composed.svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      this._kMeasured = true;
      this.ui.kStale = false;
      this.ui.kPreset = 'plate';
      this.initKSpace(url).then(() => { URL.revokeObjectURL(url); this.render(); });
    };
    qa('[data-k-preset]').forEach(btn => btn.onclick = () => { this._kMeasured = false; this.ui.kStale = false; this.loadKSpacePreset(btn.dataset.kPreset); });
    if (q('#btn-k-upload')) q('#btn-k-upload').onclick = () => { this._uploadMode = 'kspace'; this._imgInput.click(); };
    qa('[data-k-brush]').forEach(btn => btn.onclick = () => { this.ui.kBrushMode = btn.dataset.kBrush; this.render(); });
    if (q('#k-brush-r')) q('#k-brush-r').oninput = (e) => { this.ui.kBrushR = parseInt(e.target.value, 10); };
    qa('[data-k-flt]').forEach(btn => btn.onclick = () => this.applyKSpaceFilterPreset(btn.dataset.kFlt));
    if (q('#k-quant-lv')) q('#k-quant-lv').oninput = (e) => {
      this.ui.kQuantLevels = parseInt(e.target.value, 10);
      this.drawKSpaceCanvases();
      this.render();
    };
    if (q('#btn-k-export-spec')) q('#btn-k-export-spec').onclick = () => this.exportSpectrumPNG();
    if (q('#btn-k-send-operad')) q('#btn-k-send-operad').onclick = () => this.sendKSpaceReturnToStudio('operad');
    if (q('#btn-k-send')) q('#btn-k-send').onclick = () => this.sendKSpaceReturnToStudio('layer');

    const specCv = q('#k-spec-cv');
    if (specCv) {
      const paintK = (e) => {
        const rect = specCv.getBoundingClientRect();
        const N = this._kN || 256;
        const cx = Math.round((e.clientX - rect.left) * (N / Math.max(1, rect.width)));
        const cy = Math.round((e.clientY - rect.top) * (N / Math.max(1, rect.height)));
        const R = this.ui.kBrushR || 12;
        if (this.ui.kBrushMode === 'keep' && !this._keptCleared) {
          this._kMask.fill(0.0);
          this._keptCleared = true;
        }
        const val = this.ui.kBrushMode === 'erase' ? 0.0 : 1.0;
        const stamp = (px, py) => {
          for (let dy = -R; dy <= R; dy++) {
            for (let dx = -R; dx <= R; dx++) {
              if (dx * dx + dy * dy <= R * R) {
                const x = px + dx, y = py + dy;
                if (x >= 0 && x < N && y >= 0 && y < N) this._kMask[y * N + x] = val;
              }
            }
          }
        };
        stamp(cx, cy);
        stamp(N - 1 - cx, N - 1 - cy);
        this._kMask[(N >> 1) * N + (N >> 1)] = 1.0;
        this.updateKSpaceMetrics();
        this.reconstructKSpace();
      };
      specCv.onpointerdown = (e) => {
        e.preventDefault();
        this._keptCleared = false;
        paintK(e);
        const mv = (ev) => paintK(ev);
        const up = () => {
          window.removeEventListener('pointermove', mv);
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
          this.render();
        };
        window.addEventListener('pointermove', mv);
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
      };
    }

    // Reveal bindings
    if (q('#rev-slider')) q('#rev-slider').oninput = (e) => {
      this.ui.revCursor = parseFloat(e.target.value);
      this.ui.revHoverStep = -1;
      this.drawRevealCanvas();
    };
    qa('[data-rev-step]').forEach(el => {
      el.onmouseenter = () => { this.ui.revHoverStep = +el.dataset.revStep; this.drawRevealCanvas(); };
      el.onmouseleave = () => { this.ui.revHoverStep = -1; this.drawRevealCanvas(); };
      el.onclick = () => {
        const s = +el.dataset.revStep;
        this.ui.revHoverStep = this.ui.revHoverStep === s ? -1 : s;
        this.drawRevealCanvas();
      };
    });

    // Chord & Foundry bindings
    if (q('#chord-mode-sel')) q('#chord-mode-sel').onchange = (e) => { this.doc.glueMode = e.target.value; this.recompute(); };
    if (q('#f-name')) q('#f-name').oninput = (e) => { this.ui.foundry.name = e.target.value; };
    if (q('#f-form')) q('#f-form').onchange = (e) => { this.ui.foundry.form = e.target.value; this.render(); };
    if (q('#f-sides')) q('#f-sides').oninput = (e) => { this.ui.foundry.sides = parseInt(e.target.value, 10); this.render(); };
    if (q('#f-size')) q('#f-size').oninput = (e) => { this.ui.foundry.size = parseFloat(e.target.value); this.render(); };
    if (q('#f-inner')) q('#f-inner').oninput = (e) => { this.ui.foundry.inner = parseFloat(e.target.value); this.render(); };
    if (q('#btn-save-foundry')) q('#btn-save-foundry').onclick = () => {
      const def = Object.assign({}, this.ui.foundry, { key: 'c:' + Date.now().toString(36) });
      this.doc.customKinds = (this.doc.customKinds || []).concat([def]);
      SE.setCustomKinds(this.doc.customKinds);
      this._ckv++;
      this._bandCache = {};
      this.ui.sessionNotice = `Forged piece "${def.name}" added to Studio Vocabulary`;
      this.recompute();
    };
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const root = document.getElementById('studio-root');
  if (root) window.STUDIO_APP = new OrpheumStudioApp(root);
});
</script>
</body>
</html>
