      { key: 'Dₙ', cat: 'Operad Algebra', title: 'Wrap Selection in Dihedral Fold (Dₙ Rotational + Mirror Symmetry)', run: () => this.wrapInOperator('fold') },
      { key: '⇌', cat: 'Operad Algebra', title: 'Wrap Selection in Bilateral Mirror (X / Y / Quad Reflection)', run: () => this.wrapInOperator('mirror') },
      { key: '⊞', cat: 'Operad Algebra', title: 'Wrap Selection in Lattice Grid (2D Bravais Crystal M×N)', run: () => this.wrapInOperator('lattice') },
      { key: '⋈', cat: 'Operad Algebra', title: 'Wrap Selection in Braid Weave (Bₙ Sinusoidal Strand Crossings)', run: () => this.wrapInOperator('braid') },
      { key: 'α', cat: 'Operad Algebra', title: 'Wrap Selection in Veil (Translucent Tint Layer Over Field)', run: () => this.wrapInOperator('veil') },
      { key: '⟡⟡', cat: 'Operad Algebra', title: 'Wrap Selection in Convexity Split (Hertel–Mehlhorn Hollow Cut)', run: () => this.wrapInOperator('convex') },
      { key: '∑|r', cat: 'Operad Algebra', title: 'Wrap Selection in Fourier Split (Primary Body + Detail Veil)', run: () => this.wrapInOperator('fsplit') },
      { key: '▱', cat: 'Operad Algebra', title: 'Wrap Selection in Depth / Relief Extrude (3D Stack)', run: () => this.wrapInOperator('extrude') },
      { key: 'ℱ⁻¹', cat: 'Operad Algebra', title: 'Wrap Selection in k-Space Spectral Return (FFT Filter → Vector)', run: () => this.wrapInOperator('kfilter') },

      // ── 4. True-DPI, Curves, Linead & View ──
      { key: 'B', cat: 'True-DPI & Curves', title: `Toggle Analytic Cubic Bézier Splines (${this.doc.bezierCurves !== false ? 'ON' : 'OFF'})`, run: () => this.toggleBezierCurves() },
      { key: 'P', cat: 'True-DPI & Curves', title: `Toggle 1:1 Native Master vs 2048px Grid`, run: () => this.toggleNativeFidelity() },
      { key: '⇧U', cat: 'True-DPI & Curves', title: 'Re-Sample & Re-Trace Active Image Sources', run: () => this.resampleActiveSources() },
      { key: 'L', cat: 'True-DPI & Curves', title: `Cycle Linead Overlay (Currently: ${this.doc.linead || 'none'})`, run: () => { const modes = ['none', 'gesture', 'web', 'dense']; const idx = (modes.indexOf(this.doc.linead || 'none') + 1) % modes.length; this.doc.linead = modes[idx]; this.recompute(); } },
      { key: 'Tab', cat: 'Workspace & View', title: 'Toggle Zen Full-Canvas Mode (Hide/Show Docks)', run: () => { this.ui.zenMode = !this.ui.zenMode; this.render(); } },
      { key: 'F', cat: 'Workspace & View', title: 'Fit Canvas to Viewport (62%)', run: () => { this.ui.zoom = 0.62; this.render(); } },
      { key: 'M', cat: 'Color & Rank', title: 'Cycle Studio Palette', run: () => this.cyclePalette(1) },
      { key: '⇧M', cat: 'Color & Rank', title: 'Cycle Sheaf Glue Law (Sheaf / OKLab Chord / Multiply / XOR)', run: () => this.cycleGlueMode() },
      { key: '+Op', cat: 'Layers', title: 'Add New Operad Tree Layer', run: () => this.addOperadLayer() },
      { key: '+Im', cat: 'Layers', title: 'Add New Linead Image Trace Layer', run: () => this.addDemoImageLayer() },
      { key: '+Ge', cat: 'Layers', title: 'Add New Seeded Geome / Symbolarium Layer', run: () => this.addGeomeLayer() },
      { key: '⇄Op', cat: 'Layers', title: 'Convert Active Image/Geome Layer → Editable Operad Shapes', run: () => this.convertActiveLayerToOperad() },
      { key: 'J / K', cat: 'Layers', title: 'Select Previous / Next Layer in Stack', run: () => { this.doc.activeLayer = (this.doc.activeLayer + 1) % this.doc.layers.length; this.render(); } },
      { key: 'E', cat: 'Export & I/O', title: 'Export Infinite-Resolution Vector SVG', run: () => this.exportSVG() },
      { key: '⇧E', cat: 'Export & I/O', title: `Stream ${this.doc.dpi} DPI Archival Print PNG`, run: () => this.exportHighDPI() },
      { key: '⌘S', cat: 'Export & I/O', title: 'Save Compact Studio Session (.orpheum-studio.json)', run: () => this.saveSessionJSON() },
      { key: '⌘O', cat: 'Export & I/O', title: 'Open Session File (.orpheum.json, .linead.json, .gz)', run: () => this._sessionInput.click() }
    ];
  }

  setupKeyboard() {
    window.addEventListener('mousemove', (e) => {
      this._mouseX = e.clientX;
      this._mouseY = e.clientY;
      if (this._modal) this.updateModalScrub(e);
    });
    window.addEventListener('mousedown', (e) => {
      if (this._modal) {
        e.preventDefault();
        e.stopPropagation();
        if (e.button === 2) this.cancelModalScrub();
        else this.commitModalScrub();
      }
    }, true);

    window.addEventListener('keydown', (e) => {
      const inInput = /input|textarea|select/i.test(document.activeElement && document.activeElement.tagName || '');
      const isCmdInput = document.activeElement && document.activeElement.id === 'cmd-palette-input';

      // Command Palette navigation when open
      if (this.ui.cmdOpen) {
        const list = this.getFilteredCommands();
        if (e.key === 'Escape') { e.preventDefault(); this.ui.cmdOpen = false; this.render(); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); this.ui.cmdIdx = Math.min(Math.max(0, list.length - 1), this.ui.cmdIdx + 1); this.render(); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); this.ui.cmdIdx = Math.max(0, this.ui.cmdIdx - 1); this.render(); return; }
        if (e.key === 'Enter' && list[this.ui.cmdIdx]) {
          e.preventDefault();
          const item = list[this.ui.cmdIdx];
          this.ui.cmdOpen = false;
          item.run();
          return;
        }
        if (isCmdInput) return;
      }

      // Close help modal on Escape or ?
      if (this.ui.helpOpen && (e.key === 'Escape' || e.key === '?')) {
        e.preventDefault();
        this.ui.helpOpen = false;
        this.render();
        return;
      }

      // Active modal scrub commit / cancel
      if (this._modal) {
        if (e.key === 'Escape') { e.preventDefault(); this.cancelModalScrub(); return; }
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.commitModalScrub(); return; }
        return;
      }

      // Global Cmd+K / Ctrl+K Command Palette
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        this.ui.cmdOpen = !this.ui.cmdOpen;
        this.ui.cmdQuery = '';
        this.ui.cmdIdx = 0;
        this.render();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        this.saveSessionJSON();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'o') {
        e.preventDefault();
        this._sessionInput.click();
        return;
      }

      if (inInput) return;

      // Escape: close open menu OR release/deselect active shape selection
      if (e.key === 'Escape') {
        e.preventDefault();
        if (this.ui.openMenu) { this.ui.openMenu = null; this.render(); return; }
        this.clearSelection();
        return;
      }

      // Undo / Redo (Cmd+Z / Shift+Cmd+Z)
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) this.redo(); else this.undo();
        return;
      }

      // Select All (Cmd+A), Duplicate (Cmd+D), Group (Cmd+G), Ungroup (Shift+Cmd+G), Flatten (Shift+Cmd+F)
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        this.selectAllNodes();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        this.duplicateSelectedNodes();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'g') {
        e.preventDefault();
        if (e.shiftKey) this.ungroupSelection();
        else this.groupSelection();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        this.flattenSelection();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && (e.key === '[' || e.key === ']')) {
        e.preventDefault();
        this.reorderSelection(e.key === ']' ? (e.shiftKey ? 2 : 1) : (e.shiftKey ? -2 : -1));
        return;
      }

      // Delete / Backspace: delete selected shapes
      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        this.deleteSelectedNodes();
        return;
      }

      // Command Palette via '/'
      if (e.key === '/') {
        e.preventDefault();
        this.ui.cmdOpen = true;
        this.ui.cmdQuery = '';
        this.ui.cmdIdx = 0;
        this.render();
        return;
      }

      // Keybinding Cheat-Sheet via '?'
      if (e.key === '?') {
        e.preventDefault();
        this.ui.helpOpen = !this.ui.helpOpen;
        this.render();
        return;
      }

      // Zen Full-Canvas Mode via 'Tab'
      if (e.key === 'Tab') {
        e.preventDefault();
        this.ui.zenMode = !this.ui.zenMode;
        this.ui.sessionNotice = this.ui.zenMode ? 'Zen Canvas Mode (Press Tab to restore docks)' : '';
        this.render();
        return;
      }

      // ── HIGH-FREQUENCY REPEATED TRANSFORMATIONS (Single-Key Tap-to-Repeat) ──
      // 1. Arrow Keys: Nudge selected shapes (1px with Alt, 20px with Shift, 5px default)
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
        e.preventDefault();
        if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
          if (e.key === 'ArrowUp') this.selectParentNode();
          else this.selectChildNodes();
          return;
        }
        const step = e.shiftKey ? 20 : (e.altKey ? 1 : 5);
        const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
        const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
        this.nudgeSelection(dx, dy);
        return;
      }

      // 2. Rotate: , / < (-15° or -45° with Shift) and . / > (+15° or +45° with Shift, or +137.5° with Alt)
      if (e.key === ',' || e.key === '<') {
        e.preventDefault();
        this.rotateSelectionBy(e.altKey ? -137.508 : (e.shiftKey || e.key === '<' ? -45 : -15));
        return;
      }
      if (e.key === '.' || e.key === '>') {
        e.preventDefault();
        this.rotateSelectionBy(e.altKey ? 137.508 : (e.shiftKey || e.key === '>' ? 45 : 15));
        return;
      }

      // 3. Scale: [ / { (Scale down) and ] / } (Scale up)
      if (e.key === '[' || e.key === '{') {
        e.preventDefault();
        this.scaleSelectionBy(e.altKey ? 0.618034 : (e.shiftKey || e.key === '{' ? 0.75 : 0.90));
        return;
      }
      if (e.key === ']' || e.key === '}') {
        e.preventDefault();
        this.scaleSelectionBy(e.altKey ? 1.618034 : (e.shiftKey || e.key === '}' ? 1.25 : 1.10));
        return;
      }

      // 4. Flip / Mirror: H (Horizontal) / Shift+H (Vertical)
      if (e.key.toLowerCase() === 'h' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        this.flipSelection(e.shiftKey ? 'y' : 'x');
        return;
      }

      // 5. Center on Plate (C) & Reset Transform (0)
      if (e.key.toLowerCase() === 'c' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        this.centerSelection();
        return;
      }
      if (e.key === '0' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        if (this.ui.selIds && this.ui.selIds.length) this.resetSelectionTransform();
        else { this.ui.zoom = 1.0; this.render(); }
        return;
      }

      // 6. Number keys 1–8: If shapes are selected, set Tone Rank 1–8! Otherwise 1–4 switches Workspace
      if (!e.metaKey && !e.ctrlKey && !e.altKey && /^[1-8]$/.test(e.key)) {
        const num = parseInt(e.key, 10);
        if (this.ui.selIds && this.ui.selIds.length) {
          e.preventDefault();
          this.setSelectionRank(num - 1);
          return;
        } else if (num <= 4) {
          const wsMap = { 1: 'compose', 2: 'kspace', 3: 'reveal', 4: 'chords' };
          this.ui.workspace = wsMap[num];
          this.render();
          return;
        }
      }

      // 7. Tool Mode & Shape Primitives: V (Unit Select), A (Direct Leaf Select), O (Circle), U (Square), T (Triangle)
      if (e.key.toLowerCase() === 'v' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        if (e.shiftKey) {
          const act = this.activeLayer();
          if (act) { act.visible = act.visible === false ? true : false; this.recompute(); }
        } else {
          this.ui.toolMode = 'select';
          this.ui.sessionNotice = 'Tool: Select & Transform Unit (V)';
          this.render();
        }
        return;
      }
      if (e.key.toLowerCase() === 'a' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        this.ui.toolMode = 'direct';
        this.ui.sessionNotice = 'Tool: Direct Leaf Atom Select (A)';
        this.render();
        return;
      }
      if (e.key.toLowerCase() === 'o' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        if (e.shiftKey) this.startModalScrub('O');
        else this.addPrimitiveAtom('circle');
        return;
      }
      if (e.key.toLowerCase() === 'u' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        if (e.shiftKey) this.resampleActiveSources();
        else this.addPrimitiveAtom('square');
        return;
      }
      if (e.key.toLowerCase() === 't' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        this.addPrimitiveAtom('triangle');
        return;
      }

      // Zoom: F (fit), - / =
      if (e.key.toLowerCase() === 'f' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); this.ui.zoom = 0.62; this.render(); return; }
      if (e.key === '-' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); this.ui.zoom = Math.max(0.2, +(this.ui.zoom - 0.1).toFixed(2)); this.render(); return; }
      if ((e.key === '=' || e.key === '+') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); this.ui.zoom = Math.min(2.5, +(this.ui.zoom + 0.1).toFixed(2)); this.render(); return; }

      // Curve Engine & Fidelity: B (Cubic Bézier vs Poly), P (1:1 Native), L (Cycle Linead)
      if (e.key.toLowerCase() === 'b' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        if (e.shiftKey) this.startModalScrub('B');
        else this.toggleBezierCurves();
        return;
      }
      if (e.key.toLowerCase() === 'p' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); this.toggleNativeFidelity(); return; }
      if (e.key.toLowerCase() === 'l' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        const modes = ['none', 'gesture', 'web', 'dense'];
        const idx = (modes.indexOf(this.doc.linead || 'none') + 1) % modes.length;
        this.doc.linead = modes[idx];
        this.ui.sessionNotice = `Linead Overlay: ${this.doc.linead}`;
        this.recompute();
        return;
      }

      // Palette & Glue: M / Shift+M
      if (e.key.toLowerCase() === 'm' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        if (e.shiftKey) this.cycleGlueMode();
        else this.cyclePalette(1);
        return;
      }

      // Layer navigation: J/K (select layer)
      if (e.key.toLowerCase() === 'j' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        this.doc.activeLayer = Math.max(0, this.doc.activeLayer - 1);
        this.render();
        return;
      }
      if (e.key.toLowerCase() === 'k' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        this.doc.activeLayer = Math.min(this.doc.layers.length - 1, this.doc.activeLayer + 1);
        this.render();
        return;
      }

      // Export: E (SVG) / Shift+E (High-DPI PNG)
      if (e.key.toLowerCase() === 'e' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        if (e.shiftKey) this.exportHighDPI();
        else this.exportSVG();
        return;
      }

      // Modal Scrubbers: G, S, R
      const kUp = e.key.toUpperCase();
      if (!e.metaKey && !e.ctrlKey && !e.altKey && ['G', 'S', 'R'].includes(kUp)) {
        e.preventDefault();
        this.startModalScrub(kUp);
        return;
      }
    });
  }

  getFilteredCommands() {
    const q = (this.ui.cmdQuery || '').trim().toLowerCase();
    const all = this.getCommandList();
    if (!q) return all;
    return all.filter(c => c.title.toLowerCase().includes(q) || c.cat.toLowerCase().includes(q) || c.key.toLowerCase().includes(q));
  }

  renderCommandPalette() {
    if (!this.ui.cmdOpen) return '';
    const list = this.getFilteredCommands();
    return `
      <div id="cmd-backdrop" style="position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(5px);z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding-top:85px;">
        <div style="width:580px;max-width:92vw;background:#141418;border:1px solid var(--gold);border-radius:10px;box-shadow:0 25px 70px rgba(0,0,0,0.85);overflow:hidden;" onclick="event.stopPropagation()">
          <div style="padding:12px 14px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:10px;">
            <span style="color:var(--gold);font-weight:700;font-size:13px;">⌘K</span>
            <input id="cmd-palette-input" type="text" value="${this.ui.cmdQuery}" placeholder="Type a command, operator, or shortcut (e.g. bezier, native, fold, harmonics, export)…" style="flex:1;border:none;background:transparent;font-size:13px;color:var(--text-main);outline:none;"/>
            <span style="font-size:9.5px;color:var(--text-muted);padding:2px 6px;border-radius:4px;background:#0a0a0c;">Esc to close</span>
          </div>
          <div style="max-height:360px;overflow-y:auto;padding:6px;">
            ${list.length ? list.map((c, i) => `
              <div data-cmd-idx="${i}" style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;cursor:pointer;background:${i === this.ui.cmdIdx ? 'var(--gold-dim)' : 'transparent'};border:1px solid ${i === this.ui.cmdIdx ? 'rgba(212,168,75,0.45)' : 'transparent'};">
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:9px;padding:2px 6px;border-radius:4px;background:#0a0a0c;color:var(--text-muted);min-width:95px;text-align:center;">${c.cat}</span>
                  <span style="color:${i === this.ui.cmdIdx ? 'var(--gold)' : 'var(--text-main)'};font-weight:${i === this.ui.cmdIdx ? '600' : '400'};">${c.title}</span>
                </div>
                <kbd style="font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:4px;background:#0a0a0c;color:var(--gold);border:1px solid var(--border-strong);">${c.key}</kbd>
              </div>
            `).join('') : `<div style="padding:18px;text-align:center;color:var(--text-muted);">No matching commands</div>`}
          </div>
        </div>
      </div>
    `;
  }

    const groups = [

        ['← → ↑ ↓', 'Nudge 5px (Shift = 20px, Alt = 1px fine)'],
        [', / .', 'Rotate −15° / +15° (Shift = ±45°, Alt+. = +137.5° φ)'],

      ]],
      ['Workspace, Curves & Archival I/O', [

        ['M / ⇧M', 'Cycle Studio Palette / Cycle Sheaf Glue Law'],
        ['Tab / F', 'Toggle Zen Full-Canvas Mode / Fit Canvas to Viewport'],

        ['⌘S / ⌘O / ⌘Z', 'Save .json / Open Session / Undo & Redo']

    return `
      <div id="help-backdrop" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:9999;display:flex;align-items:center;justify-content:center;">
        <div style="width:820px;max-width:95vw;background:#141418;border:1px solid var(--gold);border-radius:10px;padding:18px 20px;box-shadow:0 25px 70px rgba(0,0,0,0.9);" onclick="event.stopPropagation()">
          <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);padding-bottom:10px;margin-bottom:14px;">

              <span style="font-family:var(--font-serif);font-size:16px;font-weight:700;color:var(--gold);">Orpheum Studio Pro — Direct Manipulation & Keyboard Map</span>

            </div>
            <button id="btn-close-help" class="btn">✕ Close (Esc)</button>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

  runMenuAction(id) {
    this.ui.openMenu = null;
    if (id && id.startsWith('wrap-')) {
      this.wrapInOperator(id.slice(5));
      return;
    }
    switch (id) {
      case 'new-doc': this.pushUndo(); this.doc = SE.createDefaultStudioDocument(); this.ui.selIds = []; this.recompute(); break;
      case 'open-session': this._sessionInput.click(); break;
      case 'ingest-img': this._imgInput.click(); break;
      case 'save-json': this.saveSessionJSON(); break;
      case 'save-gz': this.saveSessionGZ(); break;
      case 'exp-svg': this.exportSVG(); break;
      case 'exp-png': this.exportHighDPI(); break;
      case 'undo': this.undo(); break;
      case 'redo': this.redo(); break;
      case 'dup-sel': this.duplicateSelectedNodes(); break;
      case 'del-sel': this.deleteSelectedNodes(); break;
      case 'add-circle': this.addPrimitiveAtom('circle'); break;
      case 'add-square': this.addPrimitiveAtom('square'); break;
      case 'add-triangle': this.addPrimitiveAtom('triangle'); break;
      case 'sel-all': this.selectAllNodes(); break;
      case 'sel-clear': this.clearSelection(); break;
      case 'tool-select': this.ui.toolMode = 'select'; this.render(); break;
      case 'tool-direct': this.ui.toolMode = 'direct'; this.render(); break;
      case 'sel-parent': this.selectParentNode(); break;
      case 'sel-children': this.selectChildNodes(); break;
      case 'rot-ccw-15': this.rotateSelectionBy(-15); break;
      case 'rot-cw-15': this.rotateSelectionBy(15); break;
      case 'rot-ccw-45': this.rotateSelectionBy(-45); break;
      case 'rot-cw-45': this.rotateSelectionBy(45); break;
      case 'rot-phi': this.rotateSelectionBy(137.508); break;
      case 'scl-down': this.scaleSelectionBy(0.9); break;
      case 'scl-up': this.scaleSelectionBy(1.1); break;
      case 'scl-phi-down': this.scaleSelectionBy(0.618034); break;
      case 'scl-phi-up': this.scaleSelectionBy(1.618034); break;
      case 'flip-x': this.flipSelection('x'); break;
      case 'flip-y': this.flipSelection('y'); break;
      case 'center-sel': this.centerSelection(); break;
      case 'reset-xform': this.resetSelectionTransform(); break;
      case 'modal-g': this.startModalScrub('G'); break;
      case 'modal-r': this.startModalScrub('R'); break;
      case 'modal-s': this.startModalScrub('S'); break;
      case 'group-sel': this.groupSelection(); break;
      case 'ungroup-sel': this.ungroupSelection(); break;
      case 'flatten-sel': this.flattenSelection(); break;
      case 'ly-add-op': this.addOperadLayer(); break;
      case 'ly-add-im': this.addDemoImageLayer(); break;
      case 'ly-add-ge': this.addGeomeLayer(); break;
      case 'ly-to-op': this.convertActiveLayerToOperad(); break;
      case 'ly-dup': this.duplicateLayer(this.doc.activeLayer); break;
      case 'z-front': this.reorderSelection(2); break;
      case 'z-fwd': this.reorderSelection(1); break;
      case 'z-bwd': this.reorderSelection(-1); break;
      case 'z-back': this.reorderSelection(-2); break;
      case 'ws-compose': this.ui.workspace = 'compose'; this.render(); break;
      case 'ws-kspace': this.ui.workspace = 'kspace'; this.render(); break;
      case 'ws-reveal': this.ui.workspace = 'reveal'; this.render(); break;
      case 'ws-chords': this.ui.workspace = 'chords'; this.render(); break;
      case 'toggle-bezier': this.toggleBezierCurves(); break;
      case 'toggle-native': this.toggleNativeFidelity(); break;
      case 'cycle-linead': {
        const modes = ['none', 'gesture', 'web', 'dense'];
        this.doc.linead = modes[(modes.indexOf(this.doc.linead || 'none') + 1) % modes.length];
        this.recompute();
        break;
      }
      case 'toggle-zen': this.ui.zenMode = !this.ui.zenMode; this.render(); break;
      case 'zoom-fit': this.fitZoomToViewport(); this.render(); break;
      case 'zoom-100': this.ui.zoom = 1.0; this.render(); break;
      case 'open-cmd': this.ui.cmdOpen = true; this.ui.cmdQuery = ''; this.ui.cmdIdx = 0; this.render(); break;
      case 'open-help': this.ui.helpOpen = true; this.render(); break;
    }
  }

  // ── Dedicated Streamlined Mobile Studio UI ─────────────────────────────────
  renderMobileStudio(d, u, act, pal, stats, pw, ph, MP) {
    const svgScaledW = Math.round(d.W * u.zoom);
    const svgScaledH = Math.round(d.H * u.zoom);
    const selNodes = (act && act.kind === 'operad') ? this.getTopSelectedNodes() : [];
    const hasSel = selNodes.length > 0 || (u.selIds || []).some(id => String(id).startsWith('layer:'));
    const selLabel = selNodes.length > 1
      ? `${selNodes.length} Shapes`

            : ({ circle: '●', square: '◼', triangle: '▲', poly: '⬡' }[node.shape] || '●');
          const col = node.kind === 'atom' ? pal.ramp[((node.rank || 0) % m + m) % m] : 'var(--gold)';
          const name = node.label || (node.kind === 'op' ? (SE.OPS[node.op] && SE.OPS[node.op].name || node.op) : node.shape);
          return `
            <div data-tree-node="${node.id}" style="display:flex;align-items:center;gap:5px;padding:4px 6px;padding-left:${6 + depth * 12}px;border-radius:4px;cursor:pointer;background:${isSel ? 'var(--gold-dim)' : 'transparent'};border:1px solid ${isSel ? 'var(--gold)' : 'transparent'};">
              ${hasChildren ? `<button data-tree-fold="${node.id}" style="border:none;background:transparent;color:var(--text-muted);cursor:pointer;padding:0 2px;font-size:9px;" title="Fold / Expand subtree">${collapsed ? '▸' : '▾'}</button>` : `<span style="width:12px;"></span>`}

  }

  renderBandsAndSubunitsPanel(act, pal) {
    if (!act) return '';
    const bands = SE.bandsForStudioLayer(act, this.doc.lumas, this._bandCache, this._ckv, this.doc.subpixelTrace !== false, this.doc.bezierCurves !== false);

          const cut = !!(act.bandsCut && act.bandsCut[b.rank]);
          const pin = act.bandColors && act.bandColors[b.rank] != null;
          const col = pin ? lpal.ramp[((act.bandColors[b.rank] % m) + m) % m] : SE.rampColor(lpal, b.rank, act.levels, act.palRoll || 0);
          return `
            <button data-band-chip="${b.rank}" class="btn" style="border-radius:999px;padding:4px 9px;background:${off ? 'transparent' : (cut ? 'var(--gold-dim)' : '#1a1a1f')};color:${off ? '#5a574f' : (cut ? 'var(--gold)' : 'var(--text-main)')};text-decoration:${off ? 'line-through' : 'none'};box-shadow:${(off || cut) ? 'none' : `inset 0 0 0 2px ${col}`};">
              P${b.rank + 1}${cut ? ' ⊘' : ''}${pin ? ' ✦' : ''} <span style="color:var(--text-muted);font-size:9px;">(${b.loops})</span>

          ${Array.from({ length: act.rings || 5 }, (_, i) => {

              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
    `;
  }

  renderKSpaceStage(d, u, pal) {

      polyPts = bins.map((b, i) => {
        const x = 30 + (i / (bins.length - 1)) * 240;
        const y = 175 - ((b.lp - minY) / (maxY - minY)) * 140;
        return `${x.toFixed(1)},${y.toFixed(1)}`;

          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">

          </div>

          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="lbl">Brush</span>
            ${[['erase', 'Erase k'], ['restore', 'Restore k'], ['keep', 'Solo k']].map(([m, lbl]) => `
              <button data-k-brush="${m}" class="btn ${u.kBrushMode === m ? 'btn-gold' : ''}">${lbl}</button>

            <button id="btn-k-send" class="btn-gold">➔ Return → Layer</button>
          </div>
        </div>

        <div class="kspace-grid">
          <div style="background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;">

              <span style="font-size:10px;color:var(--gold);font-weight:700;">II · k-SPACE log(1+|F(kₓ,kᵧ)|)</span>

  renderRevealStage(d, u, pal) {
    const steps = this.composed.steps || [];
    const total = Math.max(1, steps.length);
    const curCount = u.revHoverStep >= 0 ? (u.revHoverStep + 1) : Math.max(1, Math.round(u.revCursor * total));
    return `
      <main style="flex:1;background:#0c0c0e;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;align-items:center;gap:12px;background:var(--bg-panel);padding:10px 14px;border-radius:8px;border:1px solid var(--border-subtle);flex-wrap:wrap;">
          <span style="color:var(--gold);font-weight:700;">PAINT-ORDER REVEAL & BLACK-CRUSH DIAGNOSTICS</span>
          <input id="rev-slider" type="range" min="0" max="1" step="0.005" value="${u.revCursor}" style="flex:1;min-width:140px;"/>
          <span class="val" style="min-width:85px;">Step ${curCount} / ${total}</span>
        </div>

        <div class="reveal-grid">
          <div style="background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:8px;padding:16px;display:flex;align-items:center;justify-content:center;">
            <canvas id="reveal-cv" width="600" height="600" style="max-width:100%;max-height:70vh;box-shadow:0 15px 45px rgba(0,0,0,0.8);border:1px solid var(--border-strong);"></canvas>
          </div>

          <div style="background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;">
            <div style="font-size:10px;color:var(--gold);font-weight:700;">PAINT SEQUENCE (${steps.length} OPERATIONS)</div>
            <div style="font-size:9.5px;color:var(--text-muted);line-height:1.4;">
              Because Orpheum & Linead use 100% opaque palette-closed plates (no alpha multiplication), Black-Crush is strictly 0.0% across all overlap depths. Hover/Tap any step to inspect:
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;max-height:480px;overflow-y:auto;">
              ${steps.map((st, idx) => `
                <div data-rev-step="${idx}" style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;background:${idx < curCount ? 'var(--bg-elev)' : '#0d0d0f'};border:1px solid ${idx === curCount - 1 ? 'var(--gold)' : 'var(--border-subtle)'};">
                  <span style="font-size:9px;color:var(--text-muted);width:24px;">#${idx + 1}</span>
                  <span style="width:12px;height:12px;border-radius:3px;background:${st.fill || pal.ink};border:1px solid rgba(255,255,255,0.25);"></span>
                  <span style="flex:1;font-size:10px;color:var(--text-main);">${st.label}</span>
                  <span style="font-size:9px;color:var(--gold);text-transform:uppercase;">${st.phase}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </main>
    `;
  }

  drawRevealCanvas() {
    requestAnimationFrame(() => {
      const cv = document.getElementById('reveal-cv');
      if (!cv) return;
      const steps = this.composed.steps || [];
      const total = Math.max(1, steps.length);
      const curCount = this.ui.revHoverStep >= 0 ? (this.ui.revHoverStep + 1) : Math.max(1, Math.round(this.ui.revCursor * total));
      const pal = this.resolvePalette();
      const ctx = cv.getContext('2d');
      const s = 600 / Math.max(this.doc.W, this.doc.H);
      cv.width = Math.round(this.doc.W * s);
      cv.height = Math.round(this.doc.H * s);
      ctx.save();
      ctx.scale(s, s);
      ctx.fillStyle = pal.ground;
      ctx.fillRect(0, 0, this.doc.W, this.doc.H);
      for (let i = 0; i < Math.min(curCount, steps.length); i++) {
        const st = steps[i];
        const p2d = new Path2D(st.d);
        if (st.fill && st.fill !== 'none') {
          ctx.fillStyle = st.fill;
          ctx.fill(p2d, st.rule || 'evenodd');
        }
        if (st.stroke && st.stroke !== 'none') {
          ctx.strokeStyle = st.stroke;
          ctx.lineWidth = st.strokeWidth || 1.5;
          ctx.stroke(p2d);
        }
      }
      ctx.restore();
    });
  }

  renderChordsStage(d, u, pal) {
    const m = pal.ramp.length;
    const f = u.foundry;

            </div>

    `;
  }
