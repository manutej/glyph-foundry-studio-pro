<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0a0b"/>
<title>Orpheum Studio Pro — Unified Mathematical Art & Archival Print Environment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="geome-wada.js"></script>
<style>
  :root {
    --bg-app: #0a0a0b;
    --bg-panel: #121214;
    --bg-elev: #18181c;
    --bg-card: #1f1f24;
    --border-subtle: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --gold: #d4a84b;
    --gold-dim: rgba(212,168,75,0.16);
    --coral: #e87258;
    --teal: #58b8a8;
    --text-main: #edeae3;
    --text-muted: #908e87;
    --text-dim: #5e5c56;
    --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-serif: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    background: var(--bg-app); color: var(--text-main);
    font-family: var(--font-mono); font-size: 11px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #studio-root {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0d0d0f; }
  ::-webkit-scrollbar-thumb { background: #2c2c34; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #42424d; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 4px; background: #292930; border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--gold); cursor: pointer; border: 1.5px solid #0a0a0b;
  }
  select, input[type="text"], input[type="number"] {
    background: var(--bg-elev); color: var(--text-main);
    border: 1px solid var(--border-strong); border-radius: 5px;
    padding: 4px 7px; font-family: var(--font-mono); font-size: 10.5px; outline: none;
  }
  select:focus, input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--gold);
  }
  button {
    font-family: var(--font-mono); font-size: 10.5px;
    border-radius: 5px; cursor: pointer; transition: all 0.12s ease;
    touch-action: manipulation;
  }
  .btn {
    background: var(--bg-elev); color: var(--text-main);
    border: 1px solid var(--border-strong); padding: 5px 9px;
  }
  .btn:hover { border-color: rgba(255,255,255,0.32); background: #222228; }
  .btn-gold {
    background: var(--gold-dim); color: var(--gold);
    border: 1px solid var(--gold); padding: 5px 10px; font-weight: 700;
  }
  .btn-gold:hover { background: rgba(212,168,75,0.28); }
  .sec-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: #151518;
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--gold); cursor: pointer;
    user-select: none;
  }
  .sec-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lbl { color: var(--text-muted); font-size: 10px; white-space: nowrap; }
  .val { color: var(--gold); font-size: 10px; min-width: 34px; text-align: right; }
  .pasteboard-grid {
    background-color: #09090b;
    background-image:
      radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
  }
  .menubar-item {
    position: relative;
    padding: 4px 9px;
    border-radius: 4px;
    color: var(--text-main);
    font-size: 10.5px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .menubar-item:hover, .menubar-item.active {
    background: rgba(212,168,75,0.16);
    color: var(--gold);
  }
  .menu-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 248px;
    max-height: 75dvh;
    overflow-y: auto;
    background: #141418;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.85);
    padding: 5px;
    z-index: 9000;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .menu-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 6px 10px;
    border-radius: 5px;
    color: var(--text-main);
    font-size: 10.5px;
    cursor: pointer;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
  }
  .menu-row:hover {
    background: var(--gold-dim);
    color: var(--gold);
  }
  .menu-row kbd {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--text-muted);
    background: #0b0b0e;
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--border-subtle);
  }
  .menu-sep {
    height: 1px;
    background: var(--border-subtle);
    margin: 4px 6px;
  }
  .tool-rail {
    width: 42px;
    background: #101013;
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 4px;
    gap: 5px;
    flex-shrink: 0;
    z-index: 20;
  }
  .tool-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
    position: relative;
  }
  .tool-btn:hover {
    background: var(--bg-elev);
    color: var(--text-main);
    border-color: var(--border-subtle);
  }
  .tool-btn.active {
    background: var(--gold-dim);
    color: var(--gold);
    border-color: var(--gold);
  }
  .gizmo-handle {
    cursor: nwse-resize;
    transition: transform 0.08s ease;
  }
  .gizmo-rot-handle {
    cursor: grab;
  }
  .studio-dock-left {
    width: 330px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .studio-dock-right {
    width: 360px;
    background: var(--bg-panel);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .mobile-sheet-header {
    display: none;
  }
  .mobile-bottom-nav {
    display: none;
  }
  .mobile-sheet-backdrop {
    display: none;
  }
  .kspace-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    flex: 1;
    min-height: 320px;
  }
  .reveal-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .chords-grid {
    flex: 1;
    background: #0c0c0e;
    padding: 18px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* Touch & Coarse Pointer Ergonomics */
  @media (pointer: coarse) {
    input[type="range"] { height: 6px; }
    input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; }
    .btn, .btn-gold { min-height: 32px; padding: 6px 10px; }
    .sec-hdr { padding: 11px 14px; font-size: 11px; }
  }

  /* Responsive Mobile & Tablet Portrait Layout (<= 960px) */
  @media (max-width: 960px) {
    .studio-header {
      height: auto !important;
      min-height: 46px;
      padding: calc(4px + env(safe-area-inset-top, 0px)) 8px 4px 8px !important;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      gap: 6px !important;
    }
    .studio-header::-webkit-scrollbar { display: none; }
    .desktop-menubar { display: none !important; }
    .hide-mobile { display: none !important; }
    .studio-footer { display: none !important; }

    .studio-dock-left,
    .studio-dock-right {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(52px + env(safe-area-inset-bottom, 0px));
      width: 100% !important;
      max-height: 74dvh;
      border-right: none;
      border-left: none;
      border-top: 1px solid var(--gold);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -18px 50px rgba(0,0,0,0.9);
      z-index: 500;
      -webkit-overflow-scrolling: touch;
    }
    .studio-dock-left.mobile-open,
    .studio-dock-right.mobile-open {
      display: flex !important;
    }
    .mobile-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #18181d;
      border-bottom: 1px solid var(--border-strong);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .mobile-sheet-backdrop.active {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 490;
    }
    #compose-viewport {
      padding: 14px 12px 76px 50px !important;
    }
    .tool-rail {
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: rgba(16,16,19,0.92);
      backdrop-filter: blur(8px);
      padding: 6px 3px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }
    .quick-transform-bar {
      bottom: calc(60px + env(safe-area-inset-bottom, 0px)) !important;
      max-width: calc(100vw - 16px);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
      padding: 5px 8px !important;
    }
    .quick-transform-bar::-webkit-scrollbar { display: none; }
    .mobile-bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: calc(52px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #111115;
      border-top: 1px solid var(--border-strong);
      flex-shrink: 0;
      z-index: 600;
    }
    .mobile-nav-btn {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 9.5px;
      border-radius: 0;
    }
    .mobile-nav-btn.active {
      color: var(--gold);
      background: rgba(212,168,75,0.1);
      font-weight: 700;
    }
    .kspace-grid {
      grid-template-columns: 1fr 1fr;
    }
    .reveal-grid, .chords-grid {
      grid-template-columns: 1fr;
    }
  }
  @media (max-width: 560px) {
    .kspace-grid {
      grid-template-columns: 1fr;
    }
  }

  /* ── DEDICATED STREAMLINED MOBILE STUDIO MODE (.mob-*) ── */
  .mob-shell {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100dvh;
    background: #0a0a0d;
    color: var(--text-main);
    overflow: hidden;
  }
  .mob-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 48px;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px 10px;
    background: #121216;
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
    gap: 6px;
  }
  .mob-pill-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 7px 11px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: #1b1b21;
    color: var(--text-main);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .mob-pill-btn.gold {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--gold);
  }
  .mob-pill-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #0b0b0d;
    font-weight: 700;
  }
  .mob-stage-wrap {
    flex: 1;
    min-height: 170px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #18181e 0%, #09090b 100%);
    overflow: hidden;
  }
  .mob-sel-strip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    background: #141419;
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
  }
  .mob-sel-strip::-webkit-scrollbar { display: none; }
  .mob-tray {
    height: 43dvh;
    min-height: 235px;
    max-height: 390px;
    background: #141418;
    border-top: 1.5px solid var(--gold);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    box-shadow: 0 -14px 36px rgba(0,0,0,0.8);
    z-index: 40;
  }
  .mob-tray-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #19191f;
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
    gap: 8px;
  }
  .mob-tray-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px 12px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .mob-seg-bar {
    display: flex;
    background: #0d0d10;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    gap: 3px;
  }
  .mob-seg-btn {
    flex: 1;
    padding: 6px 8px;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  .mob-seg-btn.active {
    background: var(--gold-dim);
    color: var(--gold);
    border: 1px solid rgba(212,168,75,0.45);
  }
  .mob-card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
  }
  @media (min-width: 600px) {
    .mob-card-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }
  .mob-card {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 10px;
    border-radius: 9px;
    background: #1d1d24;
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    text-align: left;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .mob-card:active, .mob-card.active {
    border-color: var(--gold);
    background: rgba(212,168,75,0.14);
  }
  .mob-card-icon {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: #111115;
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--gold);
    flex-shrink: 0;
  }
  .mob-tabbar {
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: calc(56px + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: #101014;
    border-top: 1px solid var(--border-strong);
    flex-shrink: 0;
    z-index: 60;
  }
  .mob-tab {
    flex: 1;
    height: 100%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
  }
  .mob-tab.active {
    color: var(--gold);
    background: rgba(212,168,75,0.11);
    font-weight: 700;
  }
  .mob-slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1b1b22;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
  }
  .mob-slider-row .lbl {
    min-width: 78px;
    font-size: 11px;
    color: var(--text-main);
    font-weight: 600;
  }
  .mob-slider-row input[type="range"] {
    flex: 1;
    height: 6px;
  }
  .mob-slider-row .val {
    min-width: 44px;
    font-size: 11px;
  }
</style>
</head>
<body>
<div id="studio-root"></div>

<script type="module">
import * as SE from './studio-engine.js';

function hexToRgb255(h) {
  const s = String(h || '#000000').replace('#', '');
  const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function cloneTreeWithNewIds(node) {
  const copy = JSON.parse(JSON.stringify(node, (k, v) => k[0] === '_' ? undefined : v));
  SE.walk(copy, n => { if (n.id !== 'root') n.id = SE.uid(); });
  return copy;
}

class OrpheumStudioApp {
  constructor(rootEl) {
    this.rootEl = rootEl;
    this.doc = SE.createDefaultStudioDocument();
    this.history = [];
    this.future = [];
    this._bandCache = {};
    this._ckv = 0;

    const startMobile = (window.innerWidth <= 960) || window.location.search.includes('mobile') || !!window.FORCE_MOBILE_STUDIO;
    this.ui = {
      workspace: 'compose', // 'compose' | 'kspace' | 'reveal' | 'chords'
      toolMode: 'select',   // 'select' (Unit V) | 'leaf' (Direct Atom A)
      openMenu: null,       // 'file' | 'edit' | 'select' | 'transform' | 'algebra' | 'layer' | 'view' | 'help'
      mobileMode: startMobile, // Dedicated streamlined Mobile Studio UI
      mobTab: 'canvas',     // 'canvas' | 'create' | 'transform' | 'patterns' | 'colors' | 'export'
      mobCreateSub: 'shapes', // 'shapes' | 'presets' | 'layers'
      mobColorSub: 'tone',    // 'tone' | 'palettes' | 'gluing'
      mobGuideOpen: false,  // Step-by-step Mobile Quick Guide modal
      mobileSheet: null,    // null | 'left' | 'right' (slide-up bottom drawer on mobile/tablet)
      marquee: null,        // { x0, y0, x1, y1 } during marquee drag
      zoom: 0.62,
      zenMode: false,
      hideLeft: false,
      hideRight: false,
      cmdOpen: false,
      cmdQuery: '',
      cmdIdx: 0,
      helpOpen: false,
      modalHud: '',
      selIds: [],
      inspectedId: null,
      leftSec: { layers: true, tree: true, vault: true },
      rightSec: { inspector: true, glue: true, palette: true, print: false },
      wadaQ: '',
      wadaSize: 'all',
      exportStatus: '',
      sessionNotice: '',
      // K-Space Lab state
      kPreset: 'drawing',
      kBrushMode: 'erase',
      kBrushR: 12,
      kQuantLevels: 5,
      kBeta: 2.1,
      kFracD: 2.45,
      kActivePct: '100%',
      kRadBins: [],
      // Reveal & Diagnostics state
      revCursor: 1.0,
      revHoverStep: -1,
      // Foundry state
      foundry: {
        key: 'c:star5',
        name: 'Forged Pentagram',
        form: 'star',
        sides: 5,
        size: 1.0,
        inner: 0.42,
        aspect: 0.55,
        rot: 0,
        span: 2.0
      }
    };
    this._mouseX = window.innerWidth / 2;
    this._mouseY = window.innerHeight / 2;
    this._modal = null;

    this.composed = { svg: '', commands: [], steps: [], stats: {} };
    this.init();
  }

  fitZoomToViewport() {
    const vw = window.innerWidth || 1280;
    const vh = window.innerHeight || 800;
    const isMob = !!(this.ui && this.ui.mobileMode) || vw <= 960;
    const trayOpen = isMob && this.ui && this.ui.mobTab && this.ui.mobTab !== 'canvas';
    const availW = isMob ? Math.max(200, vw - 28) : Math.max(320, vw - (this.ui.zenMode ? 90 : 780));
    const availH = isMob
      ? Math.max(165, trayOpen ? (vh * 0.44 - 65) : (vh - 175))
      : Math.max(320, vh - 150);
    const W = (this.doc && this.doc.W) || 1000;
    const H = (this.doc && this.doc.H) || 1000;
    const z = Math.min(availW / W, availH / H);
    this.ui.zoom = Math.max(0.16, Math.min(1.2, +(z * 0.94).toFixed(2)));
  }

  async init() {
    this.fitZoomToViewport();
    window.addEventListener('resize', () => {
      if (window.innerWidth > 960 && this.ui.mobileSheet) {
        this.ui.mobileSheet = null;
        this.render();
      }
    });
    // Seed default demo drawing into doc.sources and doc.lumas at configured lumaRes
    const demoURL = SE.demoDrawing();
    const demoLuma = await SE.loadImageLuma(demoURL, this.doc.lumaRes || 2048, { trimMargin: false });
    this.doc.sources = [{
      name: 'Studio Demo Drawing',
      href: demoURL,
      rawHref: demoURL,
      w: demoLuma.w,
      h: demoLuma.h,
      naturalW: demoLuma.naturalW || demoLuma.w,
      naturalH: demoLuma.naturalH || demoLuma.h,
      activePixelRatio: 1
    }];
    this.doc.lumas = [demoLuma];

    // Check IndexedDB for autosaved v4 studio session
    const savedStr = await SE.idbRead('studioPro.autosave');
    if (savedStr) {
      try {
        const restored = await SE.deserializeStudioDocument(savedStr);
        if (restored && Array.isArray(restored.layers) && restored.layers.length) {
          this.doc = restored;
          // Ensure old default 'web' linead mode is turned off on load
          if (this.doc.linead === 'web' && !this.doc._userSetLinead) {
            this.doc.linead = 'none';
          }
          if (!this.doc.sources.length) {
            this.doc.sources = [{
              name: 'Studio Demo Drawing',
              href: demoURL,
              rawHref: demoURL,
              w: demoLuma.w,
              h: demoLuma.h,
              naturalW: demoLuma.naturalW || demoLuma.w,
              naturalH: demoLuma.naturalH || demoLuma.h,
              activePixelRatio: 1
            }];
            this.doc.lumas = [demoLuma];
          }
        }
      } catch (e) {}
    }

    const firstOp = this.doc.layers.find(l => l.kind === 'operad');
    if (firstOp && firstOp.root && firstOp.root.children && firstOp.root.children[0]) {
      this.ui.selIds = [];
      this.ui.inspectedId = firstOp.root.children[0].id;
    }

    this.fitZoomToViewport();
    this.setupFileInputs();
    this.setupKeyboard();
    this.recompute();
    this.initKSpace(demoURL);
  }

  setupFileInputs() {
    this._sessionInput = document.createElement('input');
    this._sessionInput.type = 'file';
    this._sessionInput.accept = '.json,.gz,application/json,application/gzip';
    this._sessionInput.style.display = 'none';
    document.body.appendChild(this._sessionInput);
    this._sessionInput.addEventListener('change', async () => {
      const f = this._sessionInput.files && this._sessionInput.files[0];
      if (!f) return;
      const origMB = (f.size / (1024 * 1024)).toFixed(2);
      const preLumaRes = this.doc.lumaRes != null ? this.doc.lumaRes : 2048;
      const preMaxSide = this.doc.sourceMaxSide != null ? this.doc.sourceMaxSide : 2800;
      const preIngestGrid = this.doc.ingestGrid || 1200;
      const preTrim = this.doc.trimMargin !== false;
      const preSub = this.doc.subpixelTrace !== false;
      const preLossless = !!this.doc.losslessSources;

      this.ui.sessionNotice = `Loading ${f.name} (${origMB} MB) at ${preLumaRes === 0 ? '1:1 Native' : preLumaRes + 'px'} luma grid…`;
      this.render();
      try {
        const text = await SE.readFileTextOrGzip(f);
        const restored = await SE.deserializeStudioDocument(text, {
          workingRes: preLumaRes,
          sourceMaxSide: preMaxSide,
          ingestGrid: preIngestGrid,
          trimMargin: preTrim,
          subpixelTrace: preSub,
          lossless: preLossless,
          compactOnLoad: !preLossless && preMaxSide > 0,
          retraceOnLoad: true
        });
        this.doc = restored;
        this._ckv++;
        this._bandCache = {};
        const compactStr = await SE.serializeStudioDocument(this.doc);
        const newMB = (compactStr.length / (1024 * 1024)).toFixed(2);
        this.ui.sessionNotice = `Loaded ${f.name} (${origMB} MB → ${newMB} MB · ${preLumaRes === 0 ? '1:1' : preLumaRes + 'px'} sub-pixel trace)`;
        this.recompute();
      } catch (err) {
        alert('Could not parse session file: ' + (err && err.message || err));
        this.ui.sessionNotice = '';
        this.render();
      }
      this._sessionInput.value = '';
    });

    this._imgInput = document.createElement('input');
    this._imgInput.type = 'file';
    this._imgInput.accept = 'image/*';
    this._imgInput.style.display = 'none';
    document.body.appendChild(this._imgInput);
    this._imgInput.addEventListener('change', async () => {
      const f = this._imgInput.files && this._imgInput.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        await this.handleImageUpload(r.result, f.name, this._uploadMode || 'layer');
        this._imgInput.value = '';
      };
      r.readAsDataURL(f);
    });
  }

  async handleImageUpload(rawDataURL, name, mode = 'layer') {
    const maxSide = this.doc.sourceMaxSide != null ? this.doc.sourceMaxSide : 2800;
    const lumaRes = this.doc.lumaRes != null ? this.doc.lumaRes : 2048;
    const ingestGrid = this.doc.ingestGrid || 1200;
    const trimMargin = this.doc.trimMargin !== false;
    const subpixel = this.doc.subpixelTrace !== false;
    const lossless = !!this.doc.losslessSources;

    // Sample luminance directly from rawDataURL BEFORE compressing so zero scan fidelity is lost!
    const compactURL = await SE.compressSourceDataURL(rawDataURL, maxSide, 0.92, { lossless, trimMargin: false });
    if (mode === 'kspace') {
      await this.initKSpace(compactURL);
      this.render();
      return;
    }

    await this.pushUndo();
    if (mode === 'operad-ingest' || mode === 'operad') {
      let act = this.activeLayer();
      if (!act || act.kind !== 'operad') {
        const opIdx = this.doc.layers.findIndex(l => l.kind === 'operad');
        if (opIdx >= 0) {
          this.doc.activeLayer = opIdx;
          act = this.doc.layers[opIdx];
        } else {
          const opLy = SE.mkOperadLayer('Operad Tree ' + (this.doc.layers.length + 1), { id: 'root', kind: 'op', op: 'group', p: { rankStep: 0 }, t: { x: 0, y: 0, s: 1, r: 0 }, rank: 0, children: [] });
          this.doc.layers.push(opLy);
          this.doc.activeLayer = this.doc.layers.length - 1;
          act = opLy;
        }
      }
      if (act && act.kind === 'operad') {
        const ingestParams = Object.assign({}, SE.OPS.ingest.defaults, {
          grid: ingestGrid,
          subpixel: subpixel ? 1 : 0
        });
        const { node } = await SE.ingestImage(
          rawDataURL,
          ingestParams,
          (name || 'Ingested').replace(/\.[^.]+$/, ''),
          lumaRes,
          { trimMargin }
        );
        node._rawImg = rawDataURL;
        node.img = compactURL;
        act.root.children.push(node);
        SE.invalidate(act.root);
        this.ui.selIds = [node.id];
        this.ui.inspectedId = node.id;
        this.ui.sessionNotice = `Ingested "${name}" into Operad Tree at ${node._src.w}×${node._src.h}px (grid ${ingestGrid}px · ROI ${(node._src.activePixelRatio || 1).toFixed(2)}×)`;
        this.recompute();
        return;
      }
    }

    // Deduplicate against existing sources
    const newHash = SE.fastHash(compactURL);
    let srcIdx = (this.doc.sources || []).findIndex(s => SE.fastHash(s.href || '') === newHash);
    if (srcIdx < 0) {
      const luma = await SE.loadImageLuma(rawDataURL, lumaRes, { trimMargin });
      srcIdx = this.doc.sources.length;
      this.doc.sources.push({
        name: name || 'Uploaded Image',
        href: compactURL,
        rawHref: rawDataURL,
        w: luma.w,
        h: luma.h,
        naturalW: luma.naturalW || luma.w,
        naturalH: luma.naturalH || luma.h,
        activePixelRatio: luma.activePixelRatio || 1
      });
      this.doc.lumas.push(luma);
      this.ui.sessionNotice = `Loaded "${name}" (${luma.naturalW}×${luma.naturalH} → ${luma.w}×${luma.h} luma grid · ROI ${(luma.activePixelRatio || 1).toFixed(2)}×)`;
    }
    const newLayer = SE.mkImageLayer(srcIdx, (name || 'Image Layer').replace(/\.[^.]+$/, ''));
    newLayer.subpixel = subpixel;
    this.doc.layers.push(newLayer);
    this.doc.activeLayer = this.doc.layers.length - 1;
    this._ckv++;
    this._bandCache = {};
    this.recompute();
  }

  async resampleActiveSources() {
    this.ui.sessionNotice = 'Re-sampling & re-tracing active sources at updated fidelity…';
    this.render();
    await SE.resampleStudioSources(this.doc);
    this._ckv++;
    this._bandCache = {};
    const s0 = (this.doc.sources || [])[0];
    const roi = s0 && s0.activePixelRatio ? s0.activePixelRatio.toFixed(2) + '× ROI gain' : 'sub-pixel active';
    this.ui.sessionNotice = `Re-sampled ${(this.doc.sources || []).length} source(s) at ${this.doc.lumaRes === 0 ? '1:1 Native' : this.doc.lumaRes + 'px'} (${roi})`;
    this.recompute();
  }

  async pushUndo() {
    try {
      const snap = await SE.serializeStudioDocument(this.doc, { compressSources: false });
      this.history.push(snap);
      if (this.history.length > 25) this.history.shift();
      this.future = [];
    } catch (e) {}
  }

  async undo() {
    if (!this.history.length) return;
    const cur = await SE.serializeStudioDocument(this.doc, { compressSources: false });
    this.future.push(cur);
    const prev = this.history.pop();
    this.doc = await SE.deserializeStudioDocument(prev, { compactOnLoad: false });
    this.recompute();
  }

  async redo() {
    if (!this.future.length) return;
    const cur = await SE.serializeStudioDocument(this.doc, { compressSources: false });
    this.history.push(cur);
    const nxt = this.future.pop();
    this.doc = await SE.deserializeStudioDocument(nxt, { compactOnLoad: false });
    this.recompute();
  }

  activeLayer() {
    return this.doc.layers[this.doc.activeLayer] || this.doc.layers[0];
  }

  resolvePalette(keyOverride = null) {
    return SE.resolveStudioPalette(keyOverride || this.doc.palKey, this.doc);
  }

  updateDimensions() {
    const fmtObj = SE.FORMATS.find(f => f.key === this.doc.format);
    if (fmtObj) {
      this.doc.W = fmtObj.W;
      this.doc.H = fmtObj.H;
      SE.setPlate(fmtObj.W, fmtObj.H);
      return;
    }
    const s0 = (this.doc.sources || [])[0];
    if (s0 && s0.w && s0.h) {
      const long = 1200;
      this.doc.W = s0.w >= s0.h ? long : Math.round(long * s0.w / s0.h);
      this.doc.H = s0.h > s0.w ? long : Math.round(long * s0.h / s0.w);
    } else {
      this.doc.W = 1000;
      this.doc.H = 1000;
    }
    SE.setPlate(this.doc.W, this.doc.H);
  }

  recompute({ skipRender = false } = {}) {
    this.updateDimensions();
    const pal = this.resolvePalette();
    const a = (this.doc.reliefAngle || 135) * Math.PI / 180;
    const reliefObj = this.doc.relief > 0 ? {
      dist: this.doc.relief,
      dx: Math.cos(a) * this.doc.relief,
      dy: Math.sin(a) * this.doc.relief,
      blur: Math.max(1, this.doc.relief * 0.55),
      alpha: this.doc.reliefAlpha || 0.45
    } : null;

    this.composed = SE.composeStudioPlate({
      ...this.doc,
      pal,
      relief: reliefObj
    }, {
      forExport: false,
      bandCache: this._bandCache,
      ckv: this._ckv
    });
    if (this._kMeasured) this.ui.kStale = true;

    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(async () => {
      const str = await SE.serializeStudioDocument(this.doc);
      SE.idbPut('studioPro.autosave', str);
    }, 900);

    if (skipRender) {
      this.updateCanvasFast();
    } else {
      this.render();
    }
  }

  // Fast non-destructive DOM update during interactive canvas drag/scale/rotate so pointer capture is NEVER broken!
  updateCanvasFast() {
    const svgEl = this.rootEl.querySelector('#studio-svg');
    if (svgEl && this.composed) {
      svgEl.innerHTML = `<defs>${this.composed.defs || ''}</defs>${this.composed.body || ''}`;
    }
    const gizmoEl = this.rootEl.querySelector('#gizmo-overlay');
    if (gizmoEl) {
      gizmoEl.innerHTML = this.renderGizmoInnerSVG();
    }
    const hudEl = this.rootEl.querySelector('#canvas-hud-pill');
    if (hudEl && this.ui.modalHud) {
      hudEl.innerHTML = `<strong>${this.ui.modalHud}</strong>`;
    }
  }

  // ── Layer Stack Operations ────────────────────────────────────────────────
  addOperadLayer() {
    this.pushUndo();
    const ly = SE.mkOperadLayer('Operad Tree ' + (this.doc.layers.length + 1), SE.presetTree('mandala'));
    this.doc.layers.push(ly);
    this.doc.activeLayer = this.doc.layers.length - 1;
    if (ly.root.children[0]) {
      this.ui.selIds = [ly.root.children[0].id];
      this.ui.inspectedId = ly.root.children[0].id;
    }
    this.recompute();
  }

  addGeomeLayer() {
    this.pushUndo();
    const ly = SE.mkGeomeLayer('Seeded Geome ' + (this.doc.layers.length + 1), Math.floor(Math.random() * 99999) + 1);
    this.doc.layers.push(ly);
    this.doc.activeLayer = this.doc.layers.length - 1;
    this.recompute();
  }

  addDemoImageLayer() {
    this.pushUndo();
    const ly = SE.mkImageLayer(0, 'Image Trace ' + (this.doc.layers.length + 1));
    this.doc.layers.push(ly);
    this.doc.activeLayer = this.doc.layers.length - 1;
    this.recompute();
  }

  duplicateLayer(idx) {
    this.pushUndo();
    const src = this.doc.layers[idx];
    if (!src) return;
    const copy = JSON.parse(JSON.stringify(src, (k, v) => k[0] === '_' ? undefined : v));
    copy.id = SE.uid();
    copy.name = src.name + ' Copy';
    if (copy.kind === 'operad' && copy.root) {
      copy.root = cloneTreeWithNewIds(copy.root);
    } else {
      copy.dx = +((copy.dx || 0) + 0.05).toFixed(3);
      copy.dy = +((copy.dy || 0) - 0.04).toFixed(3);
      copy.rot = (copy.rot || 0) + 12;
      if (copy.pb === 'off') copy.pb = 'cycle1';
    }
    this.doc.layers.splice(idx + 1, 0, copy);
    this.doc.activeLayer = idx + 1;
    this.recompute();
  }

  deleteLayer(idx) {
    if (this.doc.layers.length <= 1) return;
    this.pushUndo();
    this.doc.layers.splice(idx, 1);
    this.doc.activeLayer = Math.max(0, Math.min(this.doc.activeLayer, this.doc.layers.length - 1));
    this.recompute();
  }

  moveLayer(idx, dir) {
    const j = idx + dir;
    if (j < 0 || j >= this.doc.layers.length) return;
    this.pushUndo();
    const tmp = this.doc.layers[idx];
    this.doc.layers[idx] = this.doc.layers[j];
    this.doc.layers[j] = tmp;
    if (this.doc.activeLayer === idx) this.doc.activeLayer = j;
    else if (this.doc.activeLayer === j) this.doc.activeLayer = idx;
    this.recompute();
  }

  convertActiveLayerToOperad() {
    const ly = this.activeLayer();
    if (!ly || ly.kind === 'operad') return;
    this.pushUndo();
    const bands = SE.bandsForStudioLayer(ly, this.doc.lumas, this._bandCache, this._ckv);
    const luma = ly.kind === 'geome' ? { w: 1000, h: 1000 } : (this.doc.lumas[ly.src || 0] || { w: 1000, h: 1000 });
    const unitGroup = SE.convertBandsToOperadNode(bands, luma.w, luma.h, this.doc.W, this.doc.H, ly.name + ' (Converted)');
    const rootNode = { id: 'root', kind: 'op', op: 'group', p: { rankStep: 0 }, t: { x: 0, y: 0, s: 1, r: 0 }, rank: 0, children: [unitGroup] };
    const opLayer = SE.mkOperadLayer(ly.name + ' · Operad', rootNode);
    this.doc.layers.splice(this.doc.activeLayer + 1, 0, opLayer);
    this.doc.activeLayer = this.doc.activeLayer + 1;
    this.ui.selIds = [unitGroup.id];
    this.ui.inspectedId = unitGroup.id;
    this.recompute();
  }

  // ── Operadic Tree Node & Direct Selection Operations ──────────────────────
  getActiveOperadRoot() {
    const ly = this.activeLayer();
    return (ly && ly.kind === 'operad') ? ly.root : null;
  }

  getInspectedNode() {
    const root = this.getActiveOperadRoot();
    if (!root) return null;
    if (this.ui.inspectedId) {
      const n = SE.findNode(root, this.ui.inspectedId);
      if (n) return n;
    }
    if (this.ui.selIds.length) {
      const n = SE.findNode(root, this.ui.selIds[0]);
      if (n) return n;
    }
    return (root.children && root.children[0]) ? root.children[0] : null;
  }

  // Returns all selected nodes (or falls back to inspectedNode if selIds is empty)
  getSelectedNodes() {
    const root = this.getActiveOperadRoot();
    if (!root) return [];
    const nodes = this.ui.selIds.map(id => SE.findNode(root, id)).filter(n => n && n.id !== 'root');
    if (nodes.length) return nodes;
    const insp = this.ui.inspectedId ? SE.findNode(root, this.ui.inspectedId) : null;
    return (insp && insp.id !== 'root') ? [insp] : [];
  }

  // Orpheum v3 topSel(): returns selected nodes whose ancestors are not also selected
  getTopSelectedNodes() {
    const root = this.getActiveOperadRoot();
    if (!root) return [];
    const selSet = new Set(this.ui.selIds);
    const out = [];
    const rec = (n) => {
      if (n.id !== 'root' && selSet.has(n.id)) {
        out.push(n);
        return;
      }
      (n.children || []).forEach(rec);
    };
    rec(root);
    if (!out.length) {
      const insp = this.getInspectedNode();
      if (insp && insp.id !== 'root') return [insp];
    }
    return out;
  }

  // Computes individual bounding boxes and union bounding box for selected nodes / layer
  getSelectionBounds() {
    if (!this.ui.selIds || !this.ui.selIds.length) return null;
    const act = this.activeLayer();
    if (!act) return null;
    const W = this.doc.W || 1000, H = this.doc.H || 1000;
    if (act.kind === 'operad' && act.root) {
      const nodes = this.getTopSelectedNodes();
      if (!nodes.length) return null;
      SE.setPlate(W, H);
      const boxes = [];
      let ux0 = 1e9, uy0 = 1e9, ux1 = -1e9, uy1 = -1e9;
      for (const n of nodes) {
        const shapes = SE.evaluate(n);
        const bb = SE.bboxOf(shapes);
        if (bb) {
          boxes.push({ id: n.id, label: n.label || (n.kind === 'op' ? (SE.OPS[n.op] && SE.OPS[n.op].name || n.op) : n.shape), ...bb });
          if (bb.x0 < ux0) ux0 = bb.x0;
          if (bb.y0 < uy0) uy0 = bb.y0;
          if (bb.x1 > ux1) ux1 = bb.x1;
          if (bb.y1 > uy1) uy1 = bb.y1;
        }
      }
      if (ux0 > ux1) return null;
      return {
        kind: 'operad',
        boxes,
        x0: ux0, y0: uy0, x1: ux1, y1: uy1,
        cx: (ux0 + ux1) / 2, cy: (uy0 + uy1) / 2,
        w: Math.max(8, ux1 - ux0), h: Math.max(8, uy1 - uy0)
      };
    } else {
      // Image / Geome layer bounding box
      const sc = act.scale || 1;
      const hw = (W * 0.42) * sc, hh = (H * 0.42) * sc;
      const cx = W / 2 + (act.dx || 0) * W, cy = H / 2 + (act.dy || 0) * H;
      const x0 = cx - hw, y0 = cy - hh, x1 = cx + hw, y1 = cy + hh;
      return {
        kind: 'layer',
        boxes: [{ id: act.id, label: act.name, x0, y0, x1, y1 }],
        x0, y0, x1, y1, cx, cy, w: x1 - x0, h: y1 - y0
      };
    }
  }

  renderGizmoInnerSVG() {
    const W = this.doc.W || 1000, H = this.doc.H || 1000;
    let out = '';
    if (this.ui.marquee) {
      const m = this.ui.marquee;
      const x = Math.min(m.x0, m.x1), y = Math.min(m.y0, m.y1);
      const w = Math.abs(m.x1 - m.x0), h = Math.abs(m.y1 - m.y0);
      out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(212,168,75,0.12)" stroke="#d4a84b" stroke-width="1.5" stroke-dasharray="5 4" style="pointer-events:none;"/>`;
    }
    const b = this.getSelectionBounds();
    if (!b) return out;
    const pad = 6;
    const x0 = b.x0 - pad, y0 = b.y0 - pad, x1 = b.x1 + pad, y1 = b.y1 + pad;
    const w = x1 - x0, h = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const rotY = y0 - 28;
    const hs = 10; // handle size in SVG units

    // Individual sub-boxes when multiple nodes are selected
    if (b.boxes.length > 1) {
      for (const sb of b.boxes) {
        out += `<rect x="${sb.x0 - 2}" y="${sb.y0 - 2}" width="${sb.x1 - sb.x0 + 4}" height="${sb.y1 - sb.y0 + 4}" fill="none" stroke="rgba(212,168,75,0.55)" stroke-width="1.2" stroke-dasharray="3 3" style="pointer-events:none;"/>`;
      }
    }

    // Main union transform frame
    out += `
      <g class="gizmo-frame">
        <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="#141210" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.65" style="pointer-events:none;"/>
        <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="#d4a84b" stroke-width="1.6" stroke-dasharray="6 4" style="pointer-events:none;"/>
        <!-- Rotation Stem & Handle (with generous touch hit halo) -->
        <line x1="${cx}" y1="${y0}" x2="${cx}" y2="${rotY}" stroke="#d4a84b" stroke-width="1.6" style="pointer-events:none;"/>
        <circle data-gizmo="rot" cx="${cx}" cy="${rotY}" r="24" fill="transparent" style="pointer-events:all;cursor:grab;"/>
        <circle data-gizmo="rot" cx="${cx}" cy="${rotY}" r="7.5" fill="#141418" stroke="#d4a84b" stroke-width="2.2" class="gizmo-rot-handle" style="pointer-events:all;cursor:grab;">
          <title>Drag to Rotate (Hold Shift to snap 15°)</title>
        </circle>
        <!-- Center Pivot Crosshair -->
        <circle cx="${cx}" cy="${cy}" r="3.5" fill="#d4a84b" stroke="#141210" stroke-width="1" style="pointer-events:none;"/>
        <!-- 4 Corner Scale Handles (with generous touch hit halo) -->
        ${[
          ['nw', x0, y0, 'nwse-resize'],
          ['ne', x1, y0, 'nesw-resize'],
          ['se', x1, y1, 'nwse-resize'],
          ['sw', x0, y1, 'nesw-resize']
        ].map(([dir, hx, hy, cur]) => `
          <g data-gizmo="scale-${dir}" style="pointer-events:all;cursor:${cur};">
            <rect x="${hx - 18}" y="${hy - 18}" width="36" height="36" fill="transparent"/>
            <rect x="${hx - hs / 2}" y="${hy - hs / 2}" width="${hs}" height="${hs}" rx="2" fill="#d4a84b" stroke="#141210" stroke-width="1.5">
              <title>Drag corner to Scale proportionally</title>
            </rect>
          </g>
        `).join('')}
      </g>
    `;
    return out;
  }

  isNodeCollapsed(node) {
    if (!node || node.kind !== 'op') return false;
    if (!this.ui.collapsedIds) this.ui.collapsedIds = {};
    if (node.id in this.ui.collapsedIds) return !!this.ui.collapsedIds[node.id];
    // Per Review Ledger #32: fold Ingest units or large >16-child groups by default
    if (node.op === 'ingest' || (node.children && node.children.length > 16)) {
      this.ui.collapsedIds[node.id] = true;
      return true;
    }
    return false;
  }

  toggleNodeCollapsed(nodeId, recursive = false) {
    const root = this.getActiveOperadRoot();
    if (!root) return;
    if (!this.ui.collapsedIds) this.ui.collapsedIds = {};
    const node = SE.findNode(root, nodeId);
    if (!node || node.kind !== 'op') return;
    const next = !this.isNodeCollapsed(node);
    if (recursive) {
      SE.walk(node, n => { if (n.kind === 'op' && n.id !== 'root') this.ui.collapsedIds[n.id] = next; });
    } else {
      this.ui.collapsedIds[node.id] = next;
    }
    this.render();
  }

  flattenTreeList(root) {
    const rows = [];
    if (!root) return rows;
    const rec = (node, depth, parent) => {
      if (node.id !== 'root') {
        const hasChildren = node.kind === 'op' && Array.isArray(node.children) && node.children.length > 0;
        const collapsed = hasChildren ? this.isNodeCollapsed(node) : false;
        rows.push({ node, depth, parent, hasChildren, collapsed });
        if (collapsed) return;
      }
      (node.children || []).forEach(c => rec(c, node.id === 'root' ? 0 : depth + 1, node));
    };
    rec(root, 0, null);
    return rows;
  }

  // Computes cumulative ancestor scale, rotation, and mirror flip above `targetId`
  getAncestorTransform(root, targetId) {
    const chain = [];
    const findChain = (n, path) => {
      if (n.id === targetId) { chain.push(...path); return true; }
      for (const c of (n.children || [])) {
        if (findChain(c, n.id === 'root' ? path : [...path, n])) return true;
      }
      return false;
    };
    if (root) findChain(root, []);
    let s = 1, r = 0, fx = 1, fy = 1;
    for (const anc of chain) {
      const t = anc.t || { s: 1, r: 0 };
      s *= (t.s || 1);
      r += (t.r || 0);
      if (t.fx) fx *= -1;
      if (t.fy) fy *= -1;
    }
    return { s: Math.max(1e-4, s), r, fx, fy };
  }

  plateDeltaToLocal(root, nodeId, dx, dy) {
    if (!root || !nodeId) return { dx, dy };
    const { s, r, fx, fy } = this.getAncestorTransform(root, nodeId);
    const c = Math.cos(-r), sn = Math.sin(-r);
    const rx = (dx * c - dy * sn) / s;
    const ry = (dx * sn + dy * c) / s;
    return { dx: rx * fx, dy: ry * fy };
  }

  addOperadAtom(shape) {
    let root = this.getActiveOperadRoot();
    if (!root) {
      this.addOperadLayer();
      root = this.getActiveOperadRoot();
      if (!root) return;
    }
    this.pushUndo();
    const cx = this.doc.W / 2 + Math.round((Math.random() - 0.5) * 160);
    const cy = this.doc.H / 2 + Math.round((Math.random() - 0.5) * 160);
    const rank = Math.floor(Math.random() * 4);
    const atom = SE.makeAtom(shape, cx, cy, rank, 125);
    let target = this.getInspectedNode();
    if (!target || target.kind === 'atom') {
      target = (target && SE.findParent(root, target.id)) || root;
    }
    target.children.push(atom);
    SE.invalidate(root);
    this.ui.selIds = [atom.id];
    this.ui.inspectedId = atom.id;
    this.ui.sessionNotice = `Added ${shape} atom — Drag on canvas or use Arrows / [ ] / , . to transform`;
    this.recompute();
  }

  wrapInOperator(opKey) {
    const root = this.getActiveOperadRoot();
    if (!root) return;
    const ALIAS = { wheel: 'fold', spiral: 'echo', nest: 'harmonic' };
    const resolvedKey = ALIAS[opKey] || opKey;
    const def = SE.OPS[resolvedKey];
    if (!def) return;
    opKey = resolvedKey;
    this.pushUndo();
    let targets = this.getTopSelectedNodes();
    if (!targets.length && root.children.length) targets = [root.children[0]];
    if (!targets.length) return;

    if (def.arity === 2 && targets.length < 2) {
      if (targets[0] && targets[0].kind === 'op' && (targets[0].children || []).length >= 2) {
        targets = targets[0].children.slice();
      } else if (root.children.length >= 2) {
        targets = root.children.slice();
      } else {
        this.ui.sessionNotice = `${def.name} requires ≥ 2 forms — Shift-Click two shapes first`;
        this.render();
        return;
      }
    }

    const parent = SE.findParent(root, targets[0].id) || root;
    const sameParent = targets.every(t => SE.findParent(root, t.id) === parent);
    if (sameParent) {
      const ix = parent.children.indexOf(targets[0]);
      const wrapped = SE.makeOp(opKey, targets);
      parent.children = parent.children.filter(c => !targets.includes(c));
      parent.children.splice(Math.max(0, ix), 0, wrapped);
      SE.invalidate(root);
      this.ui.selIds = [wrapped.id];
      this.ui.inspectedId = wrapped.id;
    } else {
      targets.forEach(t => {
        const p = SE.findParent(root, t.id);
        if (!p) return;
        const ix = p.children.indexOf(t);
        if (ix >= 0) p.children.splice(ix, 1, SE.makeOp(opKey, [t]));
      });
      SE.invalidate(root);
    }
    this.ui.sessionNotice = `Applied ${def.glyph} ${def.name}`;
    this.recompute();
  }

  flattenOperadNode() {
    const root = this.getActiveOperadRoot();
    const nodes = this.getTopSelectedNodes();
    if (!root || !nodes.length) return;
    this.pushUndo();
    const newSel = [];
    for (const node of nodes) {
      if (node.kind === 'atom' || node.id === 'root') continue;
      const atoms = SE.flatten(node);
      const grp = SE.makeOp('group', atoms);
      grp.label = (node.label || node.op) + ' (flattened)';
      const parent = SE.findParent(root, node.id) || root;
      const ix = parent.children.findIndex(c => c.id === node.id);
      if (ix >= 0) parent.children.splice(ix, 1, grp);
      newSel.push(grp.id);
    }
    if (!newSel.length) return;
    SE.invalidate(root);
    this.ui.selIds = newSel;
    this.ui.inspectedId = newSel[0];
    this.ui.sessionNotice = `Flattened operator into editable polygon atoms`;
    this.recompute();
  }

  ungroupOperadNode() {
    const root = this.getActiveOperadRoot();
    const nodes = this.getTopSelectedNodes();
    if (!root || !nodes.length) return;
    this.pushUndo();
    const newSel = [];
    for (const node of nodes) {
      if (node.kind !== 'op' || node.id === 'root') continue;
      const parent = SE.findParent(root, node.id);
      if (!parent) continue;
      const ix = parent.children.findIndex(c => c.id === node.id);
      const kids = node.children || [];
      if (ix >= 0) parent.children.splice(ix, 1, ...kids);
      kids.forEach(k => newSel.push(k.id));
    }
    SE.invalidate(root);
    this.ui.selIds = newSel;
    this.ui.inspectedId = newSel[0] || (root.children[0] ? root.children[0].id : null);
    this.ui.sessionNotice = `Ungrouped into ${newSel.length} child unit(s)`;
    this.recompute();
  }

  duplicateOperadNode() {
    const act = this.activeLayer();
    if (!act) return;
    if (act.kind !== 'operad') {
      this.duplicateLayer(this.doc.activeLayer);
      return;
    }
    const root = act.root;
    const nodes = this.getTopSelectedNodes();
    if (!root || !nodes.length) return;
    this.pushUndo();
    const newSel = [];
    for (const node of nodes) {
      const parent = SE.findParent(root, node.id);
      if (!parent) continue;
      const copy = cloneTreeWithNewIds(node);
      copy.t.x = (copy.t.x || 0) + 32;
      copy.t.y = (copy.t.y || 0) + 24;
      const ix = parent.children.findIndex(c => c.id === node.id);
      parent.children.splice(ix + 1, 0, copy);
      newSel.push(copy.id);
    }
    SE.invalidate(root);
    this.ui.selIds = newSel;
    this.ui.inspectedId = newSel[0];
    this.ui.sessionNotice = `Duplicated ${newSel.length} unit(s)`;
    this.recompute();
  }

  deleteOperadNode() {
    const root = this.getActiveOperadRoot();
    const nodes = this.getTopSelectedNodes();
    if (!root || !nodes.length) return;
    this.pushUndo();
    for (const node of nodes) {
      const parent = SE.findParent(root, node.id);
      if (parent && parent.children.length > 0) {
        parent.children = parent.children.filter(c => c.id !== node.id);
      }
    }
    SE.invalidate(root);
    this.ui.selIds = [];
    this.ui.inspectedId = root.children[0] ? root.children[0].id : null;
    this.ui.sessionNotice = `Deleted ${nodes.length} unit(s)`;
    this.recompute();
  }

  // ── High-Frequency Repeated Geometric Transformations ─────────────────────
  nudgeSelection(dx, dy) {
    const act = this.activeLayer();
    if (!act) return;
    if (act.kind === 'operad' && act.root) {
      const nodes = this.getTopSelectedNodes();
      if (!nodes.length) return;
      nodes.forEach(n => {
        n.t.x = Math.round(((n.t.x || 0) + dx) * 10) / 10;
        n.t.y = Math.round(((n.t.y || 0) + dy) * 10) / 10;
      });
      SE.invalidate(act.root);
      this.recompute();
    } else {
      const W = this.doc.W || 1000, H = this.doc.H || 1000;
      act.dx = +((act.dx || 0) + dx / W).toFixed(4);
      act.dy = +((act.dy || 0) + dy / H).toFixed(4);
      this.recompute();
    }
  }

  rotateSelectionBy(deg) {
    const act = this.activeLayer();
    if (!act) return;
    this.pushUndo();
    const rad = deg * Math.PI / 180;
    if (act.kind === 'operad' && act.root) {
      const nodes = this.getTopSelectedNodes();
      if (!nodes.length) return;
      nodes.forEach(n => {
        n.t.r = (n.t.r || 0) + rad;
      });
      SE.invalidate(act.root);
      const degShow = Math.round((nodes[0].t.r || 0) * 180 / Math.PI);
      this.ui.sessionNotice = `Rotated ${deg > 0 ? '+' : ''}${deg.toFixed(1).replace(/\.0$/, '')}° (Angle: ${degShow}°)`;
      this.recompute();
    } else {
      act.rot = Math.round(((act.rot || 0) + deg) * 10) / 10;
      this.ui.sessionNotice = `Layer Rotated ${deg > 0 ? '+' : ''}${deg.toFixed(1).replace(/\.0$/, '')}° (${act.rot}°)`;
      this.recompute();
    }
  }

  scaleSelectionBy(factor) {
    const act = this.activeLayer();
    if (!act) return;
    this.pushUndo();
    if (act.kind === 'operad' && act.root) {
      const nodes = this.getTopSelectedNodes();
      if (!nodes.length) return;
      nodes.forEach(n => {
        if (n.kind === 'atom' && (n.t.s == null || n.t.s === 1)) {
          n.size = Math.max(8, Math.min(900, +(n.size * factor).toFixed(2)));
        } else {
          n.t.s = Math.max(0.08, Math.min(8, +((n.t.s == null ? 1 : n.t.s) * factor).toFixed(4)));
        }
      });
      SE.invalidate(act.root);
      this.ui.sessionNotice = `Scaled ×${factor.toFixed(3)}`;
      this.recompute();
    } else {
      act.scale = Math.max(0.15, Math.min(4.0, +((act.scale == null ? 1 : act.scale) * factor).toFixed(3)));
      this.ui.sessionNotice = `Layer Scale: ${act.scale}×`;
      this.recompute();
    }
  }

  flipSelection(axis = 'x') {
    const act = this.activeLayer();
    if (!act) return;
    this.pushUndo();
    if (act.kind === 'operad' && act.root) {
      const nodes = this.getTopSelectedNodes();
      if (!nodes.length) return;
      nodes.forEach(n => {
        if (axis === 'x') n.t.fx = !n.t.fx;
        else n.t.fy = !n.t.fy;
      });
      SE.invalidate(act.root);
      this.ui.sessionNotice = `Flipped ${axis === 'x' ? 'Horizontal ⇆' : 'Vertical ⇅'}`;
      this.recompute();
    } else {
      act.rot = ((act.rot || 0) + 180) % 360;
      this.ui.sessionNotice = `Flipped Layer 180°`;
      this.recompute();
    }
  }

  centerSelection(axis = 'both') {
    const act = this.activeLayer();
    if (!act) return;
    this.pushUndo();
    const W = this.doc.W || 1000, H = this.doc.H || 1000;
    if (act.kind === 'operad' && act.root) {
      const nodes = this.getTopSelectedNodes();
      if (!nodes.length) return;
      SE.setPlate(W, H);
      nodes.forEach(n => {
        if (n.kind === 'atom') {
          if (axis === 'both' || axis === 'x') n.t.x = W / 2;
          if (axis === 'both' || axis === 'y') n.t.y = H / 2;
        } else {
          const S = SE.evaluate(n);
          const c = SE.centroidOf(S);
          if (axis === 'both' || axis === 'x') n.t.x = Math.round((n.t.x || 0) + (W / 2 - c.x));
          if (axis === 'both' || axis === 'y') n.t.y = Math.round((n.t.y || 0) + (H / 2 - c.y));
        }
      });
      SE.invalidate(act.root);
      this.ui.sessionNotice = `Centered on Plate (${W / 2}, ${H / 2})`;
      this.recompute();
    } else {
      if (axis === 'both' || axis === 'x') act.dx = 0;
      if (axis === 'both' || axis === 'y') act.dy = 0;
      this.ui.sessionNotice = `Centered Layer on Plate`;
      this.recompute();
    }
  }

  resetSelectionTransform() {
    const act = this.activeLayer();
    if (!act) return;
    this.pushUndo();
    const W = this.doc.W || 1000, H = this.doc.H || 1000;
    if (act.kind === 'operad' && act.root) {
      const nodes = this.getTopSelectedNodes();
      nodes.forEach(n => {
        if (n.kind === 'atom') {
          n.t = { x: W / 2, y: H / 2, s: 1, r: 0, fx: false, fy: false };
        } else {
          n.t = { x: 0, y: 0, s: 1, r: 0, fx: false, fy: false };
        }
      });
      SE.invalidate(act.root);
    } else {
      act.dx = 0; act.dy = 0; act.scale = 1; act.rot = 0;
    }
    this.ui.sessionNotice = `Reset Transform to Identity`;
    this.recompute();
  }

  setSelectionRank(rankIdx) {
    const act = this.activeLayer();
    if (!act) return;
    const pal = this.resolvePalette();
    const m = Math.max(1, pal.ramp.length);
    const r = ((rankIdx % m) + m) % m;
    if (act.kind === 'operad' && act.root) {
      const nodes = this.getSelectedNodes();
      if (!nodes.length) return;
      this.pushUndo();
      nodes.forEach(n => { n.rank = r; });
      SE.invalidate(act.root);
      this.ui.sessionNotice = `Set Tone Rank → R${r + 1} (${pal.ramp[r]})`;
      this.recompute();
    } else {
      act.palRoll = r;
      this.ui.sessionNotice = `Set Layer Tone Roll → +${r}`;
      this.recompute();
    }
  }

  reorderSelection(dir) {
    const root = this.getActiveOperadRoot();
    const nodes = this.getTopSelectedNodes();
    if (!root || !nodes.length) return;
    this.pushUndo();
    const mode = dir === 2 ? 'front' : dir === 1 ? 'forward' : dir === -1 ? 'backward' : dir === -2 ? 'back' : dir;
    for (const node of nodes) {
      const parent = SE.findParent(root, node.id);
      if (!parent || !parent.children) continue;
      const ix = parent.children.indexOf(node);
      if (ix < 0) continue;
      parent.children.splice(ix, 1);
      if (mode === 'front') parent.children.push(node);
      else if (mode === 'back') parent.children.unshift(node);
      else if (mode === 'forward') parent.children.splice(Math.min(parent.children.length, ix + 1), 0, node);
      else if (mode === 'backward') parent.children.splice(Math.max(0, ix - 1), 0, node);
    }
    SE.invalidate(root);
    this.ui.sessionNotice = `Z-Order: ${mode}`;
    this.recompute();
  }

  addPrimitiveAtom(shape) { return this.addOperadAtom(shape); }
  duplicateSelectedNodes() { return this.duplicateOperadNode(); }
  deleteSelectedNodes() { return this.deleteOperadNode(); }
  groupSelection() { return this.wrapInOperator('group'); }
  ungroupSelection() { return this.ungroupOperadNode(); }
  flattenSelection() { return this.flattenOperadNode(); }
  pushHistory() { return this.pushUndo(); }

  selectAllNodes() {
    const root = this.getActiveOperadRoot();
    if (!root) return;
    this.ui.selIds = (root.children || []).map(c => c.id);
    this.ui.inspectedId = this.ui.selIds[0] || null;
    this.ui.sessionNotice = `Selected all ${this.ui.selIds.length} top-level unit(s)`;
    this.render();
  }

  clearSelection() {
    this.ui.selIds = [];
    this.ui.inspectedId = null;
    this.ui.openMenu = null;
    this.ui.sessionNotice = `Selection released`;
    this.render();
  }

  selectParentNode() {
    const root = this.getActiveOperadRoot();
    const node = this.getInspectedNode();
    if (!root || !node) return;
    const p = SE.findParent(root, node.id);
    if (p && p.id !== 'root') {
      this.ui.selIds = [p.id];
      this.ui.inspectedId = p.id;
      this.ui.sessionNotice = `Selected parent unit: ${p.label || p.op}`;
      this.render();
    }
  }

  selectChildNodes() {
    const node = this.getInspectedNode();
    if (!node || !node.children || !node.children.length) return;
    this.ui.selIds = node.children.map(c => c.id);
    this.ui.inspectedId = this.ui.selIds[0];
    this.ui.sessionNotice = `Selected ${this.ui.selIds.length} child node(s)`;
    this.render();
  }

  // ── K-Space 4-Up Lab Methods ──────────────────────────────────────────────
  async initKSpace(srcURL) {
    const N = 256;
    this._kN = N;
    const c = document.createElement('canvas');
    c.width = N; c.height = N;
    const ctx = c.getContext('2d');
    const img = new Image();
    await new Promise(res => { img.onload = res; img.onerror = res; img.src = srcURL; });
    ctx.fillStyle = '#f2ecdd';
    ctx.fillRect(0, 0, N, N);
    if (img.width) ctx.drawImage(img, 0, 0, N, N);
    const rgba = ctx.getImageData(0, 0, N, N).data;
    const field = new Float64Array(N * N);
    const re = new Float64Array(N * N);
    const im = new Float64Array(N * N);
    let mean = 0;
    for (let i = 0; i < N * N; i++) {
      const v = 1.0 - (0.299 * rgba[i * 4] + 0.587 * rgba[i * 4 + 1] + 0.114 * rgba[i * 4 + 2]) / 255;
      field[i] = v;
      re[i] = v;
      mean += v;
    }
    mean /= (N * N);
    for (let i = 0; i < N * N; i++) re[i] -= mean;
    this._kMean = mean;
    this._kField = field;

    SE.fft2(re, im, N, false);
    // Shift DC to center (N/2, N/2)
    const h = N >> 1;
    this._kOrigRe = new Float64Array(N * N);
    this._kOrigIm = new Float64Array(N * N);
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const si = ((y + h) % N) * N + ((x + h) % N);
        this._kOrigRe[si] = re[y * N + x];
        this._kOrigIm[si] = im[y * N + x];
      }
    }
    this._kMask = new Float32Array(N * N);
    this._kMask.fill(1.0);
    this.updateKSpaceMetrics();
    this.reconstructKSpace();
  }

  loadKSpacePreset(kind) {
    const N = 256;
    this.ui.kPreset = kind;
    const c = document.createElement('canvas');
    c.width = N; c.height = N;
    const x = c.getContext('2d');
    x.fillStyle = '#f2ecdd'; x.fillRect(0, 0, N, N);
    x.fillStyle = '#141210'; x.strokeStyle = '#141210'; x.lineWidth = 6;
    if (kind === 'mandala') {
      for (let k = 0; k < 12; k++) {
        const a = k * Math.PI / 6;
        x.beginPath();
        x.arc(128 + 56 * Math.cos(a), 128 + 56 * Math.sin(a), 36, 0, Math.PI * 2);
        x.stroke();
      }
      x.beginPath(); x.arc(128, 128, 28, 0, Math.PI * 2); x.fill();
    } else if (kind === 'lattice') {
      for (let r = 24; r < N; r += 32) {
        for (let col = 24; col < N; col += 32) {
          x.fillRect(col - 7, r - 7, 14, 14);
        }
      }
    } else {
      x.lineWidth = 8;
      x.beginPath(); x.arc(128, 110, 74, 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.moveTo(45, 225); x.lineTo(128, 150); x.lineTo(211, 225); x.closePath(); x.stroke();
    }
    this.initKSpace(c.toDataURL('image/png')).then(() => this.render());
  }

  updateKSpaceMetrics() {
    if (!this._kOrigRe) return;
    const N = this._kN, half = N >> 1;
    const bins = new Float64Array(half), counts = new Uint32Array(half);
    let active = 0;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const i = y * N + x;
        const m = this._kMask[i];
        if (m > 0.05) active++;
        const r = Math.min(half - 1, Math.round(Math.hypot(x - half, y - half)));
        const mag2 = (this._kOrigRe[i] * m) ** 2 + (this._kOrigIm[i] * m) ** 2;
        bins[r] += mag2;
        counts[r]++;
      }
    }
    const logK = [], logP = [], radPts = [];
    for (let r = 2; r < half - 2; r++) {
      const p = counts[r] ? bins[r] / counts[r] : 0;
      if (p > 1e-9) {
        logK.push(Math.log10(r));
        logP.push(Math.log10(p));
        radPts.push({ r, lp: Math.log10(p) });
      }
    }
    let beta = 2.1;
    if (logK.length > 4) {
      const mx = logK.reduce((a, b) => a + b, 0) / logK.length;
      const my = logP.reduce((a, b) => a + b, 0) / logP.length;
      let num = 0, den = 0;
      for (let i = 0; i < logK.length; i++) {
        num += (logK[i] - mx) * (logP[i] - my);
        den += (logK[i] - mx) ** 2;
      }
      if (den > 1e-9) beta = Math.max(0.2, Math.min(5.0, -num / den));
    }
    this.ui.kBeta = +beta.toFixed(2);
    this.ui.kFracD = +(Math.max(2.0, Math.min(3.0, (8 - beta) / 2))).toFixed(2);
    this.ui.kActivePct = ((active / (N * N)) * 100).toFixed(1) + '%';
    this.ui.kRadBins = radPts;
  }

  reconstructKSpace() {
    if (!this._kOrigRe) return;
    const N = this._kN, h = N >> 1;
    const re = new Float64Array(N * N);
    const im = new Float64Array(N * N);
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const si = y * N + x;
        const ui = ((y + h) % N) * N + ((x + h) % N);
        re[ui] = this._kOrigRe[si] * this._kMask[si];
        im[ui] = this._kOrigIm[si] * this._kMask[si];
      }
    }
    SE.fft2(re, im, N, true);
    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < N * N; i++) {
      if (re[i] < mn) mn = re[i];
      if (re[i] > mx) mx = re[i];
    }
    const span = (mx - mn) || 1;
    const norm = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) norm[i] = (re[i] - mn) / span;
    this._kReturnNorm = norm;
    this.drawKSpaceCanvases();
  }

  applyKSpaceFilterPreset(preset) {
    if (!this._kMask) return;
    const N = this._kN, half = N >> 1;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const dx = x - half, dy = y - half;
        const r = Math.hypot(dx, dy);
        let v = 1.0;
        if (preset === 'low') v = Math.exp(-(r * r) / (2 * 18 * 18));
        else if (preset === 'band') v = (r <= 2) ? 1.0 : Math.exp(-((r - 22) ** 2) / (2 * 9 * 9));
        else if (preset === 'high') v = (r <= 2) ? 0.5 : (1.0 - Math.exp(-(r * r) / (2 * 14 * 14)));
        else if (preset === 'aniso') {
          const ang = Math.atan2(dy, dx);
          v = (r <= 2) ? 1.0 : Math.pow(Math.cos(ang), 4) * Math.exp(-(r * r) / (2 * 45 * 45));
        }
        this._kMask[y * N + x] = v;
      }
    }
    this.updateKSpaceMetrics();
    this.reconstructKSpace();
    this.render();
  }

  sendKSpaceReturnToStudio(targetType = 'layer') {
    if (!this._kReturnNorm) return;
    const N = this._kN;
    const c = document.createElement('canvas');
    c.width = N; c.height = N;
    const ctx = c.getContext('2d');
    const imgData = ctx.createImageData(N, N);
    for (let i = 0; i < N * N; i++) {
      const v = Math.round((1 - this._kReturnNorm[i]) * 255);
      imgData.data[i * 4] = v;
      imgData.data[i * 4 + 1] = v;
      imgData.data[i * 4 + 2] = v;
      imgData.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    const dataURL = c.toDataURL('image/png');
    this.ui.workspace = 'compose';
    this.handleImageUpload(dataURL, `k-Space Return (β=${this.ui.kBeta}).png`, targetType === 'operad' ? 'operad' : 'layer');
  }

  exportSpectrumPNG() {
    const specCv = document.getElementById('k-spec-cv');
    if (!specCv) return;
    specCv.toBlob(blob => {
      if (blob) {
        this.downloadBlob(`orpheum-kspace-spectrum-beta-${this.ui.kBeta}.png`, blob);
        this.ui.sessionNotice = `Exported 2D K-Space Spectrum PNG (β=${this.ui.kBeta}, D=${this.ui.kFracD})`;
        this.render();
      }
    }, 'image/png');
  }

  drawKSpaceCanvases() {
    requestAnimationFrame(() => {
      const N = this._kN || 256;
      const srcCv = document.getElementById('k-src-cv');
      const specCv = document.getElementById('k-spec-cv');
      const retCv = document.getElementById('k-ret-cv');
      if (srcCv && this._kField) {
        srcCv.width = N; srcCv.height = N;
        const ctx = srcCv.getContext('2d');
        const id = ctx.createImageData(N, N);
        for (let i = 0; i < N * N; i++) {
          const v = Math.round((1 - this._kField[i]) * 255);
          id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(id, 0, 0);
      }
      if (specCv && this._kOrigRe) {
        specCv.width = N; specCv.height = N;
        const ctx = specCv.getContext('2d');
        const id = ctx.createImageData(N, N);
        let maxLog = 1;
        const logs = new Float32Array(N * N);
        for (let i = 0; i < N * N; i++) {
          const m = Math.log1p(Math.hypot(this._kOrigRe[i], this._kOrigIm[i]));
          logs[i] = m;
          if (m > maxLog) maxLog = m;
        }
        for (let i = 0; i < N * N; i++) {
          const u = (logs[i] / maxLog) * (0.18 + 0.82 * this._kMask[i]);
          id.data[i * 4] = Math.round(Math.min(255, u * 280));
          id.data[i * 4 + 1] = Math.round(Math.min(255, Math.pow(u, 1.3) * 215));
          id.data[i * 4 + 2] = Math.round(Math.min(255, Math.pow(u, 2.2) * 140));
          id.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(id, 0, 0);
      }
      if (retCv && this._kReturnNorm) {
        retCv.width = N; retCv.height = N;
        const ctx = retCv.getContext('2d');
        const id = ctx.createImageData(N, N);
        const pal = this.resolvePalette();
        const L = Math.max(2, this.ui.kQuantLevels || 5);
        const colors = [pal.ground].concat(pal.ramp).map(hx => hexToRgb255(hx));
        for (let i = 0; i < N * N; i++) {
          const qIdx = Math.min(L - 1, Math.floor(this._kReturnNorm[i] * L));
          const col = colors[qIdx % colors.length];
          id.data[i * 4] = col[0];
          id.data[i * 4 + 1] = col[1];
          id.data[i * 4 + 2] = col[2];
          id.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(id, 0, 0);
      }
    });
  }

  // ── Session Save & Archival Print Export ──────────────────────────────────
  downloadBlob(filename, blob) {
    SE.download(blob, filename);
  }

  async saveSessionJSON() {
    const str = await SE.serializeStudioDocument(this.doc);
    const kb = (str.length / 1024).toFixed(1);
    this.ui.sessionNotice = `Saved compact .orpheum-studio.json (${kb} KB · 0 SVG bloat)`;
    this.downloadBlob(`orpheum-studio-${Date.now().toString(36)}.orpheum-studio.json`, new Blob([str], { type: 'application/json' }));
    this.render();
  }

  async saveSessionGZ() {
    const str = await SE.serializeStudioDocument(this.doc);
    const blob = await SE.gzipString(str);
    const kb = (blob.size / 1024).toFixed(1);
    this.ui.sessionNotice = `Saved compressed .orpheum-studio.json.gz (${kb} KB)`;
    this.downloadBlob(`orpheum-studio-${Date.now().toString(36)}.orpheum-studio.json.gz`, blob);

  exportSVG() {
    SE.live.drag = false;
    const pal = this.resolvePalette();
    const a = (this.doc.reliefAngle || 135) * Math.PI / 180;
    const reliefObj = this.doc.relief > 0 ? {
      dist: this.doc.relief,
      dx: Math.cos(a) * this.doc.relief,
      dy: Math.sin(a) * this.doc.relief,
      blur: Math.max(1, this.doc.relief * 0.55),
      alpha: this.doc.reliefAlpha || 0.45
    } : null;
    const clean = SE.composeStudioPlate({ ...this.doc, pal, relief: reliefObj }, {
      forExport: true,
      maxPairsOverride: 6000,
      bandCache: this._bandCache,
      ckv: this._ckv
    });
    this.ui.sessionNotice = `Exported Print SVG (${clean.stats.forms} forms · ${clean.stats.overs} glues · P1 Closure ${clean.stats.closurePass ? 'PASS' : 'WARN'})`;
    this.downloadBlob(`orpheum-studio-${this.doc.palKey}-${this.doc.W}x${this.doc.H}.svg`, new Blob([clean.svg], { type: 'image/svg+xml' }));
    this.render();
  }

  async exportHighDPI() {
    if (this.ui.exportStatus) return;
    SE.live.drag = false;
    const pal = this.resolvePalette();
    const a = (this.doc.reliefAngle || 135) * Math.PI / 180;
    const reliefObj = this.doc.relief > 0 ? {
      dist: this.doc.relief,
      dx: Math.cos(a) * this.doc.relief,
      dy: Math.sin(a) * this.doc.relief,
      blur: Math.max(1, this.doc.relief * 0.55),
      alpha: this.doc.reliefAlpha || 0.45
    } : null;
    const clean = SE.composeStudioPlate({ ...this.doc, pal, relief: reliefObj }, {
      forExport: true,
      maxPairsOverride: 6000,
      bandCache: this._bandCache,
      ckv: this._ckv
    });
    const reqLongPx = Math.round(this.doc.inches * this.doc.dpi);
    // Per Review Ledger #2 & #19: clamp longPx to 16000px (and area to 16MP if CompressionStream is unavailable on Apple WebKit)
    const isAppleWebKit = typeof navigator !== 'undefined' && /Apple/.test(navigator.vendor || '') && !/Chrome/.test(navigator.userAgent || '');
    const aspect = Math.min(this.doc.W, this.doc.H) / Math.max(1, Math.max(this.doc.W, this.doc.H));
    const maxSafeLong = (isAppleWebKit && typeof CompressionStream === 'undefined')
      ? Math.min(16000, Math.floor(Math.sqrt(16000000 / Math.max(0.1, aspect))))
      : 16000;
    const longPx = Math.min(maxSafeLong, reqLongPx);
    const effDpi = Math.round(longPx / Math.max(1, this.doc.inches));
    const clampedMsg = longPx < reqLongPx
      ? ` (Clamped from ${reqLongPx}px → ${longPx}px · Effective ${effDpi} DPI per browser canvas ceiling)`
      : '';
    try {
      this.ui.exportStatus = 'Starting…';
      this.render();
      const blob = await SE.exportHighDPI_PNG(
        clean,
        this.doc.W,
        this.doc.H,
        longPx,
        effDpi,
        (done, total) => {
          this.ui.exportStatus = `Strip ${done}/${total}`;
          const el = document.getElementById('export-btn-label');
          if (el) el.textContent = `⏳ ${this.ui.exportStatus}`;
        }
      );
      this.ui.sessionNotice = `Exported Print PNG (${longPx}px long edge · ${effDpi} DPI)${clampedMsg}`;
      this.downloadBlob(`orpheum-studio-${this.doc.inches}in-${effDpi}dpi.png`, blob);
    } catch (err) {
      alert('Print export error: ' + (err && err.message || err));
    }
    this.ui.exportStatus = '';
    this.render();
  }

  toggleBezierCurves() {
    this.doc.bezierCurves = this.doc.bezierCurves === false ? true : false;
    this._ckv++;
    this._bandCache = {};
    this.ui.sessionNotice = this.doc.bezierCurves
      ? 'Curve Engine: Analytic C¹ Cubic Bézier Splines (C) — infinite DPI smoothness'
      : 'Curve Engine: Piecewise Linear Polygons (L) — classic faceted vertices';
    this.recompute();
  }

  toggleNativeFidelity() {
    const isNat = this.doc.sourceMaxSide === 0 && this.doc.lumaRes === 0;
    this.doc.sourceMaxSide = isNat ? 2800 : 0;
    this.doc.lumaRes = isNat ? 2048 : 0;
    this.doc.ingestGrid = isNat ? 1200 : 2400;
    this.ui.sessionNotice = isNat
      ? 'Fidelity Mode: Balanced High-Res (2800px ceiling · 2048px luma grid)'
      : 'Fidelity Mode: 1:1 Native Master (0 downsample · full-resolution trace)';
    this.render();
  }

  cyclePalette(dir = 1) {
    const keys = Object.keys(SE.PALETTES);
    const curIdx = Math.max(0, keys.indexOf(this.doc.palKey));
    this.doc.palKey = keys[(curIdx + dir + keys.length) % keys.length];
    this.ui.sessionNotice = `Palette: ${this.resolvePalette().label}`;
    this.recompute();
  }

  cycleGlueMode() {
    const modes = ['sheaf', 'chord', 'multiply', 'xor', 'off'];
    const idx = Math.max(0, modes.indexOf(this.doc.glueMode || 'sheaf'));
    this.doc.glueMode = modes[(idx + 1) % modes.length];
    this.ui.sessionNotice = `Glue Law: ${this.doc.glueMode}`;
    this.recompute();
  }

  startModalScrub(mode) {
    const act = this.activeLayer();
    if (!act) return;
    const isOp = act.kind === 'operad';
    const node = isOp ? this.getInspectedNode() : null;
    const snap = JSON.stringify(act);
    const startX = this._mouseX || window.innerWidth / 2;
    const startY = this._mouseY || window.innerHeight / 2;
    if (this.doc.autoLOD !== false) SE.live.drag = true;

    const init = {
      dx: act.dx || 0,
      dy: act.dy || 0,
      scale: act.scale || 1,
      rot: act.rot || 0,
      opacity: act.opacity == null ? 1 : act.opacity,
      harm: act.harm || 0,
      levels: act.levels || 4,
      nx: node && node.t ? (node.t.x || 0) : 0,
      ny: node && node.t ? (node.t.y || 0) : 0,
      ns: node && node.t ? (node.t.s == null ? 1 : node.t.s) : 1,
      nr: node && node.t ? (node.t.r || 0) : 0,
      opN: node && node.p ? (node.p.n || node.p.K || node.p.levels || 5) : 5
    };

    const labels = {
      G: 'GRAB / TRANSLATE',
      S: 'SCALE',
      R: 'ROTATE',
      H: 'HARMONICS / FOURIER K',
      B: 'BANDS / COUNT',
      O: 'OPACITY'
    };
    this._modal = { mode, snap, startX, startY, init };
    this.ui.modalHud = `MODAL [${mode}] ${labels[mode]} · Move mouse ↔ · Click/Enter to commit · Esc to cancel`;
    this.render();
  }

  updateModalScrub(ev) {
    if (!this._modal) return;
    const { mode, startX, startY, init } = this._modal;
    const mult = ev.shiftKey ? 0.15 : 1.0;
    const dxPx = (ev.clientX - startX) * mult;
    const dyPx = (ev.clientY - startY) * mult;
    const act = this.activeLayer();
    if (!act) return;
    const isOp = act.kind === 'operad';
    const node = isOp ? this.getInspectedNode() : null;

    if (mode === 'G') {
      if (isOp && node && node.id !== 'root') {
        node.t.x = Math.round(init.nx + dxPx * 1.4);
        node.t.y = Math.round(init.ny + dyPx * 1.4);
        SE.invalidate(act.root);
        this.ui.modalHud = `MODAL [G] GRAB: (${node.t.x}, ${node.t.y}) · Click/Enter commit · Esc cancel`;
      } else {
        act.dx = +(init.dx + dxPx / 450).toFixed(3);
        act.dy = +(init.dy + dyPx / 450).toFixed(3);
        this.ui.modalHud = `MODAL [G] GRAB: (${act.dx}, ${act.dy}) · Click/Enter commit · Esc cancel`;
      }
    } else if (mode === 'S') {
      const factor = Math.max(0.1, Math.min(5.0, 1 + dxPx / 220));
      if (isOp && node && node.id !== 'root') {
        node.t.s = +(init.ns * factor).toFixed(3);
        SE.invalidate(act.root);
        this.ui.modalHud = `MODAL [S] SCALE: ${node.t.s}× · Click/Enter commit · Esc cancel`;
      } else {
        act.scale = +(init.scale * factor).toFixed(3);
        this.ui.modalHud = `MODAL [S] SCALE: ${act.scale}× · Click/Enter commit · Esc cancel`;
      }
    } else if (mode === 'R') {
      const deg = dxPx * 0.6;
      if (isOp && node && node.id !== 'root') {
        node.t.r = init.nr + (deg * Math.PI / 180);
        SE.invalidate(act.root);
        this.ui.modalHud = `MODAL [R] ROTATE: ${Math.round(node.t.r * 180 / Math.PI)}° · Click/Enter commit · Esc cancel`;
      } else {
        act.rot = Math.round(init.rot + deg);
        this.ui.modalHud = `MODAL [R] ROTATE: ${act.rot}° · Click/Enter commit · Esc cancel`;
      }
    } else if (mode === 'H') {
      if (isOp && node && node.kind === 'op') {
        node.p = node.p || {};
        const k = Math.max(1, Math.min(48, Math.round(init.opN + dxPx / 14)));
        if ('K' in node.p) node.p.K = k;
        else if ('n' in node.p) node.p.n = Math.min(24, k);
        SE.invalidate(act.root);
        this.ui.modalHud = `MODAL [H] HARMONIC / K: ${k} · Click/Enter commit · Esc cancel`;
      } else {
        act.harm = Math.max(0, Math.min(64, Math.round(init.harm + dxPx / 8)));
        this.ui.modalHud = `MODAL [H] FOURIER HARMONICS: ${act.harm} · Click/Enter commit · Esc cancel`;
      }
    } else if (mode === 'B') {
      if (isOp && node && node.kind === 'op') {
        node.p = node.p || {};
        const n = Math.max(2, Math.min(16, Math.round(init.opN + dxPx / 24)));
        if ('levels' in node.p) { node.p.levels = Math.min(8, n); if (node.op === 'ingest') SE.retrace(node); }
        else if ('n' in node.p) node.p.n = n;
        SE.invalidate(act.root);
        this.ui.modalHud = `MODAL [B] COUNT / BANDS: ${n} · Click/Enter commit · Esc cancel`;
      } else {
        act.levels = Math.max(2, Math.min(8, Math.round(init.levels + dxPx / 35)));
        this.ui.modalHud = `MODAL [B] TONE PLATES: ${act.levels} · Click/Enter commit · Esc cancel`;
      }
    } else if (mode === 'O') {
      act.opacity = +Math.max(0.05, Math.min(1, init.opacity + dxPx / 250)).toFixed(2);
      this.ui.modalHud = `MODAL [O] OPACITY: ${Math.round(act.opacity * 100)}% · Click/Enter commit · Esc cancel`;
    }
    this.recompute();
  }

  commitModalScrub() {
    if (!this._modal) return;
    this._modal = null;
    SE.live.drag = false;
    this.ui.modalHud = '';
    const act = this.activeLayer();
    if (act && act.kind === 'operad' && act.root) SE.invalidate(act.root);
    this.recompute();
  }

  cancelModalScrub() {
    if (!this._modal) return;
    const { snap } = this._modal;
    this._modal = null;
    SE.live.drag = false;
    this.ui.modalHud = '';
    try {
      const restored = JSON.parse(snap);
      this.doc.layers[this.doc.activeLayer] = restored;
      if (restored.kind === 'operad' && restored.root) SE.invalidate(restored.root);
    } catch (e) {}
    this.recompute();
  }
